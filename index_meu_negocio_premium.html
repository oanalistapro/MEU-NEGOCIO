function header(title,subtitle){return `<div class="hero"><h2>${title}</h2><p>${subtitle}</p></div>`}
function stat(label,val){return `<div class="card"><small>${label}</small><strong>${val}</strong></div>`}
function stats(){const paid=db.financeiro.filter(x=>x.status==='Pago');const rec=paid.filter(x=>x.tipo==='Receita').reduce((s,x)=>s+num(x.valor),0),exp=paid.filter(x=>x.tipo==='Despesa').reduce((s,x)=>s+num(x.valor),0),pending=db.financeiro.filter(x=>x.status==='Pendente');return {rec,exp,balance:rec-exp,receive:pending.filter(x=>x.tipo==='Receita').reduce((s,x)=>s+num(x.valor),0),pay:pending.filter(x=>x.tipo==='Despesa').reduce((s,x)=>s+num(x.valor),0),late:pending.filter(x=>x.vencimento&&x.vencimento<today()).length}}
function route(p){current=p;$('pageTitle').textContent=MENU.find(m=>m[0]===p)?.[2]||p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function formFields(fields,values={}){return fields.map(f=>{const [key,label,type='text',required=false,opts=[]]=f,v=values[key]??'';let input;if(type==='select')input=`<select name="${key}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='textarea')input=`<textarea name="${key}">${esc(v)}</textarea>`;else input=`<input name="${key}" type="${type}" value="${esc(v)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`;return `<div class="field"><label>${esc(label)}${required?' *':''}</label>${input}</div>`}).join('')}
function panel(kind){const s=SCHEMA[kind];return `<div class="panel"><h3>${s.name} (${db[kind].length})</h3><div class="tools"><button onclick="openForm('${kind}')">＋ Novo cadastro</button><button class="secondary" onclick="csv('${kind}')">CSV</button><button class="secondary" onclick="xls('${kind}')">Excel</button></div><input class="search" placeholder="Pesquisar ${esc(s.name.toLowerCase())}" oninput="searchRows('${kind}',this.value)"><div class="tablewrap"><table id="table_${kind}"><thead><tr>${s.fields.slice(0,4).map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${db[kind].map(x=>`<tr>${s.fields.slice(0,4).map(f=>`<td>${esc(f[2]==='number'&&/valor|preco|custo|salario/i.test(f[0])?money(x[f[0]]):x[f[0]])}</td>`).join('')}<td><button class="mini" onclick="detail('${kind}','${x.id}')">Ver</button><button class="mini" onclick="openForm('${kind}','${x.id}')">Editar</button><button class="mini" onclick="removeItem('${kind}','${x.id}')">Excluir</button></td></tr>`).join('')||`<tr><td colspan="5" class="muted">Nenhum registro cadastrado.</td></tr>`}</tbody></table></div></div>`}
function searchRows(kind,q){document.querySelectorAll(`#table_${kind} tbody tr`).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function modal(title,html){$('overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modalinner"><div class="modalheader"><h2>${esc(title)}</h2><button class="secondary" onclick="closeModal()">✕ Fechar</button></div>${html}</div></div>`}
function closeModal(){$('overlay').innerHTML=''}
function openForm(kind,recordId){const x=db[kind].find(v=>v.id===recordId)||{};modal((recordId?'Editar: ':'Novo: ')+SCHEMA[kind].name,`<form id="editForm" class="formgrid">${formFields(SCHEMA[kind].fields,x)}<div class="wide tools"><button>Salvar registro</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);$('editForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));for(const f of SCHEMA[kind].fields)if(f[2]==='number')o[f[0]]=num(o[f[0]]);if(kind==='produtos'&&recordId&&num(o.quantidade)!==num(x.quantidade)){alert('Para ajustar a quantidade de produto existente, use Movimentar estoque, preservando o histórico.');return}o.id=recordId||id();o.createdAt=x.createdAt||new Date().toISOString();o.updatedAt=new Date().toISOString();if(change(()=>{if(recordId)db[kind]=db[kind].map(v=>v.id===recordId?o:v);else db[kind].unshift(o);audit(recordId?'Editou '+kind:'Cadastrou '+kind,o.id)})){closeModal();render()}}}
function detail(kind,recordId){const x=db[kind].find(v=>v.id===recordId);if(!x)return;modal('Detalhes — '+SCHEMA[kind].name,`<div class="formgrid">${SCHEMA[kind].fields.map(f=>`<div class="card"><small>${esc(f[1])}</small><div style="white-space:pre-wrap">${esc(x[f[0]])||'—'}</div></div>`).join('')}</div><div class="tools"><button onclick="printRecord('${kind}','${recordId}')">Imprimir / PDF</button><button class="secondary" onclick="closeModal();openForm('${kind}','${recordId}')">Editar</button></div>`)}
function removeItem(kind,recordId){if(kind==='produtos'&&db.vendas.some(v=>v.itens?.some(i=>i.produtoId===recordId)))return alert('Produto com histórico de vendas não pode ser excluído. Marque-o como Inativo.');if(!confirm('Excluir este registro?'))return;if(change(()=>{db[kind]=db[kind].filter(v=>v.id!==recordId);audit('Excluiu '+kind,recordId)}))render()}
function csv(kind){const f=SCHEMA[kind].fields;const rows=[f.map(x=>x[1]),...db[kind].map(v=>f.map(x=>v[x[0]]??''))];dl(kind+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function xls(kind){const f=SCHEMA[kind].fields;const rows=[f.map(x=>x[1]),...db[kind].map(v=>f.map(x=>v[x[0]]??''))];dl(kind+'.xls','\ufeff<html><head><meta charset="UTF-8"></head><body><table border="1">'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></body></html>','application/vnd.ms-excel')}
function printHTML(html){const w=window.open('','_blank');if(!w)return alert('Permita a janela de impressão.');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Documento</title><style>body{font:14px/1.6 Arial;max-width:800px;margin:35px auto;color:#182738}h1{color:#225a92}td,th{border:1px solid #ccc;padding:8px}table{border-collapse:collapse;width:100%}@media print{@page{size:A4;margin:18mm}}</style></head><body>'+html+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function printRecord(kind,recordId){const x=db[kind].find(v=>v.id===recordId);if(!x)return;printHTML(`<h1>${esc(SCHEMA[kind].name)}</h1><h2>${esc(name())}</h2>`+SCHEMA[kind].fields.map(f=>`<p><b>${esc(f[1])}:</b> ${esc(x[f[0]])}</p>`).join(''))}
function companyPanel(){return `<div class="panel"><h3>Cadastro completo da empresa</h3><form id="companyForm" class="formgrid">${formFields(COMPANY,db.empresa)}<div class="wide"><button>Salvar dados da empresa</button></div></form></div>`}
function wireCompany(){const f=$('companyForm');if(f)f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));if(change(()=>{db.empresa=o;audit('Atualizou empresa',o.razao)}))alert('Dados da empresa salvos.') }}
function stockMove(){if(!db.produtos.length)return alert('Cadastre um produto primeiro.');modal('Movimentar estoque',`<form id="moveForm" class="formgrid"><div class="field"><label>Produto</label><select name="produtoId" required>${db.produtos.filter(p=>p.tipo!=='Serviço').map(p=>`<option value="${p.id}">${esc(p.nome)} — saldo ${num(p.quantidade)}</option>`).join('')}</select></div><div class="field"><label>Operação</label><select name="tipo"><option>Entrada</option><option>Saída</option></select></div><div class="field"><label>Quantidade</label><input name="quantidade" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Motivo</label><input name="motivo" required></div><div class="field wide"><label>Observações</label><textarea name="observacoes"></textarea></div><div class="wide"><button>Confirmar movimentação</button></div></form>`);$('moveForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const p=db.produtos.find(x=>x.id===v.produtoId);const q=num(v.quantidade);if(!p||q<=0)return;if(v.tipo==='Saída'&&num(p.quantidade)<q)return alert('Estoque insuficiente.');if(change(()=>{p.quantidade=num(p.quantidade)+(v.tipo==='Entrada'?q:-q);db.movimentos.unshift({...v,id:id(),quantidade:q,data:today(),produto:p.nome});audit('Movimentação de estoque',p.nome)})){closeModal();render()}}}
function saleEditor(){saleItems=[];modal('Nova venda integrada',`<div class="notice">A confirmação registra a venda, baixa o estoque de produtos e cria uma conta a receber pendente. Tudo é salvo na mesma operação local.</div><form id="saleForm" class="formgrid" style="margin-top:15px"><div class="field"><label>Cliente *</label><select name="clienteId" required><option value="">Selecione</option>${db.clientes.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div><div class="field"><label>Vencimento *</label><input type="date" name="vencimento" value="${today()}" required></div><div class="field"><label>Forma de pagamento</label><select name="forma"><option>Não definida</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>Transferência</option></select></div><div class="field"><label>Desconto (R$)</label><input name="desconto" type="number" value="0" min="0" step="0.01"></div><div class="wide tools"><select id="saleProduct" class="search" style="max-width:380px">${db.produtos.filter(p=>p.status!=='Inativo').map(p=>`<option value="${p.id}">${esc(p.nome)} — ${money(p.preco)}</option>`).join('')}</select><input id="saleQty" type="number" min="0.01" step="0.01" value="1" style="width:90px;padding:10px"><button type="button" class="secondary" onclick="addSaleItem()">Adicionar item</button></div><div id="saleLines" class="wide"></div><div class="wide"><button>Confirmar venda</button></div></form>`);drawSaleItems();$('saleForm').onsubmit=confirmSale}
function addSaleItem(){const p=db.produtos.find(x=>x.id===$('saleProduct').value),q=num($('saleQty').value);if(!p||q<=0)return alert('Escolha um item e quantidade válida.');const existing=saleItems.find(x=>x.produtoId===p.id);if(existing)existing.quantidade+=q;else saleItems.push({produtoId:p.id,nome:p.nome,quantidade:q,preco:num(p.preco),tipo:p.tipo});drawSaleItems()}
function drawSaleItems(){if(!$('saleLines'))return;$('saleLines').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Qtd.</th><th>Preço</th><th>Subtotal</th><th>Ação</th></tr></thead><tbody>${saleItems.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${x.quantidade}</td><td>${money(x.preco)}</td><td>${money(x.preco*x.quantidade)}</td><td><button type="button" class="mini" onclick="saleItems.splice(${i},1);drawSaleItems()">Remover</button></td></tr>`).join('')}</tbody></table></div><h3>Subtotal: ${money(saleItems.reduce((s,x)=>s+x.quantidade*x.preco,0))}</h3>`}
function confirmSale(e){e.preventDefault();if(!saleItems.length)return alert('Adicione itens à venda.');const v=Object.fromEntries(new FormData(e.target)),cliente=db.clientes.find(x=>x.id===v.clienteId);if(!cliente)return alert('Selecione um cliente.');for(const i of saleItems){const p=db.produtos.find(x=>x.id===i.produtoId);if(!p||p.status==='Inativo')return alert('Um item não está disponível.');if(p.tipo!=='Serviço'&&num(p.quantidade)<i.quantidade)return alert('Estoque insuficiente para '+p.nome)}const subtotal=saleItems.reduce((s,x)=>s+x.quantidade*x.preco,0),desconto=num(v.desconto);if(desconto<0||desconto>subtotal)return alert('Desconto inválido.');const saleId=id(),numero='VEN-'+Date.now().toString().slice(-8),total=subtotal-desconto,items=saleItems.map(x=>({...x}));if(change(()=>{db.vendas.unshift({id:saleId,numero,cliente:cliente.nome,clienteId:cliente.id,itens:items,subtotal,desconto,total,data:today(),status:'Confirmada'});for(const i of items){const p=db.produtos.find(x=>x.id===i.produtoId);if(p.tipo!=='Serviço'){p.quantidade=num(p.quantidade)-i.quantidade;db.movimentos.unshift({id:id(),produtoId:p.id,produto:p.nome,tipo:'Saída',quantidade:i.quantidade,motivo:'Venda '+numero,referencia:saleId,data:today()})}}db.financeiro.unshift({id:id(),descricao:'Venda '+numero,tipo:'Receita',valor:total,categoria:'Vendas',parte:cliente.nome,emissao:today(),vencimento:v.vencimento,status:'Pendente',forma:v.forma,documento:numero,referencia:saleId});audit('Venda confirmada',numero)})){closeModal();render();alert('Venda registrada! Estoque e financeiro atualizados.')}}
function saleList(){return `<div class="panel"><h3>Vendas integradas (${db.vendas.length})</h3><div class="tools"><button onclick="saleEditor()">＋ Nova venda</button></div><div class="tablewrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Ações</th></tr></thead><tbody>${db.vendas.map(v=>`<tr><td>${esc(v.numero)}</td><td>${esc(v.cliente)}</td><td>${esc(v.data)}</td><td>${v.itens?.length||0}</td><td>${money(v.total)}</td><td><button class="mini" onclick="printSale('${v.id}')">Imprimir / PDF</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma venda registrada.</td></tr>'}</tbody></table></div></div>`}
function printSale(recordId){const v=db.vendas.find(x=>x.id===recordId);if(!v)return;printHTML(`<h1>COMPROVANTE GERENCIAL DE VENDA</h1><h2>${esc(name())}</h2><p>${esc(v.numero)} — ${esc(v.data)}</p><p>Cliente: ${esc(v.cliente)}</p><table><tr><th>Item</th><th>Quantidade</th><th>Preço</th><th>Total</th></tr>${v.itens.map(i=>`<tr><td>${esc(i.nome)}</td><td>${i.quantidade}</td><td>${money(i.preco)}</td><td>${money(i.quantidade*i.preco)}</td></tr>`).join('')}</table><h2>Total: ${money(v.total)}</h2><p>Documento gerencial. Não substitui nota fiscal.</p>`)}
const TYPES=['Recibo','Contrato','Declaração','Proposta','Ata','Carta','Requerimento','Ordem de serviço'];
function docEditor(type='Recibo',recordId){const old=db.documentos.find(x=>x.id===recordId);docDraft=old||{tipo:type,titulo:type.toUpperCase(),numero:'DOC-'+Date.now().toString().slice(-7),data:today(),emitente:'',destinatario:'',assunto:'',valor:0,conteudo:'',cidade:db.empresa.cidade||''};modal('Central Office — '+type,`<div class="tools"><button onclick="saveDoc()">Salvar documento</button><button onclick="docWord()" class="secondary">Word (.doc)</button><button onclick="docExcel()" class="secondary">Excel (.xls)</button><button onclick="docPrint()" class="secondary">Imprimir / PDF</button></div><div class="formgrid"><div><div class="formgrid" id="docFields">${formFields([['tipo','Modelo','select',0,TYPES],['titulo','Título','text',1],['numero','Número'],['emitente','Emitente / responsável'],['destinatario','Destinatário'],['assunto','Assunto / objeto','textarea'],['valor','Valor (R$)','number'],['data','Data','date'],['cidade','Cidade'],['conteudo','Conteúdo e cláusulas adicionais','textarea']],docDraft)}</div><div class="tools"><button class="secondary" onclick="previewDoc()">Atualizar prévia</button></div></div><div style="background:#25435c;border-radius:12px;padding:10px"><article class="paper" id="printSheet"></article></div></div>`);$('docFields').querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',previewDoc));previewDoc()}
function docValues(){const out={};$('docFields').querySelectorAll('[name]').forEach(x=>out[x.name]=x.value);out.valor=num(out.valor);return out}
function docBody(d){const a=d.emitente||'[NOME DO EMITENTE]',b=d.destinatario||'[DESTINATÁRIO]',subject=d.assunto||'[DESCREVA O OBJETO]',extra=d.conteudo||'[INSIRA AS CONDIÇÕES E DETALHES NECESSÁRIOS]',date=d.data?d.data.split('-').reverse().join('/'):'';const common=`${d.cidade||'[CIDADE]'}, ${date}.`;switch(d.tipo){case 'Recibo':return `Eu, ${a}, declaro ter recebido de ${b} a quantia de ${money(d.valor)}, referente a ${subject}.\n\n${extra}\n\n${common}`;case 'Contrato':return `MINUTA DE CONTRATO\n\nCONTRATANTE: ${a}\nCONTRATADO(A): ${b}\n\nCLÁUSULA 1 — OBJETO\n${subject}\n\nCLÁUSULA 2 — VALOR\n${money(d.valor)}\n\nCLÁUSULA 3 — CONDIÇÕES\n${extra}\n\n${common}\n\nMinuta sujeita à revisão jurídica.`;case 'Declaração':return `Eu, ${a}, declaro para os devidos fins:\n\n${subject}\n\n${extra}\n\n${common}`;case 'Proposta':return `PROPONENTE: ${a}\nCLIENTE: ${b}\n\nOBJETO\n${subject}\n\nVALOR PROPOSTO\n${money(d.valor)}\n\nCONDIÇÕES\n${extra}\n\n${common}`;default:return `Emitente: ${a}\nDestinatário: ${b}\n\nASSUNTO\n${subject}\n\n${extra}\n\n${common}`}}
function docHTML(d){const c=db.empresa;return `<div class="letterhead"><h2>${esc(name())}</h2><small>${esc([c.cnpj?'CNPJ: '+c.cnpj:'',c.endereco,c.cidade,c.uf,c.telefone,c.email].filter(Boolean).join(' • '))}</small></div><h1>${esc(d.titulo||d.tipo)}</h1><p style="text-align:right;font-size:12px;color:#64748b">Nº ${esc(d.numero)} — ${esc(d.data)}</p><div class="content">${esc(docBody(d))}</div><div class="signature">____________________________________<br>${esc(d.emitente||'Responsável')}<br>Assinatura</div><footer>${esc(name())} • Documento gerado no MEU NEGÓCIO PRO</footer>`}
function previewDoc(){if(!$('printSheet'))return;docDraft={...docDraft,...docValues()};$('printSheet').innerHTML=docHTML(docDraft)}
function saveDoc(){previewDoc();if(!docDraft.titulo.trim()||!docDraft.assunto.trim())return alert('Preencha título e assunto.');const rec={...docDraft,id:docDraft.id||id(),updatedAt:new Date().toISOString()};if(change(()=>{db.documentos=db.documentos.filter(x=>x.id!==rec.id);db.documentos.unshift(rec);audit('Salvou documento',rec.numero)})){docDraft=rec;alert('Documento salvo!')}}
function docWord(){previewDoc();dl('documento-'+Date.now()+'.doc','\ufeff<html><head><meta charset="utf-8"><style>body{font:12pt/1.7 Arial}.content{white-space:pre-wrap}.letterhead{border-bottom:3px solid #235e98}.signature{text-align:center;margin-top:80px}</style></head><body>'+$('printSheet').innerHTML+'</body></html>','application/msword')}
function docExcel(){previewDoc();const rows=Object.entries(docDraft).filter(([k])=>k!=='id');dl('documento-'+Date.now()+'.xls','\ufeff<html><head><meta charset="utf-8"></head><body><table border="1">'+rows.map(([k,v])=>'<tr><th>'+esc(k)+'</th><td>'+esc(v)+'</td></tr>').join('')+'</table></body></html>','application/vnd.ms-excel')}
function docPrint(){previewDoc();window.print()}
function documents(){return header('📄 Central de documentos','Modelos com cabeçalho empresarial, pré-visualização, Word compatível, planilha compatível e impressão em PDF.')+`<div class="panel"><h3>Criar documento</h3><div class="tiles">${TYPES.map(t=>`<button class="tile" onclick="docEditor('${t}')"><span>📄</span><b>${t}</b><small>Editar modelo</small></button>`).join('')}</div></div><div class="panel"><h3>Documentos salvos (${db.documentos.length})</h3><div class="tablewrap"><table><thead><tr><th>Título</th><th>Tipo</th><th>Data</th><th>Ações</th></tr></thead><tbody>${db.documentos.map(d=>`<tr><td>${esc(d.titulo)}</td><td>${esc(d.tipo)}</td><td>${esc(d.data)}</td><td><button class="mini" onclick="docEditor('${esc(d.tipo)}','${d.id}')">Abrir</button><button class="mini" onclick="deleteDoc('${d.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum documento salvo.</td></tr>'}</tbody></table></div></div>`}
function deleteDoc(recordId){if(!confirm('Excluir documento?'))return;if(change(()=>db.documentos=db.documentos.filter(x=>x.id!==recordId)))render()}
function backup(){dl('meu-negocio-pro-backup-'+today()+'.json',JSON.stringify({app:'MEU-NEGOCIO-PRO',version:2,data:db},null,2),'application/json')}
async function restore(input){const file=input.files?.[0];if(!file)return;if(file.size>10e6)return alert('Arquivo grande demais.');try{const parsed=JSON.parse(await file.text());if(parsed.app!=='MEU-NEGOCIO-PRO'||parsed.version!==2||!parsed.data||!Array.isArray(parsed.data.financeiro)||!Array.isArray(parsed.data.produtos))throw Error('Formato inválido');if(!confirm('Substituir TODOS os dados deste teste pelo backup?'))return;const next=empty();for(const k of Object.keys(next)){if(Array.isArray(next[k])&&Array.isArray(parsed.data[k]))next[k]=parsed.data[k];else if(k==='empresa'&&parsed.data.empresa&&typeof parsed.data.empresa==='object')next[k]=parsed.data.empresa}if(change(()=>db=next))render()}catch(e){alert('Backup inválido ou incompatível.')}input.value=''}
function reports(){const s=stats(),stock=db.produtos.filter(x=>x.tipo!=='Serviço');return header('📊 Indicadores e segurança','Dados calculados com base nos registros salvos neste navegador.')+`<div class="cards">${stat('Saldo realizado',money(s.balance))}${stat('A receber',money(s.receive))}${stat('A pagar',money(s.pay))}${stat('Contas vencidas',s.late)}${stat('Clientes',db.clientes.length)}${stat('Fornecedores',db.fornecedores.length)}${stat('Funcionários',db.funcionarios.length)}${stat('Vendas',db.vendas.length)}${stat('Estoque baixo',stock.filter(x=>num(x.quantidade)<=num(x.minimo)).length)}${stat('Projetos',db.projetos.length)}${stat('Tarefas',db.tarefas.length)}${stat('Documentos',db.documentos.length)}</div><div class="panel"><h3>Backup e restauração</h3><p class="notice">Os dados não são sincronizados entre aparelhos. Faça backup antes de limpar o navegador ou atualizar versões.</p><div class="tools"><button onclick="backup()">Baixar backup JSON</button><button class="secondary" onclick="$('restoreInput').click()">Restaurar backup</button><input id="restoreInput" class="hide" type="file" accept=".json" onchange="restore(this)"></div></div><div class="panel"><h3>Auditoria local</h3><div class="tablewrap"><table><tr><th>Data</th><th>Ação</th><th>Referência</th></tr>${db.auditoria.slice(0,30).map(a=>`<tr><td>${esc(new Date(a.data).toLocaleString('pt-BR'))}</td><td>${esc(a.acao)}</td><td>${esc(a.referencia)}</td></tr>`).join('')}</table></div></div>`}
function home(){const s=stats();return header('Seu negócio, sob controle','Cadastre sua empresa, gerencie operações e acompanhe resultados em um só painel.')+`<div class="cards">${stat('Saldo realizado',money(s.balance))}${stat('A receber',money(s.receive))}${stat('A pagar',money(s.pay))}${stat('Clientes',db.clientes.length)}</div><div class="bp-insights"><div class="bp-box"><h3>Visão de desempenho</h3><p>Gráfico ilustrativo de interface • dados demonstrativos, não representam faturamento real</p><div class="bp-chart"><i style="--h:38%"></i><i style="--h:58%"></i><i style="--h:46%"></i><i style="--h:74%"></i><i style="--h:63%"></i><i style="--h:87%"></i><i style="--h:71%"></i><i style="--h:96%"></i></div></div><div class="bp-box"><h3>Acesso rápido</h3><p>Atalhos para as principais operações</p><div class="bp-quick"><button onclick="route('vendas')">🛒 Nova venda</button><button onclick="route('financeiro')">💳 Financeiro</button><button onclick="route('documentos')">📄 Documentos</button><button onclick="route('estoque')">📦 Estoque</button><button onclick="route('relatorios')">📊 Relatórios</button><button onclick="route('gestao')">🏢 Minha empresa</button></div></div></div><h2>Departamentos</h2><div class="tiles">${MENU.slice(1).map(m=>`<button class="tile" onclick="route('${m[0]}')"><span>${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small></button>`).join('')}</div><div class="panel"><h3>Comece aqui</h3><p class="muted">1. Cadastre a empresa. 2. Adicione clientes e produtos. 3. Registre uma venda integrada. 4. Confira financeiro, estoque e relatórios.</p><button onclick="route('gestao')">Cadastrar minha empresa</button></div>`}
function render(){let html='';switch(current){case 'home':html=home();break;case 'gestao':html=header('🏢 Gestão empresarial','Empresa, filiais e fornecedores com informações detalhadas.')+companyPanel()+panel('filiais')+panel('fornecedores');break;case 'financeiro':{const s=stats();html=header('💳 Financeiro','Controle de receitas, despesas, vencimentos e pagamentos.')+`<div class="cards">${stat('Recebido',money(s.rec))}${stat('Pago',money(s.exp))}${stat('A receber',money(s.receive))}${stat('A pagar',money(s.pay))}</div>`+panel('financeiro');break}case 'vendas':html=header('🛒 Vendas e CRM','Vendas confirmadas geram contas a receber e baixam estoque automaticamente.')+saleList()+panel('clientes')+panel('atendimentos');break;case 'documentos':html=documents();break;case 'rh':html=header('👥 Recursos humanos','Cadastro funcional, jornadas, remuneração, férias e treinamentos. Não substitui folha oficial.')+panel('funcionarios');break;case 'estoque':html=header('📦 Estoque e compras','Controle de produtos, pedidos e movimentações rastreáveis.')+`<div class="tools"><button onclick="stockMove()">＋ Movimentar estoque</button></div>`+panel('produtos')+panel('compras')+`<div class="panel"><h3>Histórico de movimentações</h3><div class="tablewrap"><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>${db.movimentos.map(m=>`<tr><td>${esc(m.data)}</td><td>${esc(m.produto||db.produtos.find(p=>p.id===m.produtoId)?.nome)}</td><td>${esc(m.tipo)}</td><td>${esc(m.quantidade)}</td><td>${esc(m.motivo)}</td></tr>`).join('')}</table></div></div>`;break;case 'fiscal':html=header('🧾 Fiscal e contábil','Organização gerencial de registros. Não emite NF-e, NFS-e nem apura tributos oficiais.')+panel('fiscais');break;case 'operacoes':html=header('📋 Operações','Projetos, tarefas, ordens de serviço, prazos e equipes.')+panel('projetos')+panel('tarefas');break;case 'relatorios':html=reports();break;case 'ia':{const s=stats();html=header('✨ BUSINESS IA — diagnóstico local','Indicadores e recomendações baseadas em regras; não é uma IA generativa conectada.')+`<div class="panel"><h3>Diagnóstico automático</h3><p class="notice">${s.late?'Há '+s.late+' conta(s) vencida(s) que precisam de atenção.':'Nenhuma conta vencida identificada.'}</p><p class="notice">${s.balance<0?'As despesas pagas superam as receitas recebidas. Revise o fluxo de caixa.':'Saldo realizado atual: '+money(s.balance)+'.'}</p><p class="notice">${db.produtos.filter(p=>p.tipo!=='Serviço'&&num(p.quantidade)<=num(p.minimo)).length} produto(s) no nível mínimo ou abaixo.</p></div>`;break}}$('view').innerHTML=html;wireCompany()}
MENU.forEach(m=>{const b=document.createElement('button');b.className='nav';b.dataset.page=m[0];b.textContent=m[1]+' '+m[2];b.onclick=()=>route(m[0]);$('nav').append(b)});route('home');
</script></body></html>
