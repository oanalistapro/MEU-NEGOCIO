
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081b30">
<title>Anjo Celestial — Cinema 3D</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 min-height:100%;
 overflow:hidden;
 background:#081b30;
 font-family:Arial,sans-serif;
}
.scene{
 position:relative;
 width:100vw;
 height:100vh;
 height:100dvh;
 overflow:hidden;
 perspective:1100px;
 isolation:isolate;
 background:
 radial-gradient(ellipse at 70% 10%,
 #fff1b8 0%,transparent 25%),
 linear-gradient(
 180deg,
 #163b70 0%,
 #438bd1 35%,
 #a6d9f4 65%,
 #e6f6d1 100%
 );
}

/* Luz do céu */
.sun{
 position:absolute;
 width:55vmin;
 height:55vmin;
 right:-8%;
 top:-20%;
 border-radius:50%;
 background:radial-gradient(circle,
 #fff 0%,#fff6c6 13%,
 #ffd77b88 38%,transparent 72%);
 filter:blur(8px);
 animation:sunPulse 7s ease-in-out infinite;
}

/* Raios luminosos */
.rays{
 position:absolute;
 inset:-30%;
 background:
 repeating-conic-gradient(
 from 210deg at 75% 10%,
 #fff6ca44 0deg 3deg,
 transparent 4deg 15deg
 );
 opacity:.5;
 animation:rayMove 30s linear infinite;
}

/* Montanhas e terra verde */
.landscape{
 position:absolute;
 inset:0;
 transform:translateZ(-150px) scale(1.18);
 background:
 radial-gradient(ellipse at 50% 112%,
 #154a24 0%,#287c36 24%,
 transparent 58%),
 radial-gradient(ellipse at 0% 105%,
 #0d502b 0%,#3c9952 38%,
 transparent 64%),
 radial-gradient(ellipse at 100% 110%,
 #155c38 0%,#62b46c 40%,
 transparent 65%);
}
.mountain{
 position:absolute;
 bottom:-8%;
 width:100%;
 height:40%;
 background:linear-gradient(
 150deg,#8acb81,#246a40 55%,#123f32);
 clip-path:polygon(
 0 55%,15% 20%,27% 48%,
 43% 0,60% 55%,76% 18%,
 100% 55%,100% 100%,0 100%
 );
 opacity:.85;
}
.mountain.back{
 bottom:6%;
 opacity:.32;
 filter:blur(10px);
 transform:scale(1.3);
}

/* Nuvens */
.cloud{
 position:absolute;
 width:55vw;
 height:15vw;
 min-height:65px;
 border-radius:50%;
 background:radial-gradient(ellipse,
 #ffffffbd 0%,#ffffff80 35%,
 transparent 72%);
 filter:blur(15px);
 animation:cloudDrift 26s linear infinite alternate;
}
.cloud.one{top:18%;left:-20%}
.cloud.two{
 top:43%;right:-25%;
 opacity:.75;
 animation-duration:36s;
 animation-direction:alternate-reverse;
}
.cloud.three{
 top:65%;left:8%;
 opacity:.4;
 animation-duration:42s;
}

/* Anjo */
.angel-container{
 position:absolute;
 left:50%;
 top:46%;
 width:min(75vw,540px);
 height:min(90vh,720px);
 transform-style:preserve-3d;
 animation:angelFall 13s ease-in-out infinite alternate;
 will-change:transform;
}
.angel{
 position:absolute;
 inset:0;
 background:url("anjo.png") center/contain no-repeat;
 filter:
 drop-shadow(0 0 18px #fff6cc)
 drop-shadow(0 0 48px #ffe48b99);
 animation:angelTilt 9s ease-in-out infinite alternate;
 z-index:3;
}

/* Aura celestial */
.aura{
 position:absolute;
 left:50%;
 top:48%;
 width:115%;
 aspect-ratio:1;
 border-radius:50%;
 transform:translate(-50%,-50%);
 background:radial-gradient(circle,
 #fff9dfb0 0%,
 #ffe17b6b 22%,
 #ffdd6a25 48%,
 transparent 72%);
 filter:blur(25px);
 mix-blend-mode:screen;
 animation:auraPulse 5s ease-in-out infinite;
}
.aura-ring{
 position:absolute;
 left:50%;
 top:48%;
 width:85%;
 aspect-ratio:1;
 border:2px solid #fff4c477;
 border-radius:50%;
 box-shadow:
 0 0 28px #ffe79988,
 inset 0 0 30px #ffe79955;
 transform:translate(-50%,-50%) rotateX(65deg);
 animation:ringPulse 6s ease-in-out infinite;
}

/* Partículas */
.particle{
 position:absolute;
 width:4px;
 height:4px;
 border-radius:50%;
 background:#fff9c5;
 box-shadow:0 0 12px 3px #ffdf77;
 pointer-events:none;
 animation:particleFloat var(--duration) linear infinite;
 animation-delay:var(--delay);
 opacity:0;
}

/* Vinheta cinematográfica */
.vignette{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:radial-gradient(ellipse,
 transparent 35%,#06111c77 100%);
 z-index:8;
}

/* Controles */
.controls{
 position:absolute;
 bottom:calc(22px + env(safe-area-inset-bottom));
 left:50%;
 transform:translateX(-50%);
 z-index:15;
 display:flex;
 gap:10px;
}
.controls button{
 border:1px solid #ffffff55;
 color:white;
 background:#071b30b8;
 backdrop-filter:blur(15px);
 padding:12px 18px;
 border-radius:14px;
 font-weight:bold;
 box-shadow:0 5px 20px #0005;
 cursor:pointer;
}
.controls button:active{transform:scale(.96)}

/* Animações */
@keyframes angelFall{
 0%{
  transform:translate(-50%,-55%)
   translateY(-11vh) rotateZ(-3deg)
   rotateY(-4deg);
 }
 100%{
  transform:translate(-50%,-55%)
   translateY(11vh) rotateZ(3deg)
   rotateY(4deg);
 }
}
@keyframes angelTilt{
 0%{transform:rotateZ(-2deg) scale(1)}
 100%{transform:rotateZ(2deg) scale(1.035)}
}
@keyframes auraPulse{
 0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}
 50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
}
@keyframes ringPulse{
 0%,100%{opacity:.4;filter:blur(1px)}
 50%{opacity:.9;filter:blur(3px)}
}
@keyframes particleFloat{
 0%{opacity:0;transform:translate3d(0,35px,0) scale(.5)}
 20%{opacity:1}
 80%{opacity:.8}
 100%{
  opacity:0;
  transform:translate3d(var(--drift),-85vh,0) scale(1.4);
 }
}
@keyframes cloudDrift{
 from{transform:translateX(-12vw)}
 to{transform:translateX(18vw)}
}
@keyframes sunPulse{
 0%,100%{opacity:.75;transform:scale(.95)}
 50%{opacity:1;transform:scale(1.08)}
}
@keyframes rayMove{
 from{transform:rotate(0deg)}
 to{transform:rotate(8deg)}
}

.paused *,
.paused *::before,
.paused *::after{
 animation-play-state:paused!important;
}

@media(max-width:600px){
 .angel-container{
  width:95vw;
  height:75dvh;
  top:46%;
 }
 .cloud{width:90vw;height:25vw}
 .mountain{height:30%}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
 }
}
</style>
</head>

<body>
<div class="scene" id="scene">
 <div class="sun"></div>
 <div class="rays"></div>
 <div class="landscape">
  <div class="mountain back"></div>
  <div class="mountain"></div>
 </div>

 <div class="cloud one"></div>
 <div class="cloud two"></div>
 <div class="cloud three"></div>

 <div class="angel-container">
  <div class="aura"></div>
  <div class="aura-ring"></div>
  <div class="angel" role="img"
   aria-label="Anjo de asas brancas descendo suavemente"></div>
 </div>

 <div id="particles"></div>
 <div class="vignette"></div>

 <div class="controls">
  <button id="toggle">⏸ Pausar</button>
  <button id="fullscreen">⛶ Tela cheia</button>
 </div>
</div>

<script>
"use strict";
const scene=document.getElementById("scene");
const particles=document.getElementById("particles");
const toggle=document.getElementById("toggle");

const count=window.innerWidth<600?32:65;

for(let i=0;i<count;i++){
 const p=document.createElement("span");
 p.className="particle";
 p.style.left=Math.random()*100+"%";
 p.style.top=Math.random()*100+"%";
 p.style.setProperty("--duration",
  (7+Math.random()*13)+"s");
 p.style.setProperty("--delay",
  (-Math.random()*20)+"s");
 p.style.setProperty("--drift",
  ((Math.random()-.5)*220)+"px");
 const size=2+Math.random()*4;
 p.style.width=size+"px";
 p.style.height=size+"px";
 particles.appendChild(p);
}

toggle.addEventListener("click",()=>{
 const paused=scene.classList.toggle("paused");
 toggle.textContent=paused?"▶ Continuar":"⏸ Pausar";
});

document.getElementById("fullscreen")
 .addEventListener("click",async()=>{
 try{
  if(document.fullscreenElement){
   await document.exitFullscreen();
  }else if(scene.requestFullscreen){
   await scene.requestFullscreen();
  }
 }catch{
  alert("Tela cheia não disponível neste navegador.");
 }
});
</script>
</body>
</html>
