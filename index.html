<style>
:root{
--bg:#071321;--sidebar:#0a1b2f;--card:#10253c;
--card2:#162f4c;--line:#2c4967;--text:#eff6ff;
--muted:#a4bad2;--blue:#4b9dff;--green:#36d6a1;
--red:#ff788c;--orange:#ffc06b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--sidebar);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-size:22px;font-weight:900;padding:10px}
.logo span{color:var(--blue)}
.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:8px}
.nav{width:100%;display:block;background:none;color:var(--muted);border:0;padding:13px;text-align:left;border-radius:10px;margin:3px 0}
.nav:hover,.nav.active{background:#1c426c;color:#fff}
main{flex:1;min-width:0;padding:24px;max-width:1700px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:25px;margin:6px 0}
.muted{color:var(--muted)}
.hero{background:linear-gradient(110deg,#205a99,#10263e);padding:24px;border-radius:18px;border:1px solid #396b9d;margin:18px 0}
.hero h2{margin:0 0 8px;font-size:25px}
.hero p{margin:0;color:#c5dcf5;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}
.stat,.panel,.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:22px;margin-top:9px;overflow-wrap:anywhere}
.modules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{color:white;text-align:left;min-height:120px}
.tile:hover{border-color:var(--blue);transform:translateY(-2px)}
.tile .emoji{font-size:29px;display:block;margin-bottom:12px}
.tile small{display:block;color:var(--muted);margin-top:8px}
.panel{margin:15px 0}
.panel h3{margin:0 0 15px;font-size:19px}
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:15px 0}
.btn{background:var(--blue);color:#061526;border:0;border-radius:10px;padding:11px 15px;font-weight:750}
.btn.alt{background:var(--card2);color:white;border:1px solid var(--line)}
.btn.red{background:#673347;color:white}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{color:#b8d4f3;font-size:12px}
.field input,.field select,.field textarea,.search{
width:100%;background:#081b30;border:1px solid #3b5878;
border-radius:9px;padding:12px;color:white;min-height:45px
}
.field textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
.section-title{grid-column:1/-1;font-size:16px;font-weight:750;color:#a9d1ff;border-bottom:1px solid var(--line);padding:12px 0 7px;margin-top:8px}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:#b5cce5;font-size:12px}
td{overflow-wrap:anywhere}
.mini{background:#203e60;color:white;border:1px solid var(--line);padding:8px;border-radius:8px;margin:2px}
.empty{text-align:center;color:var(--muted);padding:20px}
.note{padding:14px;border:1px solid #31577c;background:#15334f;border-radius:10px;color:#c4dbf1;line-height:1.6}
.tag{display:inline-block;background:#1d456a;padding:5px 9px;border-radius:20px;font-size:11px;color:#b9d9ff}
.detail{background:#0a2036;border:1px solid var(--line);padding:16px;border-radius:12px;margin:12px 0}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.detail-grid div{border-bottom:1px solid var(--line);padding:7px}
.detail-grid small{display:block;color:var(--muted);margin-bottom:5px}
.mobile{display:none}
#toast{display:none;position:fixed;bottom:20px;right:20px;background:#205e51;color:white;padding:15px;border-radius:10px;z-index:50}
@media(max-width:1100px){
.modules{grid-template-columns:repeat(3,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
.sidebar{display:none}
main{padding:14px 12px 85px}
.modules{grid-template-columns:repeat(2,1fr);gap:9px}
.stats{gap:9px}
.stat{padding:12px}
.stat strong{font-size:17px}
.form,.detail-grid{grid-template-columns:1fr}
.hero{padding:19px}
.hero h2{font-size:21px}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#0a1b2f;border-top:1px solid var(--line);padding:9px;z-index:10}
.mobile button{background:none;border:0;color:#d3e7ff;padding:8px}
}
@media print{
.sidebar,.mobile,.top,.hero,.bar,.btn,.mini,.search{display:none!important}
body{background:white;color:black}
main{padding:0}
.panel,.stat,.detail{background:white;color:black;border:1px solid #bbb}
th,td{color:black}
}
</style>
</head>

function commit(fn){
const old=JSON.stringify(db);
fn();
if(!save()){db=JSON.parse(old);return false}
return true;
}

function fileDownload(name,content,type){
const url=URL.createObjectURL(new Blob([content],{type}));
const a=document.createElement("a");
a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function inputField(f,value="",prefix="x"){
const id=prefix+"_"+f.key;
let html;
if(f.type==="select"){
html=`<select id="${id}" name="${esc(f.key)}" ${f.required?"required":""}>
${f.options.map(o=>`<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
}else if(f.type==="textarea"){
html=`<textarea id="${id}" name="${esc(f.key)}" ${f.required?"required":""}>${esc(value)}</textarea>`;
}else{
const t=f.type==="money"?"number":f.type;
html=`<input id="${id}" name="${esc(f.key)}" type="${t}" value="${esc(value)}"
${f.required?"required":""}
${t==="number"?'step="'+(f.type==="money"?"0.01":"1")+'" min="0"':""}>`;
}
return `<div class="field"><label for="${id}">${esc(f.label)}${f.required?" *":""}</label>${html}</div>`;
}

function fieldsHTML(fields,values={},prefix="x"){
return fields.map(f=>f.section
?`<div class="section-title">${esc(f.section)}</div>`
:inputField(f,values[f.key]??"",prefix)).join("");
}

function hero(title,desc){
return `<div class="hero"><h2>${title}</h2><p>${desc}</p></div>`;

function stat(label,value){
return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`;
}

function totals(type,status="Pago"){
return db.financeiro.filter(x=>x.tipo===type&&x.status===status)
.reduce((s,x)=>s+financialTotal(x),0);
}

function financialTotal(x){
return Number(x.valor||0)-Number(x.desconto||0)+Number(x.juros||0)+Number(x.multa||0);
}

function newRecord(kind){
edit={kind,id:null};
$("form_"+kind).innerHTML=recordForm(kind);
bindRecord(kind);

}

function editRecord(kind,id){
const item=db[kind].find(x=>x.id===id);
if(!item)return;
edit={kind,id};
$("form_"+kind).innerHTML=recordForm(kind,item);
bindRecord(kind);
$("form_"+kind).scrollIntoView({behavior:"smooth",block:"start"});
}

function closeRecord(kind){
edit=null;$("form_"+kind).innerHTML="";
}

function bindRecord(kind){
const f=$("recordForm_"+kind);
f.onsubmit=e=>{
e.preventDefault();
const values=Object.fromEntries(new FormData(f));
const fields=SCHEMAS[kind].fields.filter(x=>!x.section);
for(const field of fields){
if(field.type==="number"||field.type==="money"){
values[field.key]=Number(values[field.key]||0);
}
}
values.id=edit?.id||uid();
values.createdAt=db[kind].find(x=>x.id===values.id)?.createdAt||new Date().toISOString();
values.updatedAt=new Date().toISOString();

const id=edit?.id;
if(commit(()=>{
if(id)db[kind]=db[kind].map(x=>x.id===id?values:x);
else db[kind].unshift(values);
})){
edit=null;render();toast("Registro salvo com sucesso");
}
};
}

function deleteRecord(kind,id){

}
}

function addBudgetItem(){
const p=db.produtos.find(x=>x.id===$("budgetProduct").value);

if(!p||!Number.isInteger(qty)||qty<=0)return alert("Escolha um produto e uma quantidade válida.");
budgetItems.push({nome:p.nome,sku:p.sku||"",quantidade:qty,preco:Number(p.preco)});
renderBudgetItems();
}

function renderBudgetItems(){
const host=$("budgetItems");
if(!host)return;
const subtotal=budgetItems.reduce((s,x)=>s+x.quantidade*x.preco,0);

</tr>`).join("")}</tbody></table></div><h3>Subtotal: ${money(subtotal)}</h3>`;
}

function saveBudget(e){
e.preventDefault();
if(!budgetItems.length)return alert("Adicione pelo menos um item.");
const f=Object.fromEntries(new FormData(e.target));
const subtotal=budgetItems.reduce((s,x)=>s+x.quantidade*x.preco,0);
const desconto=Number(f.desconto||0),frete=Number(f.frete||0);
if(desconto<0||desconto>subtotal||frete<0)return alert("Confira desconto e frete.");
const data={
...f,id:uid(),data:today(),
itens:budgetItems.map(x=>({...x})),
subtotal,desconto,frete,total:subtotal-desconto+frete
};
if(commit(()=>db.orcamentos.unshift(data))){
budgetItems=[];render();toast("Orçamento salvo");
}
}

function backup(){
fileDownload("meu-negocio-backup.json",JSON.stringify({version:1,data:db},null,2),"application/json");
}

async function restoreBackup(input){
const f=input.files?.[0];if(!f)return;
if(f.size>5000000)return alert("Backup muito grande.");
try{
const parsed=JSON.parse(await f.text());
if(parsed.version!==1||!parsed.data||!Array.isArray(parsed.data.clientes)||!Array.isArray(parsed.data.financeiro))throw Error("Formato inválido");
if(!confirm("Restaurar este backup? Isso substituirá TODOS os registros locais."))return;
const next=blank();
for(const k of Object.keys(next)){
if(k==="empresa"&&parsed.data[k]&&typeof parsed.data[k]==="object"&&!Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
else if(Array.isArray(next[k])&&Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
}
if(commit(()=>db=next)){render();toast("Backup restaurado");}
}catch(e){alert("Não foi possível restaurar este backup.");}
input.value="";
}
