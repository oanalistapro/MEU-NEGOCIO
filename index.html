<style>
:root{
--navy:#0b1930;--navy2:#142c4a;--blue:#2563eb;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.layout{display:flex;min-height:100vh}
.sidebar{width:255px;background:linear-gradient(180deg,#122b4a,#081729);color:white;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;padding:20px 12px}
.logo{padding:15px 12px 28px;font-size:22px;font-weight:900;letter-spacing:-.7px}
.logo span{color:#65adff}
.logo small{display:block;font-size:10px;color:#9ebbd9;letter-spacing:2px;margin-top:6px}
.nav{width:100%;border:0;text-align:left;background:transparent;color:#bfd1e5;border-radius:11px;padding:13px 14px;margin-bottom:4px}
.nav:hover,.nav.active{background:#2563eb;color:white}
.main{flex:1;min-width:0;padding:25px 30px 90px;max-width:1800px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top h1{font-size:26px;margin:3px 0}
.muted{color:var(--muted)}
.tag{border:1px solid var(--border);background:white;border-radius:30px;padding:9px 13px;color:#475569;font-size:12px}
.hero{background:linear-gradient(115deg,#10365e,#2367c5 75%,#4c9cff);color:white;padding:29px;border-radius:19px;margin-bottom:20px;box-shadow:0 10px 25px #245cb722}
.hero h2{font-size:25px;margin:0 0 8px}
.hero p{margin:0;color:#d8e9ff;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}
.stat,.panel,.module,.kanban-col{background:white;border:1px solid var(--border);border-radius:16px;box-shadow:0 3px 13px #16345808}
.stat{padding:20px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:23px;margin:11px 0 4px;overflow-wrap:anywhere}
.stat em{font-size:11px;color:var(--muted);font-style:normal}
.panel{padding:22px;margin:17px 0}
.panel h3{margin:0 0 15px;font-size:18px}
.modules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
.module{padding:20px;text-align:left;min-height:138px;color:var(--text);transition:.2s}
.module:hover{transform:translateY(-4px);border-color:#93c5fd;box-shadow:0 10px 25px #1c4d9220}
.module .ico{font-size:28px}
.module b{display:block;margin:12px 0 6px}
.module small{color:var(--muted)}
.btn{border:0;background:var(--blue);color:white;border-radius:10px;padding:11px 16px;font-weight:700}
.btn:hover{filter:brightness(.94)}
.btn.secondary{background:#e8f0fc;color:#194578}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.green{background:#d1fae5;color:#065f46}
.btn.dark{background:#17385c;color:white}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:#506b88;font-weight:650}
.field input,.field select,.field textarea,.search{
width:100%;min-height:44px;border:1px solid #d7e1ee;background:#f9fbff;
color:#17263d;padding:11px;border-radius:9px
}
.field textarea{min-height:105px;resize:vertical}
.full{grid-column:1/-1}
.section{grid-column:1/-1;border-bottom:1px solid var(--border);padding:12px 0 8px;color:#1d4f89;font-weight:800;font-size:15px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:630px}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:#55708f;font-size:12px}
td{overflow-wrap:anywhere}
.action{border:0;background:#e9f1ff;color:#194a88;padding:7px 10px;border-radius:7px;margin:2px}
.empty{padding:24px;color:var(--muted);text-align:center}
.chart{display:flex;align-items:end;gap:12px;height:200px;border-bottom:1px solid var(--border);padding:10px}
.chart-group{flex:1;display:flex;align-items:end;justify-content:center;gap:4px;height:100%;position:relative;padding-bottom:22px}
.bar{width:38%;min-height:2px;border-radius:5px 5px 0 0}
.bar.in{background:#2563eb}.bar.out{background:#f59e0b}
.chart-group small{position:absolute;bottom:0;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;margin:12px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto}
.kanban-col{padding:13px;min-height:180px}
.kanban-col h4{margin:0 0 12px}
.lead{background:#f3f7ff;border:1px solid #dce7f5;border-radius:10px;padding:13px;margin:9px 0}
.lead b{display:block;margin-bottom:7px}
.lead small{color:var(--muted)}
.lead select{width:100%;padding:8px;margin-top:10px;border:1px solid #d4e0ef;border-radius:7px}
.paper{background:white;max-width:794px;min-height:700px;margin:auto;padding:55px;box-shadow:0 10px 35px #142b4b22;color:#202d3b;font:15px/1.65 Arial}

.paper .docbody{min-height:250px;outline:none;white-space:pre-wrap}

.paper .dochead{border-bottom:3px solid #2563eb;padding-bottom:18px}
.paper .signature{text-align:center;margin-top:70px}
.paperwrap{background:#dfe7f1;padding:18px;border-radius:12px;overflow:auto}
.editor-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:15px}
.editor-tools{background:white;border:1px solid var(--border);border-radius:12px;padding:15px}
.editor-tools .field{margin-bottom:12px}
.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:15px;border-radius:11px;line-height:1.6;color:#245081}
.alert{color:#b45309}
.mobile{display:none}

function input(f,v="",prefix="f"){
const key=prefix+"_"+f.k;
let control="";
if(f.t==="select"){
control=`<select name="${esc(f.k)}" id="${key}" ${f.req?"required":""}>
${f.opts.map(o=>`<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o)}</option>`).join("")}
</select>`;
}else if(f.t==="textarea"){
control=`<textarea name="${esc(f.k)}" id="${key}" ${f.req?"required":""}>${esc(v)}</textarea>`;
}else{
control=`<input id="${key}" name="${esc(f.k)}" type="${f.t}" value="${esc(v)}"
${f.req?"required":""} ${f.t==="number"?'step="any"':""}>`;
}
return `<div class="field"><label for="${key}">${esc(f.l)}${f.req?" *":""}</label>${control}</div>`;
}
function fields(arr,values={},prefix="f"){
return arr.map(f=>f.heading?`<div class="section">${esc(f.heading)}</div>`:
input(f,values[f.k]??"",prefix)).join("");
}
function hero(title,desc){
return `<div class="hero"><h2>${title}</h2><p>${desc}</p></div>`;
}
function stat(title,value,sub=""){
return `<div class="stat"><small>${title}</small><strong>${value}</strong><em>${sub}</em></div>`;
}
function accountValue(x){
return num(x.valor)-num(x.desconto)+num(x.juros);
}
function accountSum(type,status){
return sum(db.contas.filter(x=>x.tipo===type&&x.status===status).map(accountValue));
}
function metrics(){
const income=accountSum("Receita","Pago");
const expense=accountSum("Despesa","Pago");
const receive=accountSum("Receita","Pendente");
const pay=accountSum("Despesa","Pendente");
return {income,expense,receive,pay,balance:income-expense};
}
function statsHTML(){
const m=metrics();
return `<div class="stats">
${stat("Faturamento recebido",money(m.income),"Receitas realizadas")}
${stat("Despesas pagas",money(m.expense),"Saídas realizadas")}
${stat("Saldo realizado",money(m.balance),"Receitas menos despesas")}
${stat("A receber",money(m.receive),"Cobranças pendentes")}
${stat("A pagar",money(m.pay),"Contas pendentes")}
${stat("Clientes",db.clientes.length,"Total cadastrado")}
${stat("Funcionários",db.funcionarios.length,"Registros de RH")}
${stat("Produtos",db.produtos.length,"Catálogo")}
</div>`;
}
function chart(){
const months=[];
const now=new Date();
for(let i=5;i>=0;i--){
const d=new Date(now.getFullYear(),now.getMonth()-i,1);
const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const a=db.contas.filter(x=>x.status==="Pago"&&(x.pagamento||x.emissao||"").startsWith(key));
months.push({
name:d.toLocaleDateString("pt-BR",{month:"short"}),
in:sum(a.filter(x=>x.tipo==="Receita").map(accountValue)),
out:sum(a.filter(x=>x.tipo==="Despesa").map(accountValue))
});

function addSaleItem(){
const p=db.produtos.find(x=>x.id===$("saleProduct").value);

if(!p||!Number.isInteger(q)||q<=0)return alert("Selecione produto e quantidade válida.");

if(existing)existing.quantidade=requested;

function saveSale(e){

for(const item of saleItems){
const p=db.produtos.find(x=>x.id===item.produto);
if(!p)return alert("Um produto não existe mais.");
if(item.tipo!=="Serviço"&&num(p.quantidade)<item.quantidade)return alert("Estoque insuficiente: "+p.nome);
}
const total=sum(saleItems.map(x=>x.quantidade*x.preco));
const venda={id:id(),cliente:v.cliente,data:v.data,total,itens:saleItems.map(x=>({...x}))};
if(change(()=>{
db.vendas.unshift(venda);
for(const item of saleItems){

if(item.tipo!=="Serviço"){
p.quantidade=num(p.quantidade)-item.quantidade;
db.movimentos.unshift({id:id(),produto:p.id,nome:p.nome,tipo:"Saída",quantidade:item.quantidade,motivo:"Venda "+venda.id,data:new Date().toLocaleString("pt-BR")});
}
}
db.contas.unshift({
id:id(),descricao:"Venda para "+v.cliente,tipo:"Receita",

vencimento:v.vencimento,pagamento:v.status==="Pago"?v.data:"",
pessoa:v.cliente,referencia:venda.id,categoria:"Vendas"
});
},"Venda confirmada e integrada")){
saleItems=[];render();alert("Venda registrada, estoque e financeiro atualizados.");
}
}

async function restore(input){
const f=input.files?.[0];if(!f)return;
if(f.size>5e6)return alert("Backup muito grande.");
try{
const parsed=JSON.parse(await f.text());
if(parsed.version!==3||!parsed.data||!Array.isArray(parsed.data.clientes))throw Error();
if(!confirm("Substituir todos os dados locais por este backup?"))return;
const next=initial();
for(const k of Object.keys(next)){
if(k==="empresa"&&parsed.data[k]&&!Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
else if(Array.isArray(next[k])&&Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
}
if(change(()=>db=next,"Restaurou backup"))render();
}catch(e){alert("Arquivo de backup inválido.");}
input.value="";
}

db.produtos.filter(x=>x.tipo!=="Serviço"&&num(x.quantidade)<=num(x.minimo)).length+" produtos com estoque baixo",

];

case "financeiro":html=hero("Financeiro","Contas a pagar e receber, contas bancárias e indicadores.")+
statsHTML()+listing("bancos")+listing("contas");break;
case "vendas":html=hero("Vendas e CRM","Clientes, oportunidades e vendas integradas.")+
crm()+sales()+listing("clientes");break;
case "documentos":html=documents();break;
case "rh":html=hero("Recursos humanos","Equipe, benefícios, jornadas, férias e afastamentos.")+
listing("funcionarios")+listing("ferias");break;
case "estoque":html=hero("Estoque e compras","Produtos, custos, quantidades e movimentações.")+
listing("produtos")+stockMove();break;
