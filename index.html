<style>

*{box-sizing:border-box}
body{

button,input,select{font:inherit}

.main{

.topbar{

h1{

h2{font-size:16px;margin:0}

}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    transition:none!important;
    animation:none!important;
  }
}
</style>

<script type="module">

import * as THREE from
"https://esm.sh/three@0.170.0";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  query,
  where,
  writeBatch,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* FIREBASE DE TESTE */

const firebaseConfig={
  apiKey:"AIzaSyB-IiVlnzc_RESH_10MDmZsfnJ3iGm9zqw",
  authDomain:"meu-negocio-enterprise-teste.firebaseapp.com",
  projectId:"meu-negocio-enterprise-teste",
  storageBucket:"meu-negocio-enterprise-teste.firebasestorage.app",
  messagingSenderId:"1083026433106",
  appId:"1:1083026433106:web:9041a8eb3959a9a101eb8b",
  measurementId:"G-BW9N9QCFJ7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);

const S={
  user:null,
  companies:[],
  companyId:"",
  role:"",
  page:"dashboard",
  employees:[],
  departments:[],
  leaves:[],
  members:[],
  vacancies:[],
  candidates:[],
  attendance:[],
  payroll:[]
};

const esc=value=>String(value??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]
);

const isAdmin=()=>["owner","admin","hr"].includes(S.role);
const canReadHR=()=>isAdmin()||["manager","auditor"].includes(S.role);

const collections=[
  "employees",
  "departments",
  "leaves",
  "members",
  "vacancies",
  "candidates",
  "attendance",
  "payroll"
];

function toast(message){
  $("toastRoot").innerHTML=
    `<div class="toast">${esc(message)}</div>`;
  setTimeout(()=>{
    $("toastRoot").innerHTML="";
  },4000);
}

function errorText(e){
  console.error(e);
  if(e.code==="permission-denied")
    return "Acesso negado pelas regras do Firestore.";
  if(e.code==="auth/unauthorized-domain")
    return "Autorize o domínio no Firebase Authentication.";
  return e.message||"Erro inesperado.";
}

function companyCollection(name){
  return collection(db,"companies",S.companyId,name);
}

function companyDoc(name,id){
  return doc(db,"companies",S.companyId,name,id);
}

function panel(title,content,action=""){
  return `
  <section class="panel">
    <div class="panelhead">
      <h2>${esc(title)}</h2>
      ${action}
    </div>
    ${content}
  </section>`;
}

function stat(title,value,foot="DADOS ATUAIS"){
  return `
  <div class="stat">
    <div class="stat-label">${esc(title)}</div>
    <div class="stat-value">${esc(value)}</div>
    <div class="stat-foot">● ${esc(foot)}</div>
  </div>`;
}

function table(headers,rows){
  return `
  <div class="table-scroll">
    <table>
      <thead>
        <tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>
  </div>
  ${rows.length?"":'<p>Nenhum registro cadastrado.</p>'}`;
}

function bars(items){
  const max=Math.max(1,...items.map(x=>x.value));
  return items.length
    ?items.map(x=>`
      <div class="bar">
        <span>${esc(x.label)}</span>
        <div class="track">
          <div class="fill" style="width:${x.value/max*100}%"></div>
        </div>
        <b>${x.value}</b>
      </div>`).join("")
    :'<p>Sem dados cadastrados.</p>';
}

function donut(items){
  const colors=["#539dff","#ff914d","#a67bfa","#39e5d2","#efc05b"];
  const total=items.reduce((s,x)=>s+x.value,0);
  if(!total)return "<p>Sem dados cadastrados.</p>";

  let offset=0;
  const stops=items.map((x,i)=>{
    const start=offset;
    offset+=x.value/total*100;
    return `${colors[i%colors.length]} ${start}% ${offset}%`;
  });

  return `
  <div class="donut-layout">
    <div class="donut" style="background:conic-gradient(${stops.join(",")})"></div>
    <div class="legend">
      ${items.map((x,i)=>`
        <div>
          <span style="color:${colors[i%colors.length]}">●</span>
          ${esc(x.label)}
          <strong>${Math.round(x.value/total*100)}%</strong>
        </div>`).join("")}
    </div>
  </div>`;
}

function lineChart(values){
  const w=780,h=260,left=45,top=15,bottom=35;
  const max=Math.max(1,...values);
  const ph=h-top-bottom;
  const pw=w-left-15;

  const coords=values.map((v,i)=>[
    left+(values.length===1?.5:i/(values.length-1))*pw,
    top+ph-v/max*ph
  ]);

  const path=coords.map((p,i)=>
    `${i?"L":"M"}${p[0]},${p[1]}`
  ).join(" ");

  const area=path+
    ` L${coords.at(-1)[0]},${top+ph}`+
    ` L${coords[0][0]},${top+ph} Z`;

  return `
  <svg class="chart" viewBox="0 0 ${w} ${h}"
       preserveAspectRatio="none"
       role="img" aria-label="Gráfico mensal">
    <defs>
      <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#39e5d2" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#39e5d2" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${[0,.25,.5,.75,1].map(t=>{
      const y=top+ph*(1-t);
      return `
      <line x1="${left}" y1="${y}" x2="${w-15}" y2="${y}"
        stroke="#29394e" stroke-dasharray="4 5"/>
      <text x="5" y="${y+4}" fill="#91a5bb" font-size="11">
        ${Math.round(max*t)}
      </text>`;
    }).join("")}
    <path d="${area}" fill="url(#chartGradient)"/>
    <path d="${path}" fill="none"
      stroke="#39e5d2" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map(p=>`
      <circle cx="${p[0]}" cy="${p[1]}" r="3"
        fill="#6affeb"/>`).join("")}
  </svg>`;
}

function admissionSeries(){
  const result=[];
  const now=new Date();

  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const prefix=
      d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

    result.push(
      S.employees.filter(e=>
        String(e.admission||"").startsWith(prefix)
      ).length
    );
  }
  return result;
}

function departmentData(){
  const data=S.departments.map(d=>({
    label:d.name,
    value:S.employees.filter(e=>e.departmentId===d.id).length
  })).filter(x=>x.value>0);

  const without=S.employees.filter(e=>!e.departmentId).length;
  if(without)data.push({label:"Sem departamento",value:without});

  return data;
}

/* THREE.JS REAL */

let three=null;
let threeEnabled=true;

function stop3D(){
  if(!three)return;

  const t=three;
  three=null;

  cancelAnimationFrame(t.frame);
  t.observer.disconnect();

  t.mount.removeEventListener("pointermove",t.onPointer);
  t.mount.removeEventListener("pointerleave",t.onLeave);

  t.scene.traverse(object=>{
    object.geometry?.dispose();

    if(object.material){
      const materials=Array.isArray(object.material)
        ?object.material:[object.material];
      materials.forEach(m=>m.dispose());
    }
  });

  t.renderer.dispose();
  t.renderer.domElement.remove();
}

function start3D(){
  if(!threeEnabled)return;

  const mount=$("threeMount");
  if(!mount)return;

  stop3D();

  let renderer;

  try{
    renderer=new THREE.WebGLRenderer({
      alpha:true,
      antialias:true,
      powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio||1,1.7)
    );

    renderer.setSize(
      mount.clientWidth,
      mount.clientHeight
    );

    renderer.outputColorSpace=THREE.SRGBColorSpace;
    mount.appendChild(renderer.domElement);

    const scene=new THREE.Scene();

    const camera=new THREE.PerspectiveCamera(
      43,
      mount.clientWidth/Math.max(1,mount.clientHeight),
      .1,
      100
    );

    camera.position.set(0,0,9);

    const rig=new THREE.Group();
    rig.position.x=mount.clientWidth<650?1.3:2.5;
    scene.add(rig);

    /* ILUMINAÇÃO TRIDIMENSIONAL */

    scene.add(new THREE.AmbientLight(0x6bb7c4,1.4));

    const cyanLight=new THREE.PointLight(0x4affdf,100);
    cyanLight.position.set(4,4,5);
    scene.add(cyanLight);

    const orangeLight=new THREE.PointLight(0xff8b45,85);
    orangeLight.position.set(-2,-3,3);
    scene.add(orangeLight);

    /* NÚCLEO 3D */

    const core=new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.35,3),
      new THREE.MeshPhysicalMaterial({
        color:0x1babb7,
        metalness:.48,
        roughness:.18,
        transparent:true,
        opacity:.88,
        clearcoat:1,
        flatShading:true
      })
    );
    rig.add(core);

    /* ESTRUTURA DE ARAME */

    const wire=new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.54,2),
      new THREE.MeshBasicMaterial({
        color:0x65ffe9,
        wireframe:true,
        transparent:true,
        opacity:.25
      })
    );
    rig.add(wire);

    /* ANÉIS ORBITAIS */

    const ring1=new THREE.Mesh(
      new THREE.TorusGeometry(2.1,.014,8,140),
      new THREE.MeshBasicMaterial({
        color:0x35f3e4,
        transparent:true,
        opacity:.68
      })
    );

    ring1.rotation.x=1.1;
    ring1.rotation.y=.3;
    rig.add(ring1);

    const ring2=new THREE.Mesh(
      new THREE.TorusGeometry(1.82,.012,8,140),
      new THREE.MeshBasicMaterial({
        color:0xffa15e,
        transparent:true,
        opacity:.58
      })
    );

    ring2.rotation.y=1.1;
    rig.add(ring2);

    /* 320 PARTÍCULAS 3D */

    const count=320;
    const positions=new Float32Array(count*3);

    for(let i=0;i<count;i++){
      positions[i*3]=(Math.random()-.5)*14;
      positions[i*3+1]=(Math.random()-.5)*7;
      positions[i*3+2]=(Math.random()-.5)*7;
    }

    const particleGeometry=new THREE.BufferGeometry();

    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions,3)
    );

    const particles=new THREE.Points(
      particleGeometry,
      new THREE.PointsMaterial({
        color:0x7adff0,
        size:.025,
        transparent:true,
        opacity:.75
      })
    );

    scene.add(particles);

    /* INTERAÇÃO COM MOUSE */

    const pointer={x:0,y:0};
    const target={x:0,y:0};

    function onPointer(e){
      const rect=mount.getBoundingClientRect();

      target.x=((e.clientX-rect.left)/rect.width-.5)*2;
      target.y=((e.clientY-rect.top)/rect.height-.5)*2;
    }

    function onLeave(){
      target.x=0;
      target.y=0;
    }

    mount.addEventListener("pointermove",onPointer);
    mount.addEventListener("pointerleave",onLeave);

    /* RESPONSIVIDADE DA CÂMERA */

    const observer=new ResizeObserver(()=>{
      const width=mount.clientWidth;
      const height=mount.clientHeight;

      if(!width||!height)return;

      camera.aspect=width/height;
      camera.updateProjectionMatrix();

      renderer.setSize(width,height,false);
      rig.position.x=width<650?1.3:2.5;
    });

    observer.observe(mount);

    const reducedMotion=window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    const clock=new THREE.Clock();

    three={
      renderer,
      scene,
      mount,
      observer,
      onPointer,
      onLeave,
      frame:0
    };

    /* LOOP DE ANIMAÇÃO REAL */

    function animate(){
      if(!three||three.renderer!==renderer)return;

      const time=clock.getElapsedTime();

      pointer.x+=(target.x-pointer.x)*.045;
      pointer.y+=(target.y-pointer.y)*.045;

      if(!reducedMotion){
        rig.rotation.y=time*.23+pointer.x*.3;
        rig.rotation.x=Math.sin(time*.3)*.12-pointer.y*.18;

        wire.rotation.y=-time*.12;
        ring1.rotation.z=time*.17;
        ring2.rotation.x=time*.14;
        particles.rotation.y=time*.014;
      }else{
        rig.rotation.y=pointer.x*.2;
        rig.rotation.x=-pointer.y*.1;
      }

      renderer.render(scene,camera);

      if(!reducedMotion){
        three.frame=requestAnimationFrame(animate);
      }
    }

    animate();

    $("webglBadge").textContent="● THREE.JS / WEBGL ATIVO";

  }catch(e){
    console.error("Erro no Three.js",e);
    stop3D();
    renderer?.dispose();
    $("webglBadge").textContent="WEBGL INDISPONÍVEL";
  }
}

function toggle3D(){
  threeEnabled=!threeEnabled;

  const button=$("toggle3D");

}

/* FORMULÁRIOS */

function inputField(label,name,value="",type="text",required=false){
  return `
  <label>
    ${esc(label)}
    <input
      name="${esc(name)}"
      type="${type}"
      value="${esc(value)}"
      ${required?"required":""}>
  </label>`;
}

function selectField(label,name,items,value=""){
  return `
  <label>
    ${esc(label)}
    <select name="${esc(name)}">
      ${items.map(item=>{
        const v=typeof item==="string"?item:item.value;
        const t=typeof item==="string"?item:item.label;

        return `
          <option value="${esc(v)}" ${v===value?"selected":""}>
            ${esc(t)}
          </option>`;
      }).join("")}
    </select>
  </label>`;
}

function modal(title,fields,onSave){
  $("modalRoot").innerHTML=`
  <div class="dialog-bg">
    <div class="dialog" role="dialog" aria-modal="true">
      <h2>${esc(title)}</h2>
      <form id="modalForm">
        <div class="form-grid">${fields}</div>
        <div style="display:flex;gap:10px">
          <button class="btn primary" type="submit">Salvar</button>
          <button class="btn" type="button" id="cancelModal">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>`;

  $("cancelModal").onclick=()=>{
    $("modalRoot").innerHTML="";
  };

  $("modalForm").onsubmit=async e=>{
    e.preventDefault();

    const button=e.target.querySelector('[type="submit"]');
    button.disabled=true;

    try{
      await onSave(Object.fromEntries(new FormData(e.target)));
      $("modalRoot").innerHTML="";
      toast("Registro salvo.");
    }catch(error){
      toast(errorText(error));
    }finally{
      button.disabled=false;
    }
  };
}

/* INCLINAÇÃO INTERATIVA DOS CARTÕES */

function initCardTilt(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)
    return;

  if(!window.matchMedia("(hover:hover) and (pointer:fine)").matches)
    return;

  document.querySelectorAll(".card3d").forEach(card=>{
    card.addEventListener("pointermove",e=>{
      const r=card.getBoundingClientRect();

      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;

      card.style.transform=
        `perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-3px)`;
    });

    card.addEventListener("pointerleave",()=>{
      card.style.transform="";
    });
  });
}

/* FIRESTORE */

async function readCollection(name){
  try{
    const snap=await getDocs(companyCollection(name));

    return snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));
  }catch(e){
    if(e.code==="permission-denied"){
      console.warn("Coleção sem permissão:",name);
      return [];
    }

    throw e;
  }
}

async function reload(){
  const results=await Promise.all(collections.map(name=>{
    const sensitive=[
      "employees",
      "leaves",
      "vacancies",
      "candidates",
      "attendance",
      "payroll"
    ];

    if(sensitive.includes(name)&&!canReadHR())
      return [];

    if(name==="payroll"&&!isAdmin())
      return [];

    return readCollection(name);
  }));

  collections.forEach((name,i)=>{
    S[name]=results[i];
  });

  render();
}

async function selectCompany(id){
  if(!S.companies.some(c=>c.id===id))
    throw Error("Empresa não autorizada.");

  const member=await getDoc(
    doc(db,"companies",id,"members",S.user.uid)
  );

  if(!member.exists())
    throw Error("Sua conta não possui acesso à empresa.");

  S.companyId=id;
  S.role=member.data().role||"employee";
  S.page="dashboard";

  sessionStorage.setItem("mn3d_company",id);
  $("companySelect").value=id;

  await reload();
}

async function loadCompanies(){
  const snap=await getDocs(
    query(
      collection(db,"companies"),
      where("memberUids","array-contains",S.user.uid)
    )
  );

  S.companies=snap.docs.map(d=>({
    id:d.id,
    ...d.data()
  }));

  $("companySelect").innerHTML=S.companies.map(c=>`
    <option value="${esc(c.id)}">${esc(c.name)}</option>
  `).join("");

  const saved=sessionStorage.getItem("mn3d_company");

  const selected=
    S.companies.find(c=>c.id===saved)?.id||
    S.companies[0]?.id;

  if(selected){
    await selectCompany(selected);
  }else{
    S.companyId="";
    S.role="";
    $("pageTitle").textContent="Bem-vindo ao MEU NEGÓCIO PRO";

    $("view").innerHTML=panel(
      "Primeira configuração",
      `
      <p>Crie sua primeira empresa para começar.</p>
      <button class="btn primary" id="firstCompany">
        Criar empresa
      </button>`
    );

    $("firstCompany").onclick=companyForm;
  }
}

onAuthStateChanged(auth,async user=>{
  S.user=user;

  $("authScreen").classList.toggle("hidden",!!user);
  $("appScreen").classList.toggle("hidden",!user);

  stop3D();

  if(!user){
    S.companyId="";
    S.role="";
    return;
  }

  try{
    await loadCompanies();
  }catch(e){
    $("view").innerHTML=`
      <div class="notice">${esc(errorText(e))}</div>`;
  }
});
