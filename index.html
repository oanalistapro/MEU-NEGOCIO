<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>MEU NEGÓCIO PRO | BUSINESS PRO</title>
<style>
:root{
--bg:#071321;--side:#091a2e;--card:#10263e;
--card2:#183654;--line:#304d6b;--txt:#f1f7ff;
--muted:#a8bfd7;--blue:#4b9dff;--green:#35d5a2;
--red:#ff7184
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.layout{display:flex;min-height:100vh}
aside{width:245px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:14px 10px 24px;font-size:21px;font-weight:900}
.brand span{color:var(--blue)}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:8px}
.nav{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:13px;border-radius:10px;margin:3px 0}
.nav:hover,.nav.active{background:#204b78;color:white}
main{flex:1;min-width:0;padding:24px;max-width:1700px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:26px;margin:5px 0}
.muted{color:var(--muted)}
.hero{background:linear-gradient(115deg,#205d9d,#11283f);border:1px solid #396b9d;border-radius:17px;padding:24px;margin:20px 0}
.hero h2{margin:0 0 8px;font-size:25px}
.hero p{color:#c5dbf2;line-height:1.6;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:17px 0}
.stat,.panel,.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:21px;margin-top:10px;overflow-wrap:anywhere}
.modules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{color:white;text-align:left;min-height:125px}
.tile:hover{border-color:var(--blue)}
.tile b{display:block;margin:12px 0 5px}
.tile small{color:var(--muted)}
.emoji{font-size:28px}
.panel{margin:16px 0}
.panel h3{font-size:19px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0}
.btn{border:0;border-radius:9px;background:var(--blue);color:#071727;padding:11px 15px;font-weight:750}
.btn.alt{background:var(--card2);border:1px solid var(--line);color:white}
.btn.red{background:#713448;color:white}
.btn.word{background:#2766b7;color:white}
.btn.excel{background:#187d53;color:white}
.btn.pdf{background:#bd4050;color:white}
.btn:disabled{opacity:.5}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:12px;color:#b6d5f6}
.field input,.field select,.field textarea,.search{
width:100%;background:#081b30;border:1px solid #3a5979;border-radius:9px;
padding:12px;color:white;min-height:45px
}
.field textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
.section{grid-column:1/-1;font-size:16px;font-weight:800;color:#a7d0ff;border-bottom:1px solid var(--line);padding:12px 0 8px;margin-top:7px}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:#b8d2ec}
td{overflow-wrap:anywhere}
.mini{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#1e4266;color:white;margin:2px}
.empty{text-align:center;padding:22px;color:var(--muted)}
.detail{background:#0a2036;border:1px solid var(--line);padding:18px;border-radius:13px;margin:14px 0}
.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.detailgrid div{border-bottom:1px solid var(--line);padding:8px}
.detailgrid small{display:block;color:var(--muted);margin-bottom:5px}
.note{background:#15334f;border:1px solid #315779;padding:14px;border-radius:10px;line-height:1.6;color:#c9e0f8}
.badge{border:1px solid #386e9d;border-radius:30px;padding:7px 10px;font-size:11px;color:#b8d9fa}
.officegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.officecard{background:#173450;border:1px solid #365c80;border-radius:13px;padding:18px;color:white;text-align:left;min-height:112px}
.officecard:hover{border-color:var(--blue)}
.officecard b{display:block;margin:12px 0 5px}
.officecard small{color:var(--muted)}
.officeeditor{display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);gap:16px}
.officefields{background:#10263e;border:1px solid var(--line);border-radius:12px;padding:16px}
.officefields .field{margin-bottom:12px}
.paperwrap{background:#253b51;padding:18px;border-radius:12px;overflow:auto}
.paper{background:white;color:#1b2836;max-width:794px;min-height:800px;margin:auto;padding:50px;font:15px/1.7 Arial,sans-serif;box-shadow:0 8px 25px #0004}
.paper h1{text-align:center;font-size:24px;margin:45px 0 30px}
.paper .companyhead{border-bottom:3px solid #215f9d;padding-bottom:17px}
.paper .companyhead h2{margin:0;color:#183d65}
.paper .companyhead small{color:#647587}
.paper .bodytext{white-space:pre-wrap;text-align:justify}
.paper .sign{text-align:center;margin-top:80px}
.paper .foot{border-top:1px solid #ccc;margin-top:65px;padding-top:10px;text-align:center;font-size:11px;color:#777}
.mobile{display:none}
#toast{display:none;position:fixed;right:20px;bottom:20px;padding:15px;background:#17664f;border-radius:10px;z-index:99}
@media(max-width:1100px){
.modules{grid-template-columns:repeat(3,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
.officegrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
aside{display:none}
main{padding:14px 12px 85px}
.modules{grid-template-columns:repeat(2,1fr)}
.form,.detailgrid,.officeeditor{grid-template-columns:1fr}
.hero{padding:19px}
.hero h2{font-size:21px}
.stat{padding:12px}
.stat strong{font-size:17px}
.paper{padding:25px;min-height:550px;font-size:12px}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);border-top:1px solid var(--line);justify-content:space-around;padding:9px;z-index:20}
.mobile button{border:0;background:none;color:#cbe2fa;padding:8px}
}
@media print{
body.printing *{visibility:hidden!important}
body.printing #printArea,body.printing #printArea *{visibility:visible!important}
body.printing #printArea{position:absolute;left:0;top:0;width:100%;max-width:none;min-height:0;box-shadow:none;padding:18mm;background:white;color:black}
@page{size:A4;margin:0}
}
</style>

function fieldHTML(f,value="",prefix="r"){
const id=prefix+"_"+f.key;
let input;
if(f.type==="select"){
input=`<select id="${id}" name="${esc(f.key)}" ${f.required?"required":""}>
${f.options.map(o=>`<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("")}
</select>`;
}else if(f.type==="textarea"){
input=`<textarea id="${id}" name="${esc(f.key)}" ${f.required?"required":""}>${esc(value)}</textarea>`;
}else{
const type=f.type==="money"?"number":f.type;
input=`<input id="${id}" name="${esc(f.key)}" type="${type}" value="${esc(value)}"
${f.required?"required":""} ${type==="number"?'min="0" step="'+(f.type==="money"?"0.01":"1")+'"':""}>`;
}
return `<div class="field"><label for="${id}">${esc(f.label)}${f.required?" *":""}</label>${input}</div>`;
}
function fieldsHTML(fields,values={},prefix="r"){
return fields.map(f=>f.section?`<div class="section">${esc(f.section)}</div>`:fieldHTML(f,values[f.key]??"",prefix)).join("");
}

function addBudgetItem(){
const p=db.produtos.find(x=>x.id===$("budgetProduct").value);
const q=Number($("budgetQty").value);
if(!p||!Number.isInteger(q)||q<=0)return alert("Escolha um produto e uma quantidade válida.");
budgetItems.push({nome:p.nome,quantidade:q,preco:Number(p.preco||0)});
renderBudgetItems();
}
function renderBudgetItems(){
const host=$("budgetItems");if(!host)return;
host.innerHTML=`<div class="table"><table><thead><tr><th>Produto</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th><th>Ação</th></tr></thead>

<td>${money(x.preco)}</td><td>${money(x.quantidade*x.preco)}</td>
<td><button type="button" class="mini" onclick="budgetItems.splice(${i},1);renderBudgetItems()">Remover</button></td></tr>`).join("")}
</tbody></table></div><h3>Subtotal: ${money(budgetItems.reduce((s,x)=>s+x.quantidade*x.preco,0))}</h3>`;
}
function saveBudget(e){
e.preventDefault();
if(!budgetItems.length)return alert("Adicione itens.");
const f=Object.fromEntries(new FormData(e.target));
const subtotal=budgetItems.reduce((s,x)=>s+x.quantidade*x.preco,0);
const desconto=Number(f.desconto||0),frete=Number(f.frete||0);
if(desconto<0||desconto>subtotal||frete<0)return alert("Confira desconto e frete.");
const o={...f,id:uid(),data:today(),itens:budgetItems.map(x=>({...x})),subtotal,desconto,frete,total:subtotal-desconto+frete};
if(commit(()=>db.orcamentos.unshift(o))){budgetItems=[];render();toast("Orçamento salvo");}
}

const o=db.orcamentos.find(x=>x.id===id);if(!o)return;
printHTML(`<h1>ORÇAMENTO COMERCIAL</h1><h2>${esc(db.empresa.fantasia||db.empresa.razao||"Empresa")}</h2>

<p>Pagamento: ${esc(o.pagamento)}</p><p>${esc(o.observacoes)}</p>`);
}

if(commit(()=>db.orcamentos=db.orcamentos.filter(x=>x.id!==id)))render();
}

function deleteOffice(id){

}

<div class="panel"><h3>Backup e segurança</h3>
<p class="note">Os registros ficam neste navegador. Faça backup antes de limpar os dados do navegador ou mudar de dispositivo.</p>
<div class="bar">
<button class="btn" onclick="backup()">Baixar backup JSON</button>
<button class="btn alt" onclick="$('backupFile').click()">Restaurar backup</button>
<input type="file" id="backupFile" accept=".json,application/json" hidden onchange="restoreBackup(this)">
<button class="btn alt" onclick="window.print()">Imprimir relatório</button>
</div></div>`;
}
function backup(){
download("meu-negocio-backup.json",JSON.stringify({version:1,data:db},null,2),"application/json");
}
async function restoreBackup(input){
const f=input.files?.[0];if(!f)return;
if(f.size>5000000)return alert("Arquivo muito grande.");
try{
const p=JSON.parse(await f.text());
if(p.version!==1||!p.data||!Array.isArray(p.data.clientes)||!Array.isArray(p.data.financeiro))throw Error();
if(!confirm("Substituir TODOS os dados locais pelo backup?"))return;
const next=blank();
for(const k of Object.keys(next)){
if(k==="empresa"&&p.data[k]&&typeof p.data[k]==="object"&&!Array.isArray(p.data[k]))next[k]=p.data[k];
else if(Array.isArray(next[k])&&Array.isArray(p.data[k]))next[k]=p.data[k];
}
if(commit(()=>db=next)){render();toast("Backup restaurado");}
}catch(e){alert("Backup inválido.");}
input.value="";
}
