function stats(){
const employees=db.funcionarios;
const active=employees.filter(x=>x.situacao==="Ativo").length;
const vacation=db.ferias.filter(x=>x.status==="Aprovado").length;
const vacancies=db.recrutamento.filter(x=>x.status==="Aberta").length;
const pending=db.solicitacoes.filter(x=>x.status==="Pendente").length;
return [
["Colaboradores ativos",active,"Pessoas ativas"],
["Férias aprovadas",vacation,"Registros de férias"],
["Vagas abertas",vacancies,"Processos seletivos"],
["Solicitações pendentes",pending,"Aguardando análise"]
];
}

return `<div class="stats">${stats().map(s=>`

}

/* ===============================
   FORMULÁRIOS E REGISTROS
================================ */

function inputField(field,value=""){
const name=esc(field.key);
let html="";
if(field.type==="select"){
html=`<select name="${name}" ${field.required?"required":""}>
${field.options.map(o=>`<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("")}
</select>`;
}else if(field.type==="employee"){
html=`<select name="${name}" ${field.required?"required":""}>
<option value="">Selecione o colaborador</option>
${db.funcionarios.map(e=>`<option value="${esc(e.id)}" ${value===e.id?"selected":""}>${esc(e.nome)} — ${esc(e.cargo)}</option>`).join("")}
</select>`;
}else if(field.type==="textarea"){
html=`<textarea name="${name}" ${field.required?"required":""}>${esc(value)}</textarea>`;
}else{
html=`<input name="${name}" type="${field.type}" value="${esc(value)}"
${field.required?"required":""} ${field.type==="number"?'step="any"':""}>`;
}
return `<div class="field"><label>${esc(field.label)}${field.required?" *":""}</label>${html}</div>`;
}

function formHTML(kind,record={}){
return `<div class="panel" id="formPanel">
<h3>${editing?"Editar registro":"Novo registro"} — ${esc(moduleName(kind))}</h3>
<form id="dataForm" class="form">
${SCHEMA[kind].map(f=>f.heading?`<div class="divider">${esc(f.heading)}</div>`:inputField(f,record[f.key]??"")).join("")}
<div class="full toolbar">
<button class="btn" type="submit">Salvar registro</button>
<button class="btn secondary" type="button" onclick="cancelForm()">Cancelar</button>
</div></form></div>`;
}

function employeeName(eid){
return db.funcionarios.find(x=>x.id===eid)?.nome||"Colaborador não encontrado";
}

function displayValue(field,value){
if(field.type==="employee")return employeeName(value);
if(field.type==="number"&&["salario","valor","adicionais","descontos","proventos","faixaMin","faixaMax"].includes(field.key))return money(value);
return String(value??"");
}

function openModule(kind){

function editRecord(rid){
const record=db[current].find(x=>x.id===rid);
if(!record)return;
editing=rid;

$("dataForm").onsubmit=saveRecord;
$("formPanel").scrollIntoView({behavior:"smooth"});
}

function cancelForm(){
editing=null;$("formArea").innerHTML="";
}

function validateRecord(kind,r){
if(kind==="ferias"&&r.fim<r.inicio)return "A data final não pode ser anterior à inicial.";
if(kind==="ponto"){
const a=minutes(r.entrada),b=minutes(r.saida);
if(b<a)return "A saída deve ocorrer depois da entrada neste registro.";
if((r.saidaIntervalo&&!r.voltaIntervalo)||(!r.saidaIntervalo&&r.voltaIntervalo))
return "Informe os dois horários do intervalo.";
}
if(kind==="folha"&&Number(r.salario)<0)return "Salário inválido.";
if(kind==="avaliacoes"&&(Number(r.nota)<0||Number(r.nota)>10))return "A nota deve estar entre 0 e 10.";
return "";
}

function saveRecord(e){
e.preventDefault();
const kind=current;
const values=Object.fromEntries(new FormData(e.target));
const error=validateRecord(kind,values);
if(error)return alert(error);
const previous=db[kind].find(x=>x.id===editing);
values.id=editing||uid();
values.criadoEm=previous?.criadoEm||new Date().toISOString();

if(commit(()=>{
if(editing)db[kind]=db[kind].map(x=>x.id===editing?values:x);
else db[kind].unshift(values);
},(editing?"Editou":"Criou")+" registro em "+moduleName(kind))){
editing=null;renderList();
}
}

function deleteRecord(rid){
const kind=current;
if(kind==="funcionarios"){
const linked=Object.keys(db).some(k=>
k!=="funcionarios"&&k!=="logs"&&
Array.isArray(db[k])&&db[k].some(x=>x.funcionario===rid));
if(linked)return alert("Este funcionário possui registros vinculados. Altere sua situação para Desligado em vez de excluir.");
}
if(!confirm("Excluir este registro?"))return;
if(commit(()=>db[kind]=db[kind].filter(x=>x.id!==rid),"Excluiu registro em "+moduleName(kind)))renderList();
}

}

/* ===============================
   CONTROLE DE PONTO
================================ */

function minutes(t){
if(!t)return 0;
const [h,m]=t.split(":").map(Number);
return h*60+m;
}

function workedMinutes(p){
let total=minutes(p.saida)-minutes(p.entrada);
if(p.saidaIntervalo&&p.voltaIntervalo){
total-=Math.max(0,minutes(p.voltaIntervalo)-minutes(p.saidaIntervalo));
}
return Math.max(0,total);
}

function pointSummary(){
const total=db.ponto.reduce((s,p)=>s+workedMinutes(p),0);
return `<div class="panel"><h3>Resumo de jornadas registradas</h3>
<div class="stats" style="grid-template-columns:repeat(2,1fr)">
<div class="stat"><small>Registros</small><strong>${db.ponto.length}</strong></div>
<div class="stat"><small>Horas registradas</small><strong>${(total/60).toFixed(2)} h</strong></div>
</div><div class="notice">Este controle é administrativo e demonstrativo. Não substitui um sistema de registro eletrônico de ponto que cumpra os requisitos legais aplicáveis. Jornadas noturnas e que atravessam a meia-noite exigem tratamento adicional.</div></div>`;
}

}

function rows(kind){
const fields=SCHEMA[kind].filter(x=>!x.heading);
return [
fields.map(x=>x.label),
...db[kind].map(r=>fields.map(f=>displayValue(f,r[f.key])))
];
}

function exportCSV(kind){
const content=rows(kind).map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(";")).join("\r\n");
download("RH-"+kind+".csv","\ufeff"+content,"text/csv;charset=utf-8");
}

function exportExcel(kind){
const html=`<html><head><meta charset="UTF-8"></head><body><table border="1">
${rows(kind).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}
</table></body></html>`;
download("RH-"+kind+".xls","\ufeff"+html,"application/vnd.ms-excel");
}

function backup(){
download("backup-central-rh.json",JSON.stringify({version:1,data:db},null,2),"application/json");
}

async function restore(input){
const file=input.files?.[0];if(!file)return;
if(file.size>5*1024*1024){alert("Arquivo muito grande.");return}
try{
const parsed=JSON.parse(await file.text());
if(parsed.version!==1||!parsed.data||!Array.isArray(parsed.data.funcionarios))throw Error();
if(!confirm("Substituir todos os dados locais pelo backup?"))return;
const next=fresh();
for(const k of Object.keys(next)){
if(Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
}
if(commit(()=>db=next,"Restaurou backup local"))renderReports();
}catch(e){alert("Backup inválido ou incompatível.");}
input.value="";
}
