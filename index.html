
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b32">
<title>MEU NEGÓCIO PRO — RH Enterprise V3</title>
<style>
:root{
--nav:#101b32;--nav2:#192944;--blue:#3468e8;--blue2:#eaf0ff;
--bg:#f5f7fb;--card:#fff;--text:#1c2a40;--muted:#728097;
--line:#e4eaf2;--green:#12805c;--orange:#d18a21;--red:#c84747;
--shadow:0 5px 24px #1c35520a
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.layout{display:flex;min-height:100vh}
.sidebar{width:256px;background:var(--nav);color:#c9d4e6;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;padding:23px 14px}
.logo{font-weight:900;font-size:21px;color:white;padding:7px 11px 27px;letter-spacing:-.6px}
.logo span{color:#73a7ff}
.logo small{display:block;font-size:10px;color:#8da2c5;letter-spacing:2px;margin-top:5px}
.navtitle{font-size:10px;letter-spacing:1.6px;color:#7588a8;padding:18px 12px 9px}
.nav{display:block;width:100%;border:0;text-align:left;padding:12px 13px;background:transparent;color:#bfcee2;border-radius:9px;margin:2px 0}
.nav:hover,.nav.active{background:#284b88;color:white}
.main{flex:1;min-width:0;padding:25px 30px 90px;max-width:1800px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
.top h1{margin:4px 0;font-size:24px;letter-spacing:-.6px}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:30px;font-size:12px}
.hero{background:linear-gradient(110deg,#142e54,#2659ae);color:white;padding:30px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero h2{font-size:27px;margin:8px 0}
.hero p{max-width:680px;color:#d6e5fa}
.heroicon{font-size:64px;opacity:.8}
.btn{border:0;background:var(--blue);color:white;border-radius:9px;padding:10px 15px;font-weight:750;white-space:normal}
.btn:hover{filter:brightness(.94)}
.btn.light{background:var(--blue2);color:#2355b9}
.btn.white{background:white;color:#1c4d96}
.btn.danger{background:#fde9e9;color:#a52929}
.btn.green{background:#def7e9;color:#086b45}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sm{padding:7px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.card,.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.stat{padding:20px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:27px;margin:8px 0}
.stat span{font-size:11px;color:var(--muted)}
.panel{padding:22px;margin:18px 0}
.panel h3{font-size:17px;margin:0 0 17px}
.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}
.section h2{font-size:19px;margin:0}
.card{padding:20px;text-align:left;color:var(--text);transition:.15s;min-height:133px}
.card:hover{border-color:#a2baf7;transform:translateY(-2px);box-shadow:0 10px 28px #1e4c9217}
.card .ico{font-size:28px}
.card b{display:block;margin:12px 0 6px;font-size:14px}
.card small{display:block;color:var(--muted);line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:14px 0}
input,select,textarea{border:1px solid #d8e2ef;border-radius:9px;background:#fcfdff;color:var(--text);padding:10px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:#7299f0;outline:2px solid #dce8ff}
.search{min-width:220px;flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:#536984;font-weight:750}
.field input,.field select,.field textarea{width:100%;min-height:43px}
.field textarea{min-height:85px;resize:vertical}
.full{grid-column:1/-1}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:7px}
.tab{border:1px solid var(--line);background:white;color:#53647b;padding:10px 14px;border-radius:9px;white-space:nowrap}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:13px 11px;vertical-align:middle;overflow-wrap:anywhere}
th{font-size:11px;color:#708098;background:#fafbfe}
td{font-size:13px}
.rowactions{display:flex;flex-wrap:wrap;gap:5px}
.badge{display:inline-block;font-size:11px;padding:5px 9px;border-radius:20px;background:#eef2f7;color:#52637b}
.badge.green{background:#def8e9;color:#08764b}
.badge.orange{background:#fff2da;color:#95610e}
.badge.red{background:#fee8e8;color:#a42d2d}
.empty{padding:38px 15px;text-align:center;color:var(--muted)}
.notice{background:#edf4ff;border:1px solid #c7dcff;padding:15px;border-radius:11px;color:#315987;line-height:1.6}
.back{background:transparent;border:0;color:var(--blue);font-weight:750;padding:8px 0;margin-bottom:12px}
.avatar{width:45px;height:45px;border-radius:13px;background:#e5eeff;color:#2b5dbd;display:grid;place-items:center;font-weight:900;font-size:18px}
.personline{display:flex;align-items:center;gap:12px}
.personline b{display:block}
.personline small{color:var(--muted)}
.profiletop{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.profiletop .avatar{width:70px;height:70px;font-size:28px}
.profiletop h2{margin:0}
.profilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.detail{padding:14px;border:1px solid var(--line);border-radius:10px}
.detail small{display:block;color:var(--muted);margin-bottom:5px}
.detail strong{overflow-wrap:anywhere}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow-x:auto}
.lane{background:#edf2f9;border-radius:13px;padding:12px;min-height:230px}
.lane h4{margin:5px 5px 15px}
.ticket{background:white;border:1px solid var(--line);border-radius:11px;padding:14px;margin:9px 0}
.ticket b{display:block;margin-bottom:7px}
.ticket small{color:var(--muted)}
.barline{height:9px;background:#eaf0f8;border-radius:20px;overflow:hidden}
.barline span{display:block;height:100%;background:#4374e8}
.mobile{display:none}
@media(max-width:1150px){.grid{grid-template-columns:repeat(3,1fr)}.profilegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.sidebar{width:215px}.main{padding:20px}.grid,.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
.sidebar{display:none}.main{padding:15px 12px 90px}
.top h1{font-size:20px}.hero{padding:20px}.hero h2{font-size:23px}.heroicon{display:none}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{padding:14px;min-height:135px}.card b{font-size:13px}
.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:21px}
.panel{padding:15px}.form,.profilegrid{grid-template-columns:1fr}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--nav);justify-content:space-around;padding:9px;z-index:50}
.mobile button{background:transparent;border:0;color:white;font-size:12px;padding:9px 4px}
}
@media print{
.sidebar,.mobile,.top,.toolbar,.btn,.back,.tabs,.rowactions{display:none!important}
.main{padding:0}.panel{border:0;box-shadow:none}body{background:white}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">MEU <span>NEGÓCIO</span><small>BUSINESS PRO • ENTERPRISE</small></div>
<div class="navtitle">PRINCIPAL</div>
<button class="nav" onclick="go('home')">⌂ Visão empresarial</button>
<button class="nav active" onclick="go('rh')">▦ Central RH PRO</button>
<div class="navtitle">GESTÃO DE PESSOAS</div>
<button class="nav" onclick="go('employees')">👥 Colaboradores</button>
<button class="nav" onclick="go('attendance')">◷ Ponto e jornadas</button>
<button class="nav" onclick="go('leaves')">☀ Férias e ausências</button>
<button class="nav" onclick="go('recruitment')">◎ Recrutamento</button>
<button class="nav" onclick="go('payroll')">▤ Folha gerencial</button>
<button class="nav" onclick="go('requests')">✉ Solicitações</button>
<button class="nav" onclick="go('reports')">▥ Relatórios</button>
<div class="navtitle">ADMINISTRAÇÃO</div>
<button class="nav" onclick="go('catalog')">▦ Catálogo de RH</button>
<button class="nav" onclick="backup()">↓ Backup</button>
<button class="nav" onclick="document.getElementById('restoreFile').click()">↑ Restaurar</button>
<div style="padding:18px 12px;color:#8da2c5;font-size:11px">
Ambiente de teste local.<br>Sem autenticação ou armazenamento seguro.
</div>
</aside>

<main class="main">
<header class="top">
<div>
<div class="eyebrow">BUSINESS PRO / MEU NEGÓCIO</div>
<h1 id="pageTitle">Central RH PRO</h1>
</div>
<span class="pill">V3 • Protótipo</span>
</header>
<div id="app"></div>
</main>
</div>

<nav class="mobile">
<button onclick="go('home')">⌂ Início</button>
<button onclick="go('rh')">▦ RH</button>
<button onclick="go('employees')">👥 Equipe</button>
<button onclick="go('attendance')">◷ Ponto</button>
<button onclick="go('reports')">▥ Dados</button>
</nav>
<input type="file" id="restoreFile" accept=".json" hidden>

<script>
"use strict";

/* ===================================
   BASE DE DADOS LOCAL
=================================== */

const STORE="meu_negocio_enterprise_rh_v3";

const blank=()=>({
employees:[],
attendance:[],
leaves:[],
vacancies:[],
candidates:[],
payroll:[],
requests:[],
audit:[]
});

let db=blank();
try{
const saved=JSON.parse(localStorage.getItem(STORE)||"null");
if(saved&&typeof saved==="object"){
for(const key of Object.keys(db)){
if(Array.isArray(saved[key]))db[key]=saved[key];
}
}
}catch(e){console.warn(e)}

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const id=()=>crypto.randomUUID?.()||
Date.now()+"-"+Math.random().toString(36).slice(2);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=v=>{
if(!v)return "—";
const [y,m,d]=v.split("-");
return d&&m&&y?`${d}/${m}/${y}`:v;
};
const today=()=>new Date().toLocaleDateString("en-CA");
const employee=eid=>db.employees.find(e=>e.id===eid);
const employeeName=eid=>employee(eid)?.name||"Colaborador não encontrado";

let page="rh";
let editId=null;
let employeeStep=0;
let draftEmployee={};

function persist(message){
const next=structuredClone(db);
next.audit.unshift({
id:id(),date:new Date().toISOString(),message
});
next.audit=next.audit.slice(0,500);
try{
localStorage.setItem(STORE,JSON.stringify(next));
db=next;
return true;
}catch(e){
alert("Não foi possível salvar no navegador. Faça backup dos dados.");
return false;
}
}

function mutate(message,fn){
const previous=structuredClone(db);
fn();
if(!persist(message)){db=previous;return false}
return true;
}

function download(name,content,type){
const url=URL.createObjectURL(new Blob([content],{type}));
const a=document.createElement("a");
a.href=url;a.download=name;
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),2500);
}

function setTitle(name){
$("pageTitle").textContent=name;
document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));
}

function go(p){
page=p;editId=null;
const names={
home:"MEU NEGÓCIO PRO",rh:"Central RH PRO",
employees:"Colaboradores",attendance:"Ponto e jornadas",
leaves:"Férias e ausências",recruitment:"Recrutamento",
payroll:"Folha gerencial",requests:"Solicitações",
reports:"Relatórios RH",catalog:"Catálogo RH"
};
setTitle(names[p]||"Central RH PRO");
const renders={
home:home,rh:rh,employees:employeesPage,
attendance:attendancePage,leaves:leavesPage,
recruitment:recruitmentPage,payroll:payrollPage,
requests:requestsPage,reports:reportsPage,catalog:catalogPage
};
(renders[p]||rh)();
}

function hero(label,title,desc,emoji){
return `<div class="hero"><div>
<div class="eyebrow" style="color:#bcd4ff">${label}</div>
<h2>${title}</h2><p>${desc}</p>
</div><div class="heroicon">${emoji}</div></div>`;
}

function statsCards(data){
return `<div class="stats">${data.map(x=>`
<div class="stat"><small>${x[0]}</small>
<strong>${x[1]}</strong><span>${x[2]||""}</span></div>
`).join("")}</div>`;
}

function back(to="rh"){
return `<button class="back" onclick="go('${to}')">← Voltar</button>`;
}

function empty(msg){
return `<div class="empty">▦<p>${esc(msg)}</p></div>`;
}

function statusBadge(s){
const text=String(s||"—");
const green=["Ativo","Aprovado","Contratado","Concluído","Presente","Aberta","Fechado"];
const red=["Desligado","Rejeitado","Cancelado","Falta","Encerrada"];
return `<span class="badge ${green.includes(text)?"green":red.includes(text)?"red":"orange"}">${esc(text)}</span>`;
}

function employeeOptions(selected=""){
return `<option value="">Selecione um colaborador</option>`+
db.employees.map(e=>`<option value="${esc(e.id)}" ${selected===e.id?"selected":""}>${esc(e.name)} — ${esc(e.role||"Sem cargo")}</option>`).join("");
}

function field(label,name,type="text",value="",required=false,extra=""){
return `<div class="field"><label>${esc(label)}${required?" *":""}</label>
<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?"required":""} ${extra}></div>`;
}

function selectField(label,name,options,value="",required=false){
return `<div class="field"><label>${esc(label)}${required?" *":""}</label>
<select name="${esc(name)}" ${required?"required":""}>
${options.map(x=>`<option value="${esc(x)}" ${x===value?"selected":""}>${esc(x)}</option>`).join("")}
</select></div>`;
}

function textField(label,name,value=""){
return `<div class="field full"><label>${esc(label)}</label>
<textarea name="${esc(name)}">${esc(value)}</textarea></div>`;
}

function employeeSelect(value=""){
return `<div class="field"><label>Colaborador *</label>
<select name="employeeId" required>${employeeOptions(value)}</select></div>`;
}

function formPanel(title,content,submit="Salvar"){
return `<div class="panel" id="editPanel">
<h3>${esc(title)}</h3>
<form id="editForm" class="form">
${content}
<div class="full toolbar">
<button class="btn" type="submit">${esc(submit)}</button>
<button class="btn light" type="button" onclick="refresh()">Cancelar</button>
</div></form></div>`;
}

function refresh(){
go(page);
}

function attachSave(handler){
$("editForm").addEventListener("submit",e=>{
e.preventDefault();
handler(Object.fromEntries(new FormData(e.target)));
});
$("editPanel").scrollIntoView({behavior:"smooth",block:"start"});
}

function showForm(title,content,handler,submit="Salvar"){
$("formSlot").innerHTML=formPanel(title,content,submit);
attachSave(handler);
}

function removeRecord(collection,rid){
if(collection==="employees"){
const linked=["attendance","leaves","payroll","requests"].some(k=>
db[k].some(x=>x.employeeId===rid));
if(linked){
alert("Este colaborador possui registros vinculados. Altere a situação para Desligado.");
return;
}
}
if(!confirm("Excluir este registro? Esta ação não pode ser desfeita sem um backup."))return;
if(mutate("Exclusão em "+collection,()=>{
db[collection]=db[collection].filter(x=>x.id!==rid);
}))refresh();
}

function csvExport(collection,columns){
const records=[
columns.map(c=>c[0]),
...db[collection].map(r=>columns.map(c=>
c[1]==="employeeId"?employeeName(r.employeeId):r[c[1]]??""
))
];
const csv=records.map(row=>row.map(v=>
'"'+String(v).replaceAll('"','""')+'"'
).join(";")).join("\r\n");
download("RH-"+collection+".csv","\ufeff"+csv,"text/csv;charset=utf-8");
}

/* ===================================
   MEU NEGÓCIO
=================================== */

function home(){
const departments=[
["👥","Recursos Humanos","Central RH Enterprise",true],
["💰","Financeiro","Módulo do aplicativo principal",false],
["🛒","Vendas e CRM","Módulo do aplicativo principal",false],
["📄","Central Office","Módulo do aplicativo principal",false],
["📦","Estoque e compras","Módulo do aplicativo principal",false],
["🧾","Fiscal e contábil","Módulo do aplicativo principal",false],
["⚙️","Operações","Módulo do aplicativo principal",false],
["📊","Relatórios","Módulo do aplicativo principal",false],
["🏢","Gestão empresarial","Módulo do aplicativo principal",false],
["✨","BUSINESS IA","Módulo do aplicativo principal",false]
];
$("app").innerHTML=`
${hero("PLATAFORMA EMPRESARIAL","MEU NEGÓCIO PRO","Um único ambiente empresarial. Nesta versão independente, o departamento de RH é o módulo em desenvolvimento.","🏢")}
<div class="section"><h2>Departamentos</h2></div>
<div class="grid">
${departments.map(d=>`<button class="card" onclick="${d[3]?"go('rh')":"unavailable()"}">
<span class="ico">${d[0]}</span><b>${d[1]}</b><small>${d[2]}</small>
</button>`).join("")}
</div>
<div class="panel notice">Os outros departamentos não foram incluídos neste protótipo para não substituir nem prejudicar o aplicativo principal.</div>`;
}

function unavailable(){
alert("Este departamento não foi implementado neste arquivo de teste. Ele pertence ao projeto principal MEU NEGÓCIO.");
}

function rh(){
const active=db.employees.filter(x=>x.status==="Ativo").length;
const pending=db.leaves.filter(x=>x.status==="Pendente").length;
const open=db.vacancies.filter(x=>x.status==="Aberta").length;
const requests=db.requests.filter(x=>x.status==="Pendente").length;
const cards=[
["👥","Colaboradores","Fichas profissionais e histórico","employees"],
["🕒","Ponto e jornadas","Entradas, saídas e relatórios","attendance"],
["🏖️","Férias e ausências","Solicitações e aprovações","leaves"],
["🎯","Recrutamento","Vagas e candidatos em Kanban","recruitment"],
["💰","Folha gerencial","Lançamentos e demonstrativos","payroll"],
["📨","Solicitações","Fluxo de aprovação","requests"],
["📊","Indicadores","Gráficos e exportações","reports"],
["▦","Catálogo completo","Todas as áreas planejadas","catalog"]
];
$("app").innerHTML=`
${hero("GESTÃO DE PESSOAS","Central RH PRO","Gestão empresarial de pessoas com fluxos especializados, fichas individuais, indicadores e processos conectados.","👥")}
${statsCards([
["Colaboradores ativos",active,"Situação atual"],
["Férias pendentes",pending,"Aguardando decisão"],
["Vagas abertas",open,"Recrutamento"],
["Solicitações pendentes",requests,"Fila de atendimento"]
])}
<div class="section"><h2>Áreas de trabalho</h2><span class="muted small">Escolha o processo</span></div>
<div class="grid">${cards.map(c=>`
<button class="card" onclick="go('${c[3]}')">
<span class="ico">${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small>
</button>`).join("")}</div>
<div class="panel">
<h3>Atividade recente</h3>
${db.audit.slice(0,6).map(x=>`<p><span class="muted small">${esc(new Date(x.date).toLocaleString("pt-BR"))}</span> — ${esc(x.message)}</p>`).join("")||empty("Nenhuma atividade registrada.")}
</div>`;
}

/* ===================================
   COLABORADORES
=================================== */

const employeeSteps=["Dados pessoais","Contrato e trabalho","Remuneração e jornada","Revisão"];

function employeesPage(){
$("app").innerHTML=`
${back()}
<div class="section"><h2>Diretório de colaboradores</h2>
<button class="btn" onclick="newEmployee()">＋ Admitir colaborador</button></div>
<div class="panel">
<div class="toolbar">
<input class="search" id="employeeSearch" placeholder="Buscar por nome, matrícula, cargo ou departamento..." oninput="filterEmployees()">
<select id="employeeStatus" onchange="filterEmployees()">
<option value="">Todas as situações</option>
<option>Ativo</option><option>Férias</option><option>Afastado</option><option>Desligado</option>
</select>
<button class="btn light" onclick="csvExport('employees',[['Nome','name'],['Matrícula','registration'],['Cargo','role'],['Departamento','department'],['Situação','status']])">Exportar CSV</button>
</div>
<div class="tablewrap"><table>
<thead><tr><th>Colaborador</th><th>Matrícula</th><th>Departamento</th><th>Situação</th><th>Ações</th></tr></thead>
<tbody id="employeeRows">
${db.employees.map(e=>`
<tr data-search="${esc(JSON.stringify(e).toLowerCase())}" data-status="${esc(e.status||"Ativo")}">
<td><div class="personline"><div class="avatar">${esc(e.name?.charAt(0).toUpperCase()||"?")}</div>
<div><b>${esc(e.name)}</b><small>${esc(e.role||"Sem cargo")}</small></div></div></td>
<td>${esc(e.registration||"—")}</td>
<td>${esc(e.department||"—")}</td>

function collectWizard(){

function nextEmployeeStep(ev){
ev.preventDefault();
if(!collectWizard())return;
if(employeeStep<3){
employeeStep++;renderEmployeeWizard();return;

const e={...draftEmployee,id:editId||id()};
if(!e.name?.trim()||!e.role?.trim()||!e.department?.trim()){
alert("Nome, cargo e departamento são obrigatórios.");
employeeStep=0;renderEmployeeWizard();return;
}
if(mutate(editId?"Atualizou colaborador":"Admitiu colaborador",()=>{
if(editId)db.employees=db.employees.map(x=>x.id===editId?e:x);
else db.employees.unshift(e);

const newId=e.id;
editId=null;employeeProfile(newId);
}
}

function previousEmployeeStep(){
if(!collectWizard())return;
employeeStep=Math.max(0,employeeStep-1);
renderEmployeeWizard();

function jumpEmployeeStep(step){
if(step>employeeStep&&!collectWizard())return;
if(step!==employeeStep&&step<employeeStep)collectWizard();
employeeStep=step;renderEmployeeWizard();
}

function toMinutes(t){
if(!t)return 0;
const [h,m]=t.split(":").map(Number);
return h*60+m;
}

function duration(start,end){
let d=toMinutes(end)-toMinutes(start);
if(d<0)d+=1440;
return d;
}

function workedMinutes(r){
let d=duration(r.start,r.end);
if(r.breakStart&&r.breakEnd){
d-=duration(r.breakStart,r.breakEnd);
}
return Math.max(0,d);
}

if(!a||!b)return 0;
const x=new Date(a+"T12:00:00");
const y=new Date(b+"T12:00:00");
return Math.round((y-x)/86400000)+1;
}

}))go("leaves");

function decideLeave(rid,status){
const r=db.leaves.find(x=>x.id===rid);
if(!r)return;
if(status==="Aprovado"){
const conflict=db.leaves.some(x=>x.id!==rid&&x.employeeId===r.employeeId&&
x.status==="Aprovado"&&r.start<=x.end&&r.end>=x.start);
if(conflict)return alert("Existe outra ausência aprovada no mesmo período.");
}
if(!confirm(status==="Aprovado"?"Aprovar esta solicitação?":"Rejeitar esta solicitação?"))return;
if(mutate("Solicitação de ausência: "+status,()=>{
r.status=status;r.decidedAt=new Date().toISOString();
}))go("leaves");
}

}))go("payroll");
});
}

function requestForm(rid=null){
const r=db.requests.find(x=>x.id===rid)||{};
showForm(rid?"Editar solicitação":"Nova solicitação",`
${employeeSelect(r.employeeId)}
${field("Assunto","subject","text",r.subject,true)}
${field("Data","date","date",r.date||today(),true)}
${textField("Descrição","description",r.description)}
`,v=>{
if(mutate(rid?"Editou solicitação":"Criou solicitação",()=>{
const next={...v,id:rid||id(),status:rid?r.status:"Pendente"};
db.requests=rid?db.requests.map(x=>x.id===rid?next:x):[next,...db.requests];
}))go("requests");
});
}

function decideRequest(rid,status){
if(!confirm("Confirmar decisão: "+status+"?"))return;
if(mutate("Solicitação: "+status,()=>{
db.requests.find(x=>x.id===rid).status=status;
}))go("requests");
}

function exportAll(collection){
const arr=db[collection];
if(!Array.isArray(arr))return;
const keys=[...new Set(arr.flatMap(Object.keys))].filter(k=>k!=="id");
if(!keys.length)return alert("Não há registros para exportar.");
csvExport(collection,keys.map(k=>[k,k]));
}

/* ===================================
   BACKUP E RESTAURAÇÃO
=================================== */

function backup(){
download("MEU-NEGOCIO-RH-V3.json",
JSON.stringify({version:3,data:db},null,2),
"application/json");
}

$("restoreFile").addEventListener("change",async e=>{
const file=e.target.files?.[0];
if(!file)return;
if(file.size>5*1024*1024){
alert("Arquivo maior que 5 MB.");
e.target.value="";return;
}
try{
const parsed=JSON.parse(await file.text());
if(parsed.version!==3||!parsed.data||
!Array.isArray(parsed.data.employees))throw Error("Formato inválido");
if(!confirm("Substituir todos os dados locais pelos dados do backup?")){
e.target.value="";return;
}
const next=blank();
for(const key of Object.keys(next)){
if(Array.isArray(parsed.data[key]))next[key]=parsed.data[key];
}
const previous=db;
db=next;
if(!persist("Restaurou backup")){
db=previous;
}else{
alert("Backup restaurado.");
go("rh");
}
}catch(err){
alert("Backup inválido ou incompatível.");
}
e.target.value="";
});

/* ===================================
   INICIAR
=================================== */

go("rh");
