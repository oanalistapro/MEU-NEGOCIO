
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111d33">
<title>MEU NEGÓCIO PRO | Enterprise</title>
<style>
:root{
 --nav:#111d33;--nav2:#203453;--blue:#3767e8;--bg:#f4f7fb;
 --white:#fff;--text:#1c2a40;--muted:#72819a;--line:#e2e9f2;
 --green:#0b865f;--red:#b83245
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{
 width:100%;border:1px solid #d5dfed;border-radius:9px;
 padding:11px;background:white;color:var(--text)
}
input:focus,select:focus,textarea:focus,button:focus-visible{
 outline:2px solid #8eafff;outline-offset:2px
}
label{display:block;font-size:12px;font-weight:700;color:#546781;margin-bottom:5px}
h1,h2,h3,p{margin-top:0}
h1{font-size:25px;letter-spacing:-.6px}
h2{font-size:20px}
h3{font-size:16px}
button.primary{background:var(--blue);color:white;border:0}
button.secondary{background:#eaf0ff;color:#2855b7;border:0}
button.danger{background:#fff0f0;color:var(--red);border:0}
button.primary,button.secondary,button.danger{
 padding:10px 15px;border-radius:9px;font-weight:750
}
.layout{display:flex;min-height:100vh}
aside{
 width:255px;background:var(--nav);color:white;
 padding:20px 13px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto
}
.brand{font-size:20px;font-weight:900;padding:8px 12px 24px}
.brand span{color:#76a4ff}
.brand small{display:block;color:#91a7ca;font-size:10px;letter-spacing:2px}
.navhead{font-size:10px;color:#8396b5;letter-spacing:1.5px;margin:20px 12px 9px}
.navbtn{
 display:block;width:100%;text-align:left;background:transparent;
 border:0;color:#c4d1e5;padding:12px;border-radius:9px
}
.navbtn:hover,.navbtn.active{background:#2b4776;color:white}
main{flex:1;min-width:0;padding:25px;max-width:1750px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}
.headerleft small{color:var(--muted);font-weight:800;letter-spacing:1px}
.headerleft h1{margin:5px 0}
.headeractions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.headeractions select{width:auto;max-width:230px}
.card,.panel,.metric{
 background:var(--white);border:1px solid var(--line);
 border-radius:15px;box-shadow:0 5px 20px #20345308
}
.panel{padding:21px;margin:16px 0}
.panelhead,.toolbar{
 display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:10px;margin-bottom:17px
}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.metric{padding:19px}
.metric small{color:var(--muted)}
.metric strong{display:block;font-size:27px;margin:7px 0}
.card{padding:20px;text-align:left;min-height:140px}
button.card{width:100%;cursor:pointer}
button.card:hover{border-color:#9bb8f4;transform:translateY(-2px)}
.card .emoji{font-size:29px}
.card b{display:block;margin:13px 0 5px}
.card small{color:var(--muted)}
.hero{
 background:linear-gradient(115deg,#152c51,#3267b5);
 color:white;padding:28px;border-radius:17px;margin-bottom:18px
}
.hero p{color:#d9e8ff;max-width:740px;margin:0}
.hero h2{font-size:26px;margin:8px 0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.full{grid-column:1/-1}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:#71819a;background:#f9fbfe}
td{font-size:13px}
.muted{color:var(--muted)}
.badge{display:inline-block;background:#eef2f8;padding:5px 9px;border-radius:20px;font-size:11px}
.badge.ok{background:#def7eb;color:#086849}
.badge.warn{background:#fff0d8;color:#99630e}
.empty{text-align:center;padding:32px;color:var(--muted)}
.notice{padding:14px;background:#edf4ff;border:1px solid #c9dcff;border-radius:10px;color:#355d8e;margin:14px 0}
.auth{
 min-height:100vh;display:grid;place-items:center;padding:20px;
 background:linear-gradient(135deg,#101c33,#28549a)
}
.authbox{width:100%;max-width:440px;background:white;padding:30px;border-radius:19px}
.authbox h1{font-size:28px}
.hidden{display:none!important}
.modalbg{
 position:fixed;inset:0;background:#0c1932aa;display:grid;
 place-items:center;padding:16px;z-index:100
}
.modal{
 background:white;width:min(720px,100%);max-height:92vh;overflow:auto;
 border-radius:16px;padding:23px
}
.toast{
 position:fixed;bottom:18px;right:18px;background:#172c4a;color:white;
 padding:13px 18px;border-radius:10px;z-index:200;max-width:90vw
}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){
 aside{width:205px}main{padding:16px}
 .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
 .layout{display:block}
 aside{position:static;width:100%;height:auto;padding:9px}
 .brand{padding:5px 9px}
 .navhead{display:none}
 #nav{display:flex;overflow:auto;gap:5px}
 .navbtn{white-space:nowrap;width:auto;font-size:12px}
 main{padding:13px}
 header{align-items:flex-start;flex-direction:column}
 .headeractions{width:100%}
 .headeractions select{max-width:none;flex:1}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .card{padding:13px;min-height:125px}
 .metric{padding:13px}
 .metric strong{font-size:21px}
 .panel{padding:14px}
 .formgrid{grid-template-columns:1fr}
 .hero{padding:20px}
 .hero h2{font-size:22px}
}
</style>
</head>
<body>

<div id="auth" class="auth">
 <div class="authbox">
  <div class="muted" style="font-weight:800">BUSINESS PRO • ENTERPRISE</div>
  <h1>MEU NEGÓCIO PRO</h1>
  <p class="muted">Gestão empresarial com acesso Google e dados separados por empresa.</p>
  <button id="loginBtn" class="primary" style="width:100%">Entrar com Google</button>
  <p id="authMessage" class="muted" style="margin-top:15px"></p>
 </div>
</div>

<div id="workspace" class="layout hidden">
 <aside>
  <div class="brand">MEU <span>NEGÓCIO</span><small>ENTERPRISE PLATFORM</small></div>
  <div id="nav"></div>
 </aside>
 <main>
  <header>
   <div class="headerleft">
    <small id="breadcrumb">BUSINESS PRO</small>
    <h1 id="title">Painel empresarial</h1>
   </div>
   <div class="headeractions">
    <select id="companyPicker" aria-label="Empresa ativa"></select>
    <button class="secondary" id="newCompanyBtn">＋ Empresa</button>
    <button class="secondary" id="logoutBtn">Sair</button>
   </div>
  </header>
  <div id="content"></div>
 </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import {initializeApp} from
 "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
 getAuth,GoogleAuthProvider,signInWithPopup,
 signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
 getFirestore,collection,doc,addDoc,setDoc,getDoc,getDocs,
 updateDoc,query,where,serverTimestamp,writeBatch
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/*
  SUBSTITUA SOMENTE A CONFIGURAÇÃO ABAIXO.
  Ela é pública por definição. Nunca coloque chaves secretas aqui.
*/
const firebaseConfig={
 apiKey:"COLE_API_KEY",
 authDomain:"COLE_PROJECT_ID.firebaseapp.com",
 projectId:"COLE_PROJECT_ID",
 storageBucket:"COLE_PROJECT_ID.firebasestorage.app",
 messagingSenderId:"COLE_SENDER_ID",
 appId:"COLE_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const google=new GoogleAuthProvider();

const state={
 user:null,
 companies:[],
 companyId:"",
 role:"",
 page:"dashboard",
 employees:[],
 departments:[],
 leaves:[],
 members:[]
};

const $=id=>document.getElementById(id);

const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const dateBR=v=>{
 if(!v)return "—";
 const p=String(v).split("-");
 return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
};

const today=()=>new Date().toLocaleDateString("en-CA");

function toast(message){
 $("toastRoot").innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;
 setTimeout(()=>{$("toastRoot").innerHTML=""},4000);
}

function errorMessage(error){
 console.error(error);
 const code=error?.code||"";
 if(code==="permission-denied")return "Acesso negado pelas regras de segurança.";
 if(code==="auth/unauthorized-domain")return "Autorize este domínio no Firebase Authentication.";
 if(code==="auth/popup-blocked")return "O navegador bloqueou a janela do Google.";
 if(code==="auth/operation-not-allowed")return "Ative o provedor Google no Firebase.";
 return error?.message||"Ocorreu um erro inesperado.";
}

function canManage(){
 return ["owner","admin","hr"].includes(state.role);
}
function canApprove(){
 return ["owner","admin","hr","manager"].includes(state.role);
}
function isOwner(){
 return state.role==="owner";
}

const companyRef=()=>doc(db,"companies",state.companyId);
const sub=(name)=>collection(db,"companies",state.companyId,name);

async function audit(action,target){
 // Auditoria operacional básica. Não é um log inviolável.
 try{
  await addDoc(sub("audit"),{
   action,target,
   actorUid:state.user.uid,
   actorName:state.user.displayName||"",
   createdAt:serverTimestamp()
  });
 }catch(e){console.warn("Auditoria:",e)}
}

async function login(){
 try{
  await signInWithPopup(auth,google);
 }catch(e){
  if(e.code==="auth/popup-blocked"){
   try{await signInWithRedirect(auth,google);return}
   catch(err){$("authMessage").textContent=errorMessage(err);return}
  }
  $("authMessage").textContent=errorMessage(e);
 }
}

$("loginBtn").onclick=login;
$("logoutBtn").onclick=()=>signOut(auth);

try{await getRedirectResult(auth)}catch(e){
 $("authMessage").textContent=errorMessage(e);
}

onAuthStateChanged(auth,async user=>{
 state.user=user;
 $("auth").classList.toggle("hidden",!!user);
 $("workspace").classList.toggle("hidden",!user);
 if(!user)return;
 try{await loadCompanies()}
 catch(e){toast(errorMessage(e))}
});

async function loadCompanies(){
 const snapshot=await getDocs(
  query(collection(db,"companies"),where("memberUids","array-contains",state.user.uid))
 );
 state.companies=snapshot.docs.map(d=>({id:d.id,...d.data()}));

 const previous=state.companyId;
 const saved=sessionStorage.getItem("mn_company");
 state.companyId=state.companies.some(c=>c.id===previous)?previous:
  state.companies.some(c=>c.id===saved)?saved:
  state.companies[0]?.id||"";

 $("companyPicker").innerHTML=state.companies.map(c=>
  `<option value="${escapeHTML(c.id)}">${escapeHTML(c.name)}</option>`
 ).join("");

 $("companyPicker").value=state.companyId;

 if(!state.companyId){
  state.role="";
  renderNoCompany();
  return;
 }
 await selectCompany(state.companyId);
}

async function selectCompany(cid){
 state.companyId=cid;
 sessionStorage.setItem("mn_company",cid);
 const membership=await getDoc(
  doc(db,"companies",cid,"members",state.user.uid)
 );
 if(!membership.exists()){
  state.role="";
  $("content").innerHTML="<div class='notice'>Você não possui acesso a esta empresa.</div>";
  return;
 }
 state.role=membership.data().role;
 await loadData();
 render();
}

$("companyPicker").onchange=e=>selectCompany(e.target.value)
 .catch(err=>toast(errorMessage(err)));

$("newCompanyBtn").onclick=companyModal;

function renderNoCompany(){
 $("title").textContent="Bem-vindo ao MEU NEGÓCIO";
 $("nav").innerHTML="";
 $("content").innerHTML=`
 <div class="hero"><h2>Crie sua primeira empresa</h2>
 <p>Organize colaboradores, departamentos e processos em um ambiente próprio.</p></div>
 <div class="panel">
 <h3>Nenhuma empresa encontrada</h3>
 <p class="muted">Crie uma empresa para iniciar a gestão.</p>
 <button class="primary" id="firstCompany">Criar empresa</button>
 </div>`;
 $("firstCompany").onclick=companyModal;
}

function openModal(title,html,onSubmit){
 $("modalRoot").innerHTML=`
 <div class="modalbg" id="modalBg">
 <div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}">
 <div class="panelhead"><h2>${escapeHTML(title)}</h2>
 <button type="button" class="secondary" id="closeModal">Fechar</button></div>
 <form id="modalForm">
 <div class="formgrid">${html}</div>
 <div class="actions">
 <button class="primary" type="submit">Salvar informações</button>
 <button class="secondary" type="button" id="cancelModal">Cancelar</button>
 </div>
 </form></div></div>`;
 $("closeModal").onclick=closeModal;
 $("cancelModal").onclick=closeModal;
 $("modalForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector("[type=submit]");
  btn.disabled=true;
  try{
   const values=Object.fromEntries(new FormData(e.target));
   await onSubmit(values);
   closeModal();
  }catch(err){
   toast(errorMessage(err));
  }finally{
   btn.disabled=false;
  }
 };
}
function closeModal(){$("modalRoot").innerHTML=""}

function input(label,name,value="",type="text",required=false){
 return `<div><label>${escapeHTML(label)}</label>
 <input name="${escapeHTML(name)}" type="${type}"
 value="${escapeHTML(value)}" ${required?"required":""}></div>`;
}

function select(label,name,items,current=""){
 return `<div><label>${escapeHTML(label)}</label>
 <select name="${escapeHTML(name)}">
 ${items.map(x=>{
  const value=typeof x==="string"?x:x.value;
  const text=typeof x==="string"?x:x.label;
  return `<option value="${escapeHTML(value)}" ${value===current?"selected":""}>${escapeHTML(text)}</option>`;
 }).join("")}
 </select></div>`;
}

function textarea(label,name,value=""){
 return `<div class="full"><label>${escapeHTML(label)}</label>
 <textarea name="${escapeHTML(name)}" rows="3">${escapeHTML(value)}</textarea></div>`;
}

function companyModal(){
 openModal("Cadastrar empresa",`
 ${input("Razão social ou nome da empresa","name","","text",true)}
 ${input("Nome fantasia","tradeName")}
 ${input("CNPJ (opcional neste teste)","cnpj")}
 ${input("Cidade","city")}
 ${input("Estado","state")}
 `,async v=>{
  if(!v.name.trim())throw Error("Informe o nome da empresa.");
  const ref=doc(collection(db,"companies"));
  const batch=writeBatch(db);
  batch.set(ref,{
   name:v.name.trim(),tradeName:v.tradeName.trim(),
   cnpj:v.cnpj.trim(),city:v.city.trim(),state:v.state.trim(),
   ownerUid:state.user.uid,
   memberUids:[state.user.uid],
   createdAt:serverTimestamp()
  });
  batch.set(doc(db,"companies",ref.id,"members",state.user.uid),{
   uid:state.user.uid,
   email:state.user.email||"",
   name:state.user.displayName||"",
   role:"owner",
   createdAt:serverTimestamp()
  });
  await batch.commit();
  state.companyId=ref.id;
  await loadCompanies();
  toast("Empresa criada.");
 });
}

const navigation=[
 ["PRINCIPAL",[
  ["dashboard","▦ Painel executivo"],
  ["companies","🏢 Estrutura empresarial"]
 ]],
 ["RECURSOS HUMANOS",[
  ["employees","👥 Colaboradores"],
  ["departments","🏛 Departamentos"],
  ["leaves","🏖 Férias e ausências"],
  ["team","🔐 Usuários e acessos"],
  ["audit","🧾 Auditoria"]
 ]],
 ["CATÁLOGO ENTERPRISE",[
  ["catalog","▦ Todos os módulos"]
 ]]
];

function renderNav(){
 $("nav").innerHTML=navigation.map(group=>`
 <div class="navhead">${group[0]}</div>
 ${group[1].map(item=>`
 <button class="navbtn ${state.page===item[0]?"active":""}"
 data-page="${item[0]}">${item[1]}</button>`).join("")}
 `).join("");
 document.querySelectorAll("[data-page]").forEach(b=>
  b.onclick=()=>go(b.dataset.page)
 );
}

function go(page){
 state.page=page;
 render();
}

function render(){
 renderNav();
 const names={
 dashboard:"Painel executivo",companies:"Estrutura empresarial",
 employees:"Colaboradores",departments:"Departamentos",
 leaves:"Férias e ausências",team:"Usuários e acessos",
 audit:"Auditoria",catalog:"Catálogo Enterprise"
 };
 $("title").textContent=names[state.page]||"MEU NEGÓCIO";
 $("breadcrumb").textContent=
  (state.companies.find(c=>c.id===state.companyId)?.name||"Empresa")+
  " / "+(state.role||"");
 const views={
 dashboard:dashboardPage,companies:companiesPage,
 employees:employeesPage,departments:departmentsPage,
 leaves:leavesPage,team:teamPage,audit:auditPage,catalog:catalogPage
 };
 (views[state.page]||dashboardPage)();
}

async function loadData(){
 const names=["employees","departments","leaves","members"];
 const values=await Promise.all(names.map(async name=>{
  const snapshot=await getDocs(sub(name));
  return snapshot.docs.map(d=>({id:d.id,...d.data()}));
 }));
 names.forEach((name,i)=>state[name]=values[i]);
}

async function reload(){
 await loadData();
 render();
}

function hero(title,description){
 return `<div class="hero"><div class="muted" style="color:#bed6ff">MEU NEGÓCIO PRO • ENTERPRISE</div>
 <h2>${title}</h2><p>${description}</p></div>`;
}

function metrics(items){
 return `<div class="grid">${items.map(x=>`
 <div class="metric"><small>${x[0]}</small>
 <strong>${x[1]}</strong><span class="muted">${x[2]||""}</span></div>
 `).join("")}</div>`;
}

function empty(message){
 return `<div class="empty">${escapeHTML(message)}</div>`;
}

function status(value){
 const positive=["Ativo","Aprovado","Concluído"];
 return `<span class="badge ${positive.includes(value)?"ok":"warn"}">${escapeHTML(value||"—")}</span>`;
}

function employeeName(id){
 return state.employees.find(x=>x.id===id)?.name||"Não encontrado";
}

function dashboardPage(){
 const active=state.employees.filter(x=>x.status==="Ativo").length;
 const pending=state.leaves.filter(x=>x.status==="Pendente").length;
 $("content").innerHTML=`
 ${hero("Gestão empresarial integrada",
 "Uma empresa, várias áreas de gestão. Dados separados por organização e permissões por perfil.")}
 ${metrics([
 ["Colaboradores ativos",active,"Equipe atual"],
 ["Departamentos",state.departments.length,"Estrutura"],
 ["Ausências pendentes",pending,"Aguardando decisão"],
 ["Usuários autorizados",state.members.length,"Acessos"]
 ])}
 <div class="panel">
 <div class="panelhead"><h2>Áreas de trabalho</h2></div>
 <div class="grid">
 ${[
 ["👥","Colaboradores","employees","Fichas e contratos"],
 ["🏢","Estrutura","companies","Empresas e filiais futuras"],
 ["🏛","Departamentos","departments","Unidades organizacionais"],
 ["🏖","Férias e ausências","leaves","Solicitações e aprovações"],
 ["🔐","Permissões","team","Perfis de acesso"],
 ["🧾","Auditoria","audit","Atividade operacional"],
 ["▦","Catálogo","catalog","Planejamento dos módulos"]
 ].map(x=>`<button class="card" data-go="${x[2]}">
 <span class="emoji">${x[0]}</span><b>${x[1]}</b><small>${x[3]}</small>
 </button>`).join("")}
 </div></div>
 <div class="notice">
 Esta é a base Enterprise em construção. Os módulos operacionais concluídos aparecem no menu.
 O catálogo mostra os recursos planejados, sem apresentá-los como prontos.
 </div>`;
 document.querySelectorAll("[data-go]").forEach(b=>
  b.onclick=()=>go(b.dataset.go)
 );
}

/* EMPRESA E ESTRUTURA */

function companiesPage(){
 const c=state.companies.find(x=>x.id===state.companyId);
 $("content").innerHTML=`
 <div class="panel">
 <h2>Empresa ativa</h2>
 <p><b>${escapeHTML(c?.name)}</b></p>
 <p class="muted">Nome fantasia: ${escapeHTML(c?.tradeName||"—")}</p>
 <p class="muted">CNPJ informado: ${escapeHTML(c?.cnpj||"—")}</p>
 <p class="muted">Cidade: ${escapeHTML(c?.city||"—")} / ${escapeHTML(c?.state||"—")}</p>
 <p class="muted">Seu perfil: ${escapeHTML(state.role)}</p>
 <button class="primary" id="addCompany">＋ Adicionar empresa</button>
 </div>`;
 $("addCompany").onclick=companyModal;
}

function departmentsPage(){
 $("content").innerHTML=`
 <div class="panel">
 <div class="panelhead"><h2>Departamentos</h2>
 ${canManage()?'<button class="primary" id="addDepartment">＋ Criar departamento</button>':""}
 </div>
 <div class="tablewrap"><table>
 <thead><tr><th>Departamento</th><th>Código</th><th>Responsável</th><th>Colaboradores</th><th>Ações</th></tr></thead>
 <tbody>${state.departments.map(d=>`
 <tr><td><b>${escapeHTML(d.name)}</b></td>
 <td>${escapeHTML(d.code||"—")}</td>
 <td>${escapeHTML(d.manager||"—")}</td>
 <td>${state.employees.filter(e=>e.departmentId===d.id).length}</td>
 <td>${canManage()?`<button class="secondary" data-edit-dep="${d.id}">Editar</button>`:"—"}</td></tr>
 `).join("")}</tbody></table></div>
 ${state.departments.length?"":empty("Nenhum departamento cadastrado.")}
 </div>`;
 if(canManage()){
  $("addDepartment").onclick=()=>departmentModal();
  document.querySelectorAll("[data-edit-dep]").forEach(b=>
   b.onclick=()=>departmentModal(b.dataset.editDep)
  );
 }
}

function departmentModal(id=null){
 const d=state.departments.find(x=>x.id===id)||{};
 openModal(id?"Editar departamento":"Criar departamento",`

function leavesPage(){
 $("content").innerHTML=`
 <div class="panel">
 <div class="panelhead"><h2>Férias e ausências</h2>
 ${canManage()?'<button class="primary" id="addLeave">＋ Criar solicitação</button>':""}
 </div>
 <div class="tablewrap"><table>
 <thead><tr><th>Colaborador</th><th>Tipo</th><th>Período</th><th>Dias</th><th>Situação</th><th>Decisão</th></tr></thead>
 <tbody>${state.leaves.map(l=>`
 <tr><td>${escapeHTML(employeeName(l.employeeId))}</td>
 <td>${escapeHTML(l.type)}</td>
 <td>${dateBR(l.start)} até ${dateBR(l.end)}</td>
 <td>${calculateDays(l.start,l.end)}</td>
 <td>${status(l.status)}</td>
 <td>${l.status==="Pendente"&&canApprove()?`
 <button class="secondary" data-approve="${l.id}">Aprovar</button>
 <button class="danger" data-reject="${l.id}">Rejeitar</button>`:"—"}</td></tr>
 `).join("")}</tbody></table></div>
 ${state.leaves.length?"":empty("Nenhuma solicitação registrada.")}
 </div>
 <div class="notice">A aprovação registra uma decisão administrativa. O sistema ainda não calcula períodos aquisitivos, remuneração de férias ou obrigações legais.</div>`;
 if(canManage())$("addLeave").onclick=leaveModal;
 document.querySelectorAll("[data-approve]").forEach(b=>
  b.onclick=()=>decideLeave(b.dataset.approve,"Aprovado")
 );
 document.querySelectorAll("[data-reject]").forEach(b=>
  b.onclick=()=>decideLeave(b.dataset.reject,"Rejeitado")
 );
}

function calculateDays(a,b){
 if(!a||!b)return 0;
 return Math.round((
  new Date(b+"T12:00:00")-new Date(a+"T12:00:00")
 )/86400000)+1;
}

function leaveModal(){
 if(!state.employees.length)return toast("Cadastre um colaborador primeiro.");
 openModal("Solicitar ausência",`
 ${select("Colaborador","employeeId",state.employees.map(e=>({
  value:e.id,label:e.name
 })))}
 ${select("Tipo","type",["Férias","Licença","Folga","Afastamento"])}
 ${input("Início","start","","date",true)}
 ${input("Fim","end","","date",true)}
 ${textarea("Observações","notes")}
 `,async v=>{
  if(!canManage())throw Error("Sem permissão.");
  if(v.end<v.start)throw Error("O fim não pode ser anterior ao início.");
  const conflict=state.leaves.some(l=>
   l.employeeId===v.employeeId&&l.status==="Aprovado"&&
   v.start<=l.end&&v.end>=l.start
  );
  if(conflict)throw Error("Existe uma ausência aprovada no mesmo período.");
  await addDoc(sub("leaves"),{
   ...v,status:"Pendente",
   createdBy:state.user.uid,
   createdAt:serverTimestamp()
  });
  await audit("Solicitar ausência",employeeName(v.employeeId));
  await reload();
 });
}

async function decideLeave(id,decision){
 if(!canApprove())return;
 const leave=state.leaves.find(l=>l.id===id);
 if(!leave||leave.status!=="Pendente")return;
 if(decision==="Aprovado"){
  const conflict=state.leaves.some(l=>
   l.id!==id&&l.employeeId===leave.employeeId&&
   l.status==="Aprovado"&&
   leave.start<=l.end&&leave.end>=l.start
  );
  if(conflict)return toast("Conflito com ausência já aprovada.");
 }
 if(!confirm("Confirmar decisão: "+decision+"?"))return;
 try{
  await updateDoc(doc(sub("leaves"),id),{
   status:decision,
   decidedBy:state.user.uid,
   decidedAt:serverTimestamp()
  });
  await audit("Decisão de ausência: "+decision,employeeName(leave.employeeId));
  await reload();
 }catch(e){toast(errorMessage(e))}
}

function memberModal(){
 openModal("Autorizar usuário",`
 ${input("UID do Firebase Authentication","uid","","text",true)}
 ${input("E-mail para identificação","email","","email",true)}
 ${input("Nome","name")}
 ${select("Perfil","role",[
  {value:"admin",label:"Administrador"},
  {value:"hr",label:"Recursos Humanos"},
  {value:"manager",label:"Gestor"},
  {value:"employee",label:"Colaborador"},
  {value:"auditor",label:"Auditor"}
 ])}
 `,async v=>{
  if(!isOwner())throw Error("Somente o proprietário pode autorizar membros.");
  const uid=v.uid.trim();
  if(!uid||uid.includes("/"))throw Error("UID inválido.");
  if(state.members.some(m=>m.uid===uid))
   throw Error("Este usuário já pertence à empresa.");
  const batch=writeBatch(db);
  const c=state.companies.find(x=>x.id===state.companyId);
  batch.set(doc(sub("members"),uid),{
   uid,email:v.email.trim(),name:v.name.trim(),
   role:v.role,createdAt:serverTimestamp()
  });
  batch.update(companyRef(),{
   memberUids:[...new Set([...(c.memberUids||[]),uid])]
  });
  await batch.commit();
  await audit("Autorizar usuário",v.email);
  await loadCompanies();
 });
}

/* AUDITORIA */

async function auditPage(){
 $("content").innerHTML=`<div class="panel"><h2>Carregando atividades...</h2></div>`;
 try{
  const snapshot=await getDocs(sub("audit"));
  const items=snapshot.docs.map(d=>d.data()).sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
  ).slice(0,100);
  if(state.page!=="audit")return;
  $("content").innerHTML=`
  <div class="panel"><h2>Histórico de atividades</h2>
  <div class="tablewrap"><table>
  <thead><tr><th>Data</th><th>Responsável</th><th>Ação</th><th>Registro</th></tr></thead>
  <tbody>${items.map(a=>`
  <tr><td>${a.createdAt?.toDate?.().toLocaleString("pt-BR")||"—"}</td>
  <td>${escapeHTML(a.actorName||a.actorUid)}</td>
  <td>${escapeHTML(a.action)}</td>
  <td>${escapeHTML(a.target)}</td></tr>
  `).join("")}</tbody></table></div>
  ${items.length?"":empty("Nenhuma atividade registrada.")}
  </div>
  <div class="notice">Log operacional gerado pelo navegador; ainda não é uma trilha de auditoria inviolável.</div>`;
 }catch(e){toast(errorMessage(e))}
}
