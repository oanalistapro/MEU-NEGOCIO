<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1730">
<title>MEU NEGÓCIO PRO | Central RH V2</title>
<style>
:root{
 --navy:#0b1730;--navy2:#142849;--blue:#2563eb;
 --bg:#f3f6fc;--white:#fff;--text:#182842;
 --muted:#718099;--line:#e4eaf3;--green:#059669;
 --red:#dc2626;--orange:#ea8b23;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Arial,system-ui,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.shell{display:flex;min-height:100vh}
aside{width:258px;flex-shrink:0;background:var(--navy);color:white;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:22px;font-weight:900;letter-spacing:-.7px;padding:8px 12px 25px}
.logo span{color:#67a7ff}
.logo small{display:block;color:#88a5ca;font-size:10px;letter-spacing:2px;margin-top:7px}
.navlabel{color:#7189ac;font-size:10px;letter-spacing:2px;margin:18px 13px 10px}
.nav{width:100%;border:0;text-align:left;background:transparent;color:#c4d1e4;padding:13px;border-radius:10px;margin:3px 0}
.nav:hover,.nav.active{background:#2563eb;color:white}
main{flex:1;min-width:0;padding:27px 30px 90px;max-width:1800px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:25px;margin:5px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tag{border:1px solid var(--line);background:white;border-radius:25px;padding:9px 13px;font-size:12px}
.hero{background:linear-gradient(115deg,#112c50,#1b56aa 75%,#448cf1);color:white;border-radius:20px;padding:29px;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 12px 28px #1c56a61b}
.hero h2{font-size:29px;margin:10px 0}
.hero p{color:#d7e7ff;line-height:1.6;max-width:760px}
.heroicon{font-size:68px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:white;font-weight:700}
.btn:hover{filter:brightness(.95)}
.btn.light{background:#eaf1ff;color:#174e9a}
.btn.white{background:white;color:#174b92}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.green{background:#dcfce7;color:#166534}
.btn.dark{background:#19385e}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.stat,.panel,.feature,.person{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #102a4d08}
.stat{padding:20px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:27px;margin:12px 0 5px}
.stat em{font-size:11px;color:var(--muted);font-style:normal}
.panel{padding:23px;margin:18px 0}
.panel h3{margin:0 0 16px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}
.sectionhead h2{font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.feature{padding:19px;text-align:left;min-height:145px;transition:.2s;color:var(--text)}
.feature:hover{transform:translateY(-3px);border-color:#93c5fd;box-shadow:0 10px 24px #1d4ed818}
.feature .emoji{font-size:29px}
.feature b{display:block;font-size:14px;margin:14px 0 7px}
.feature small{display:block;color:var(--muted);line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:15px 0}
input,select,textarea{background:#fafcff;border:1px solid #d9e3f0;border-radius:10px;padding:11px;color:var(--text);max-width:100%}
.search{width:100%;min-height:46px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:12px;color:#4c6685;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:44px}
.field textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
.heading{grid-column:1/-1;font-size:14px;font-weight:800;color:#215a9e;border-bottom:1px solid var(--line);padding:13px 0 8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;overflow-wrap:anywhere}
th{font-size:11px;color:#64748b}
.act{border:0;background:#eaf1ff;color:#20518d;border-radius:8px;padding:8px;margin:2px}
.act.red{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:35px;color:var(--muted)}
.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:15px;color:#235384;line-height:1.6;font-size:13px}
.back{border:0;background:transparent;color:var(--blue);font-weight:800;padding:10px 0;margin-bottom:10px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.person{padding:18px}
.avatar{height:45px;width:45px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;border-radius:12px;font-size:20px;font-weight:900}
.person h4{margin:12px 0 6px}
.person p{font-size:12px;color:var(--muted);margin:5px 0}
.status{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:5px 10px;font-size:11px}
.subgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.subcard{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:15px}
.subcard b{display:block;font-size:13px;margin-bottom:7px}
.subcard small{color:var(--muted);line-height:1.5}
.chart{display:flex;align-items:flex-end;gap:12px;height:160px;padding:12px 0}
.barbox{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.bar{background:linear-gradient(#3b82f6,#174a9b);border-radius:7px 7px 0 0;min-height:4px}
.mobile{display:none}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}.people{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){aside{width:210px}main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
aside{display:none}main{padding:15px 12px 90px}
.top h1{font-size:20px}.hero{padding:21px}.hero h2{font-size:23px}.heroicon{display:none}
.grid{gap:10px}.feature{padding:14px;min-height:135px}
.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:22px}
.panel{padding:15px}.form,.people,.subgrid{grid-template-columns:1fr}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b1730;padding:10px;justify-content:space-around;z-index:20}
.mobile button{background:transparent;color:white;border:0;font-size:12px;padding:8px}
}
@media print{
aside,.mobile,.top,.toolbar,.back,.btn,.act{display:none!important}
main{padding:0}.panel{box-shadow:none;border:0}body{background:white}
}
</style>
</head>

function validate(id,r){
if(["ferias","escalas"].includes(id)&&r.inicio&&r.fim&&r.fim<r.inicio)
return "A data final não pode ser anterior à inicial.";

if(id==="ponto"){
if(r.saida<r.entrada)
return "Esta versão não suporta jornadas que atravessam a meia-noite.";
if(Boolean(r.inicioIntervalo)!==Boolean(r.fimIntervalo))
return "Informe os dois horários do intervalo.";
if(r.inicioIntervalo&&
(r.inicioIntervalo<r.entrada||
r.fimIntervalo<r.inicioIntervalo||
r.fimIntervalo>r.saida))
return "Confira os horários do intervalo.";
}

if(id==="avaliacoes"&&(Number(r.nota)<0||Number(r.nota)>10))
return "A nota deve ficar entre 0 e 10.";

if(id==="metas"&&(Number(r.progresso)<0||Number(r.progresso)>100))
return "O progresso deve ficar entre 0 e 100%.";

if(id==="funcionarios"&&r.cpf){
const digits=r.cpf.replace(/\D/g,"");
if(digits.length!==11)return "O CPF deve conter 11 dígitos.";
}

return "";
}

function saveRecord(ev){
ev.preventDefault();
const id=currentModule;
const values=Object.fromEntries(new FormData(ev.target));
const error=validate(id,values);
if(error)return alert(error);

const previous=db[id].find(x=>x.id===editing);
values.id=editing||uid();
values.criadoEm=previous?.criadoEm||new Date().toISOString();

const before=JSON.stringify(db[id]);
if(editing)db[id]=db[id].map(x=>x.id===editing?values:x);
else db[id].unshift(values);

if(!saveDB((editing?"Editou":"Criou")+" registro em "+itemNames[id])){
db[id]=JSON.parse(before);
return;
}

editing=null;
renderModule();
}

const linked=ids.some(k=>k!=="funcionarios"&&db[k].some(x=>x.funcionario===id));

}
if(!confirm("Deseja excluir este registro?"))return;

const before=JSON.stringify(db[module]);
db[module]=db[module].filter(x=>x.id!==id);
if(!saveDB("Excluiu registro em "+itemNames[module])){

}

/* ===================================

=================================== */

function mins(t){
if(!t)return 0;
const [h,m]=t.split(":").map(Number);
return h*60+m;
}

function worked(p){
let total=mins(p.saida)-mins(p.entrada);
if(p.inicioIntervalo&&p.fimIntervalo)
total-=mins(p.fimIntervalo)-mins(p.inicioIntervalo);
return Math.max(0,total);
}

const total=db.ponto.reduce((s,x)=>s+worked(x),0);
return `<div class="panel">

</div>
<div class="notice">
Cálculo simples para jornadas no mesmo dia. Não é registro eletrônico de ponto regulamentado nem calcula automaticamente horas extras, adicional noturno ou banco de horas.
</div></div>`;
}

s+Number(r.salario||0)+Number(r.adicionais||0)-Number(r.descontos||0),0);

const counts={};
db.funcionarios.forEach(x=>{
const key=x.departamento||"Não informado";
counts[key]=(counts[key]||0)+1;
});
const entries=Object.entries(counts);
if(!entries.length)return `<div class="empty">Cadastre colaboradores para visualizar o gráfico.</div>`;
const max=Math.max(...entries.map(x=>x[1]),1);
return `<div class="chart">${entries.slice(0,12).map(x=>`
<div class="barbox">
<div>${x[1]}</div>
<div class="bar" style="height:${Math.max(5,x[1]/max*120)}px"></div>
<div style="overflow-wrap:anywhere;margin-top:8px">${safe(x[0])}</div>
</div>`).join("")}</div>`;
}

/* ===================================
   EXPORTAÇÃO E BACKUP
=================================== */

function exportCSV(id){
if(!db[id])return;
const fields=schema(id).filter(x=>!x.section);
const records=[
fields.map(f=>f.label),
...db[id].map(r=>fields.map(f=>displayField(f,r[f.key])))
];
const csv=records.map(row=>row.map(v=>
'"'+String(v??"").replaceAll('"','""')+'"'
).join(";")).join("\r\n");

download("RH-"+id+".csv","\ufeff"+csv,"text/csv;charset=utf-8");
}

function backup(){
download(
"MEU-NEGOCIO-RH-V2-BACKUP.json",
JSON.stringify({version:2,data:db},null,2),
"application/json"
);
}

async function restoreBackup(input){
const file=input.files?.[0];
if(!file)return;
if(file.size>5*1024*1024){
alert("O backup excede o limite de 5 MB desta demonstração.");
input.value="";
return;
}
try{
const parsed=JSON.parse(await file.text());
if(parsed.version!==2||!parsed.data||!Array.isArray(parsed.data.funcionarios))
throw new Error("Formato inválido");

if(!confirm("Substituir todos os dados locais atuais pelos dados do backup?")){
input.value="";
return;
}

const next=emptyDB();
Object.keys(next).forEach(k=>{
if(Array.isArray(parsed.data[k]))next[k]=parsed.data[k];
});

const previous=db;
db=next;
if(!saveDB("Restaurou backup")){
db=previous;
}else{
alert("Backup restaurado.");
rh();
}
}catch(e){
alert("Arquivo de backup inválido ou incompatível.");
}
input.value="";
}

/* ===================================
   INICIALIZAÇÃO
=================================== */

rh();
