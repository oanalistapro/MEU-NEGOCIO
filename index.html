
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEU NEGÓCIO PRO | BUSINESS PRO</title>
<style>
:root{
--bg:#071321;--panel:#10243b;--line:#29435f;
--text:#eff6ff;--muted:#a7bdd7;--blue:#489aff;
--green:#3ed5a1;--red:#ff8292
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:240px;background:#0b1c30;padding:20px 12px;border-right:1px solid var(--line);flex-shrink:0}
.logo{font-size:23px;font-weight:900;padding:10px}
.logo span{color:var(--blue)}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:8px}
.nav{display:block;width:100%;padding:13px;text-align:left;background:none;color:var(--muted);border:0;border-radius:10px;margin:3px 0}
.nav:hover,.nav.active{background:#1c416a;color:white}
main{flex:1;min-width:0;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:24px}
.hero{background:linear-gradient(110deg,#205b9c,#10243b);padding:24px;border-radius:18px;margin:18px 0;border:1px solid #356a9e}
.hero h2{margin:0 0 8px;font-size:24px}
.hero p{color:#d0e0f3}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}
.card,.stat,.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}
.tile{color:white;text-align:left;min-height:112px}
.tile:hover{border-color:var(--blue)}
.tile .emoji{display:block;font-size:28px;margin-bottom:12px}
.tile small{display:block;color:var(--muted);margin-top:8px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:22px;margin-top:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:#b7d1ef;font-size:12px}
.field input,.field select,.field textarea,.search{
width:100%;padding:12px;background:#091a2d;
border:1px solid #365371;border-radius:9px;color:white
}
.field textarea{min-height:100px}
.full{grid-column:1/-1}
.btn{background:var(--blue);border:0;color:#071321;padding:11px 16px;border-radius:10px;font-weight:bold}
.btn.alt{background:#1a3655;color:white;border:1px solid var(--line)}
.btn.danger{background:#633044;color:white}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:570px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
.mini{background:#1c3b5b;color:white;border:1px solid var(--line);border-radius:7px;padding:7px;margin:2px}
.note{background:#193652;padding:13px;border-radius:10px;color:#c7d9ed;line-height:1.5}
.doc{background:white;color:#172234;padding:30px;border-radius:10px;line-height:1.8}
.doc h2{text-align:center}
.mobile{display:none}
@media(max-width:1100px){
.grid{grid-template-columns:repeat(3,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:750px){
aside{display:none}
main{padding:14px 12px 80px}
.grid{grid-template-columns:repeat(2,1fr);gap:9px}
.stats{gap:9px}
.stat strong{font-size:17px}
.form{grid-template-columns:1fr}
.hero{padding:18px}
.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b1c30;justify-content:space-around;padding:10px;border-top:1px solid var(--line)}
.mobile button{background:none;color:white;border:0}
}
@media print{
aside,.mobile,header,.hero,.bar,.btn,.note{display:none!important}
body{background:white;color:black}
main{padding:0}
.card,.doc{background:white;color:black;border:0}
}
</style>
</head>
<body>

<div class="app">
<aside>
<div class="logo">MEU <span>NEGÓCIO</span><small>BUSINESS PRO</small></div>
<nav id="menu"></nav>
</aside>
<main>
<header>
<div>
<small style="color:#a7bdd7">Sistema empresarial integrado</small>
<h1 id="title">Visão geral</h1>
</div>
<small style="color:#a7bdd7">🔒 TESTE LOCAL</small>
</header>
<div id="content"></div>
</main>
</div>

<div class="mobile">
<button onclick="go('home')">⌂ Início</button>
<button onclick="go('vendas')">👥 Vendas</button>
<button onclick="go('financeiro')">💳 Caixa</button>
<button onclick="go('documentos')">📄 Docs</button>
</div>

<script>
"use strict";

const MODS=[
["home","⌂","Visão geral"],
["gestao","🏢","Gestão empresarial"],
["financeiro","💳","Financeiro"],
["vendas","🛒","Vendas"],
["documentos","📄","Documentos"],
["rh","👥","Recursos humanos"],
["estoque","📦","Estoque"],
["fiscal","🧾","Fiscal"],
["operacoes","📋","Operações"],
["relatorios","📊","Relatórios"],
["ia","✨","BUSINESS IA"]
];

const KEY="meu_negocio_pro_integrado_2026";

const blank=()=>({
empresa:{},
clientes:[],fornecedores:[],produtos:[],
financeiro:[],funcionarios:[],tarefas:[],
orcamentos:[],documentos:[],fiscais:[],
movimentos:[]
});

let db=blank();
let current="home";
let editing=null;
let budgetItems=[];

try{
const saved=JSON.parse(localStorage.getItem(KEY)||"null");
if(saved&&typeof saved==="object"){
const base=blank();
for(const k of Object.keys(base)){
if(k==="empresa"&&saved.empresa&&typeof saved.empresa==="object")base.empresa=saved.empresa;
else if(Array.isArray(base[k])&&Array.isArray(saved[k]))base[k]=saved[k];
}
db=base;
}
}catch(e){}

const $=id=>document.getElementById(id);
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random();
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const today=()=>new Date().toLocaleDateString("en-CA");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){
try{localStorage.setItem(KEY,JSON.stringify(db));return true}
catch(e){alert("Erro ao salvar dados neste navegador.");return false}
}

function change(fn){
const previous=JSON.stringify(db);
fn();
if(!save()){db=JSON.parse(previous);return false}
return true;
}

function download(name,text,type){
const url=URL.createObjectURL(new Blob([text],{type}));
const a=document.createElement("a");
a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function field(k,label,type="text",value="",required=false,opts=[]){
const id="f_"+k;
let input;
if(type==="select"){
input=`<select id="${id}" name="${k}" ${required?"required":""}>${opts.map(x=>`<option value="${esc(x)}" ${value===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
}else if(type==="textarea"){
input=`<textarea id="${id}" name="${k}">${esc(value)}</textarea>`;
}else{
input=`<input id="${id}" name="${k}" type="${type==="money"?"number":type}" value="${esc(value)}" ${required?"required":""} ${type==="money"?'min="0" step="0.01"':""}>`;
}
return `<div class="field"><label for="${id}">${label}</label>${input}</div>`;
}

function hero(title,subtitle){
return `<div class="hero"><h2>${title}</h2><p>${subtitle}</p></div>`;
}

function stat(label,value){
return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`;
}

function totals(type,status="Pago"){
return db.financeiro.filter(x=>x.tipo===type&&x.status===status)
.reduce((s,x)=>s+Number(x.valor||0),0);
}

const SCHEMAS={
clientes:{
title:"Clientes",
fields:[
["nome","Nome / razão social","text",true],
["tipo","Tipo","select",false,["Pessoa física","Pessoa jurídica"]],
["documento","CPF / CNPJ"],
["telefone","Telefone","tel"],
["email","E-mail","email"],
["cidade","Cidade"],
["endereco","Endereço"],
["observacoes","Observações","textarea"]
]},
fornecedores:{
title:"Fornecedores",
fields:[
["nome","Nome / razão social","text",true],
["cnpj","CPF / CNPJ"],
["telefone","Telefone","tel"],
["email","E-mail","email"],
["categoria","Categoria"]
]},
funcionarios:{
title:"Funcionários",
fields:[
["nome","Nome completo","text",true],
["cargo","Cargo","text",true],
["departamento","Departamento"],
["salario","Salário (R$)","money"],
["admissao","Admissão","date"],
["jornada","Jornada semanal"],
["status","Situação","select",false,["Ativo","Férias","Afastado","Desligado"]]
]},
financeiro:{
title:"Contas a pagar e receber",
fields:[
["descricao","Descrição","text",true],
["tipo","Tipo","select",true,["Receita","Despesa"]],
["valor","Valor (R$)","money",true],
["vencimento","Vencimento","date",true],
["status","Situação","select",true,["Pendente","Pago"]],
["categoria","Categoria"],
["observacoes","Observações","textarea"]
]},
tarefas:{
title:"Tarefas e serviços",
fields:[
["titulo","Título","text",true],
["responsavel","Responsável"],
["prioridade","Prioridade","select",false,["Baixa","Média","Alta","Urgente"]],
["prazo","Prazo","date"],
["status","Situação","select",false,["Pendente","Em andamento","Concluído"]],
["descricao","Descrição","textarea"]
]},
fiscais:{
title:"Documentos fiscais recebidos",
fields:[
["numero","Número do documento","text",true],
["tipo","Tipo","select",false,["NF-e","NFS-e","NFC-e","Outro"]],
["emissor","Emissor"],
["valor","Valor (R$)","money"],
["data","Emissão","date"],
["status","Situação","select",false,["Pendente","Conferido","Arquivado"]]
]},
produtos:{
title:"Produtos e serviços",
fields:[
["nome","Nome","text",true],
["sku","Código / SKU"],
["tipo","Tipo","select",false,["Produto","Serviço"]],
["preco","Preço de venda","money",true],
["custo","Custo","money"],
["qtd","Quantidade atual","number"],
["minimo","Estoque mínimo","number"],
["unidade","Unidade","select",false,["UN","KG","CX","M","L","HORA"]],
["categoria","Categoria"]
]}
};

function go(id){
current=id;editing=null;
$("title").textContent=MODS.find(m=>m[0]===id)?.[2]||id;
document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
render();
window.scrollTo(0,0);
}

function dashboard(){
const income=totals("Receita"),expense=totals("Despesa");
return hero("Bem-vindo ao MEU NEGÓCIO PRO","Sua empresa, clientes, vendas, documentos e finanças em uma única plataforma.")+
`<div class="stats">
${stat("Saldo realizado",money(income-expense))}
${stat("Receitas",money(income))}
${stat("Despesas",money(expense))}
${stat("Clientes",db.clientes.length)}
</div>
<h2>Departamentos</h2>
<div class="grid">${MODS.slice(1).map(m=>`
<button class="tile" onclick="go('${m[0]}')">
<span class="emoji">${m[1]}</span>
<strong>${m[2]}</strong>
<small>Abrir departamento</small>
</button>`).join("")}</div>`;
}

const companyFields=[
["razao","Razão social","text",true],
["fantasia","Nome fantasia"],
["cnpj","CNPJ"],
["tipo","Porte","select",false,["MEI","ME","EPP","Médio porte","Grande porte"]],
["regime","Regime tributário","select",false,["Não informado","Simples Nacional","Lucro Presumido","Lucro Real"]],
["cnae","CNAE principal"],
["abertura","Data de abertura","date"],
["responsavel","Responsável legal"],
["email","E-mail","email"],
["telefone","Telefone","tel"],
["site","Site"],
["cep","CEP"],
["endereco","Logradouro"],
["numero","Número"],
["bairro","Bairro"],
["cidade","Cidade"],
["uf","Estado / UF"],
["missao","Descrição da empresa","textarea"]
];

function company(){
return hero("🏢 Gestão empresarial","Configure sua empresa para reutilizar seus dados em documentos e relatórios.")+
`<div class="card"><h3>Cadastro empresarial completo</h3>
<form id="companyForm" class="form">
${companyFields.map(([k,l,t,r,o])=>field(k,l,t||"text",db.empresa[k]||"",r,o||[])).join("")}
<div class="full"><button class="btn">Salvar empresa</button></div>
</form></div>`+crud("fornecedores");
}

function crud(kind){
const s=SCHEMAS[kind];
const item=editing?.kind===kind?db[kind].find(x=>x.id===editing.id)||{}:null;
return `<div class="card">
<h3>${s.title} (${db[kind].length})</h3>
<div class="bar">
<button class="btn" onclick="openForm('${kind}')">＋ Novo cadastro</button>
<button class="btn alt" onclick="exportCSV('${kind}')">Exportar CSV</button>
</div>
<input class="search" placeholder="Pesquisar ${s.title.toLowerCase()}" oninput="filterRows(this,'${kind}')">
<div id="form_${kind}">${item?formHTML(kind,item):""}</div>
<div class="table">
<table id="table_${kind}">
<thead><tr>${s.fields.slice(0,4).map(f=>`<th>${f[1]}</th>`).join("")}<th>Ações</th></tr></thead>
<tbody>${db[kind].map(x=>`<tr>
${s.fields.slice(0,4).map(f=>`<td>${esc(f[2]==="money"?money(x[f[0]]):x[f[0]])}</td>`).join("")}
<td>
<button class="mini" onclick="editRecord('${kind}','${x.id}')">Editar</button>
<button class="mini" onclick="removeRecord('${kind}','${x.id}')">Excluir</button>
</td></tr>`).join("")||`<tr><td colspan="5">Nenhum registro cadastrado.</td></tr>`}</tbody>
</table></div></div>`;
}

function formHTML(kind,item={}){
return `<div class="card"><h3>${item.id?"Editar":"Novo"} registro</h3>
<form class="form" id="formRecord_${kind}">
${SCHEMAS[kind].fields.map(([k,l,t,r,o])=>field(k,l,t||"text",item[k]??"",r,o||[])).join("")}
<div class="full bar">
<button class="btn">Salvar registro</button>
<button class="btn alt" type="button" onclick="closeForm('${kind}')">Cancelar</button>
</div></form></div>`;
}

function openForm(kind){
editing={kind,id:null};
$("form_"+kind).innerHTML=formHTML(kind);
bindForm(kind);
$("form_"+kind).scrollIntoView({behavior:"smooth"});
}

function editRecord(kind,id){
editing={kind,id};
$("form_"+kind).innerHTML=formHTML(kind,db[kind].find(x=>x.id===id));
bindForm(kind);
$("form_"+kind).scrollIntoView({behavior:"smooth"});
}

function closeForm(kind){
editing=null;$("form_"+kind).innerHTML="";
}

function bindForm(kind){
const f=$("formRecord_"+kind);
if(!f)return;
f.onsubmit=e=>{
e.preventDefault();
const data=Object.fromEntries(new FormData(f));
const old=editing?.id;
data.id=old||uid();
for(const [k,l,t] of SCHEMAS[kind].fields){
if(t==="money"||t==="number")data[k]=Number(data[k]||0);
}
if(change(()=>{
if(old){
db[kind]=db[kind].map(x=>x.id===old?data:x);
}else db[kind].unshift(data);
})){
editing=null;render();alert("Registro salvo com sucesso.");
}
};
}

function removeRecord(kind,id){
if(!confirm("Deseja excluir este registro?"))return;
if(change(()=>db[kind]=db[kind].filter(x=>x.id!==id)))render();
}

function filterRows(input,kind){
const term=input.value.toLowerCase();
document.querySelectorAll(`#table_${kind} tbody tr`).forEach(row=>{
row.style.display=row.textContent.toLowerCase().includes(term)?"":"none";
});
}

function exportCSV(kind){
const fields=SCHEMAS[kind].fields;
const lines=[
fields.map(f=>f[1]),
...db[kind].map(x=>fields.map(f=>String(x[f[0]]??"")))
];
const csv=lines.map(row=>row.map(v=>'"'+v.replaceAll('"','""')+'"').join(";")).join("\r\n");
download(kind+".csv","\ufeff"+csv,"text/csv;charset=utf-8");
}

function productPage(){
return hero("📦 Estoque inteligente","Produtos, serviços, quantidades e controle de estoque mínimo.")+
`<div class="stats">
${stat("Produtos",db.produtos.length)}
${stat("Estoque baixo",db.produtos.filter(p=>p.tipo!=="Serviço"&&Number(p.qtd)<=Number(p.minimo)).length)}
${stat("Unidades",db.produtos.reduce((s,p)=>s+Number(p.qtd||0),0))}
${stat("Valor de custo",money(db.produtos.reduce((s,p)=>s+Number(p.qtd||0)*Number(p.custo||0),0)))}
</div>`+crud("produtos");
}

function budgetPage(){
return `<div class="card"><h3>Orçamento profissional</h3>
<form id="budgetForm" class="form">
${field("cliente","Cliente","select","",true,db.clientes.map(x=>x.nome))}
${field("validade","Validade","date",today())}
${field("observacoes","Observações","textarea")}
<div class="full"><h3>Itens do orçamento</h3>
<div class="bar">
<select id="budgetProduct" class="search">
${db.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${money(p.preco)}</option>`).join("")}
</select>
<input id="budgetQty" type="number" min="1" value="1" style="width:90px;padding:10px">
<button type="button" class="btn alt" onclick="addBudgetItem()">Adicionar item</button>
</div>
<div id="budgetList"></div></div>
<div class="full"><button class="btn">Salvar orçamento</button></div>
</form></div>
<div class="card"><h3>Orçamentos salvos (${db.orcamentos.length})</h3>
<div class="table"><table><thead><tr><th>Cliente</th><th>Data</th><th>Total</th><th>Ações</th></tr></thead><tbody>
${db.orcamentos.map(o=>`<tr><td>${esc(o.cliente)}</td><td>${esc(o.data)}</td><td>${money(o.total)}</td><td><button class="mini" onclick="printBudget('${o.id}')">Imprimir</button><button class="mini" onclick="deleteBudget('${o.id}')">Excluir</button></td></tr>`).join("")||'<tr><td colspan="4">Nenhum orçamento salvo.</td></tr>'}
</tbody></table></div></div>`;
}

function addBudgetItem(){
const id=$("budgetProduct")?.value;
const p=db.produtos.find(x=>x.id===id);
const qty=Number($("budgetQty").value);
if(!p||!Number.isInteger(qty)||qty<1)return alert("Selecione um produto e quantidade válida.");
budgetItems.push({nome:p.nome,quantidade:qty,preco:Number(p.preco)});
renderBudgetItems();
}

function renderBudgetItems(){
const host=$("budgetList");if(!host)return;
const total=budgetItems.reduce((s,x)=>s+x.preco*x.quantidade,0);
host.innerHTML=`<div class="table"><table><thead><tr><th>Item</th><th>Quantidade</th><th>Subtotal</th><th>Ação</th></tr></thead><tbody>
${budgetItems.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${x.quantidade}</td><td>${money(x.preco*x.quantidade)}</td><td><button type="button" class="mini" onclick="budgetItems.splice(${i},1);renderBudgetItems()">Remover</button></td></tr>`).join("")}
</tbody></table></div><h3>Total: ${money(total)}</h3>`;
}

function saveBudget(e){
e.preventDefault();
if(!budgetItems.length)return alert("Adicione pelo menos um item.");
const f=Object.fromEntries(new FormData(e.target));
const data={
id:uid(),cliente:f.cliente,validade:f.validade,
observacoes:f.observacoes,data:today(),
itens:budgetItems.map(x=>({...x})),
total:budgetItems.reduce((s,x)=>s+x.preco*x.quantidade,0)
};
if(change(()=>db.orcamentos.unshift(data))){
budgetItems=[];render();alert("Orçamento salvo.");
}
}

function deleteBudget(id){
if(!confirm("Excluir orçamento?"))return;
if(change(()=>db.orcamentos=db.orcamentos.filter(x=>x.id!==id)))render();
}

function printHTML(html){
const w=window.open("","_blank");
if(!w)return alert("Permita janelas pop-up para imprimir.");
w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Documento</title><style>body{font:15px Arial;max-width:800px;margin:40px auto;padding:20px;line-height:1.7}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd}h1{color:#174b83}</style></head><body>${html}</body></html>`);
w.document.close();w.focus();setTimeout(()=>w.print(),300);
}

function printBudget(id){
const o=db.orcamentos.find(x=>x.id===id);if(!o)return;
printHTML(`<h1>ORÇAMENTO COMERCIAL</h1>
<h2>${esc(db.empresa.fantasia||db.empresa.razao||"Empresa")}</h2>
<p><b>Cliente:</b> ${esc(o.cliente)}</p>
<p><b>Data:</b> ${esc(o.data)} | <b>Validade:</b> ${esc(o.validade)}</p>
<table><tr><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th></tr>
${o.itens.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.quantidade}</td><td>${money(x.preco)}</td><td>${money(x.preco*x.quantidade)}</td></tr>`).join("")}</table>
<h2>Total: ${money(o.total)}</h2><p>${esc(o.observacoes)}</p>`);
}

function documentPage(){
return hero("📄 Central de documentos","Crie documentos sem janelas de perguntas do navegador.")+
`<div class="card"><h3>Editor de documentos</h3>
<form id="docForm" class="form">
${field("tipo","Tipo","select","Recibo",true,["Recibo","Declaração","Contrato simplificado","Carta comercial"])}
${field("destinatario","Destinatário","text","",true)}
${field("assunto","Assunto / serviço","text","",true)}
${field("valor","Valor (R$)","money")}
${field("data","Data","date",today())}
${field("texto","Texto e observações","textarea")}
<div class="full bar">
<button type="button" class="btn alt" onclick="previewDoc()">Pré-visualizar</button>
<button class="btn">Salvar documento</button>
<button type="button" class="btn alt" onclick="printDoc()">Imprimir / PDF</button>
</div></form>
<h3>Pré-visualização</h3><div id="preview" class="doc">Preencha o formulário para visualizar.</div>
</div>
<div class="card"><h3>Documentos salvos (${db.documentos.length})</h3>
${db.documentos.map(d=>`<p>${esc(d.tipo)} — ${esc(d.destinatario)} <button class="mini" onclick="printSavedDoc('${d.id}')">Imprimir</button> <button class="mini" onclick="removeDoc('${d.id}')">Excluir</button></p>`).join("")||'<p>Nenhum documento salvo.</p>'}</div>`;
}

function docData(){
const f=$("docForm");
return Object.fromEntries(new FormData(f));
}

function docHTML(d){
const company=esc(db.empresa.fantasia||db.empresa.razao||"Empresa não cadastrada");
let text;
if(d.tipo==="Recibo"){
text=`Recebemos de <b>${esc(d.destinatario)}</b> a importância de <b>${money(d.valor)}</b>, referente a ${esc(d.assunto)}.`;
}else if(d.tipo==="Contrato simplificado"){
text=`<b>Contratada:</b> ${company}<br><b>Contratante:</b> ${esc(d.destinatario)}<br><b>Objeto:</b> ${esc(d.assunto)}<br><b>Valor:</b> ${money(d.valor)}<p>${esc(d.texto)}</p><p><i>Minuta simplificada sujeita a revisão jurídica.</i></p>`;
}else{
text=`<b>Destinatário:</b> ${esc(d.destinatario)}<br><b>Assunto:</b> ${esc(d.assunto)}<p>${esc(d.texto)}</p>`;
}
return `<h2>${esc(d.tipo.toUpperCase())}</h2><h3>${company}</h3><p>${text}</p><p>Data: ${esc(d.data)}</p><br><p>____________________________________<br>Assinatura</p>`;
}

function previewDoc(){
const f=$("docForm");if(!f.reportValidity())return;
$("preview").innerHTML=docHTML(docData());
}

function printDoc(){
const f=$("docForm");if(!f.reportValidity())return;
printHTML(docHTML(docData()));
}

function saveDoc(e){
e.preventDefault();
const d={...docData(),id:uid()};
if(change(()=>db.documentos.unshift(d))){render();alert("Documento salvo.");}
}

function printSavedDoc(id){
const d=db.documentos.find(x=>x.id===id);
if(d)printHTML(docHTML(d));
}

function removeDoc(id){
if(!confirm("Excluir documento?"))return;
if(change(()=>db.documentos=db.documentos.filter(x=>x.id!==id)))render();
}

function reports(){
const income=totals("Receita"),expense=totals("Despesa");
const pending=db.financeiro.filter(x=>x.status==="Pendente");
return hero("📊 Relatórios empresariais","Indicadores calculados com os registros cadastrados.")+
`<div class="stats">
${stat("Saldo",money(income-expense))}
${stat("A receber",money(pending.filter(x=>x.tipo==="Receita").reduce((s,x)=>s+Number(x.valor),0)))}
${stat("A pagar",money(pending.filter(x=>x.tipo==="Despesa").reduce((s,x)=>s+Number(x.valor),0)))}
${stat("Orçamentos",db.orcamentos.length)}
${stat("Clientes",db.clientes.length)}
${stat("Funcionários",db.funcionarios.length)}
${stat("Produtos",db.produtos.length)}
${stat("Tarefas",db.tarefas.length)}
</div>
<div class="card"><h3>Backup e exportação</h3>
<p class="note">Seus dados estão neste navegador. Faça backups para não perdê-los.</p>
<div class="bar">
<button class="btn" onclick="backup()">Baixar backup</button>
<button class="btn alt" onclick="$('restoreFile').click()">Restaurar backup</button>
<input id="restoreFile" type="file" accept=".json" hidden onchange="restore(this)">
<button class="btn alt" onclick="window.print()">Imprimir relatório</button>
</div></div>`;
}

function backup(){
download("backup-meu-negocio.json",JSON.stringify({version:1,data:db},null,2),"application/json");
}

async function restore(input){
const f=input.files[0];if(!f)return;
if(f.size>5000000)return alert("Arquivo muito grande.");
try{
const parsed=JSON.parse(await f.text());
if(parsed.version!==1||!parsed.data||!Array.isArray(parsed.data.clientes)||!Array.isArray(parsed.data.financeiro))throw Error();
if(!confirm("Substituir TODOS os dados locais?"))return;
const base=blank();
for(const k of Object.keys(base)){
if(k==="empresa"&&parsed.data.empresa&&typeof parsed.data.empresa==="object")base.empresa=parsed.data.empresa;
else if(Array.isArray(base[k])&&Array.isArray(parsed.data[k]))base[k]=parsed.data[k];
}
if(change(()=>db=base)){render();alert("Backup restaurado.");}
}catch(e){alert("Backup inválido.");}
input.value="";
}

function render(){
const c=$("content");
if(current==="home")c.innerHTML=dashboard();
if(current==="gestao")c.innerHTML=company();
if(current==="financeiro"){
c.innerHTML=hero("💳 Financeiro","Controle receitas, despesas e vencimentos.")+
`<div class="stats">${stat("Recebido",money(totals("Receita")))}${stat("Pago",money(totals("Despesa")))}${stat("Saldo",money(totals("Receita")-totals("Despesa")))}${stat("Pendentes",db.financeiro.filter(x=>x.status==="Pendente").length)}</div>`+crud("financeiro");
}
if(current==="vendas")c.innerHTML=hero("🛒 Vendas","Clientes e orçamentos com vários itens.")+crud("clientes")+budgetPage();
if(current==="documentos")c.innerHTML=documentPage();
if(current==="rh")c.innerHTML=hero("👥 Recursos humanos","Funcionários, salários, cargos e jornadas.")+crud("funcionarios");
if(current==="estoque")c.innerHTML=productPage();
if(current==="fiscal")c.innerHTML=hero("🧾 Fiscal","Organização interna de documentos fiscais. Não emite notas oficiais.")+crud("fiscais");
if(current==="operacoes")c.innerHTML=hero("📋 Operações","Tarefas, responsáveis e prazos.")+crud("tarefas");
if(current==="relatorios")c.innerHTML=reports();
if(current==="ia")c.innerHTML=hero("✨ BUSINESS IA","Integração externa ainda não configurada.")+`<div class="card"><h3>Resumo gerencial</h3><p class="note">Este resumo usa cálculos locais, sem inteligência artificial externa.</p><button class="btn" onclick="alert('Clientes: '+db.clientes.length+' | Produtos: '+db.produtos.length+' | Saldo: '+money(totals('Receita')-totals('Despesa')))">Gerar resumo local</button></div>`;

if(current==="gestao"){
$("companyForm").onsubmit=e=>{
e.preventDefault();
const data=Object.fromEntries(new FormData(e.target));
if(change(()=>db.empresa=data))alert("Empresa salva.");
};
}
if(current==="vendas"){
$("budgetForm").onsubmit=saveBudget;
renderBudgetItems();
}
if(current==="documentos")$("docForm").onsubmit=saveDoc;
}

go("home");
</script>
