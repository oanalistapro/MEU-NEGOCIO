
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090e17">
<title>MEU NEGÓCIO PRO — Enterprise</title>
<style>
:root{
 --bg:#090e17;--side:#0d131e;--panel:#121b28;
 --panel2:#172231;--border:#263347;--text:#eef3fb;
 --muted:#8998ad;--orange:#ff842d;--blue:#398eff;
 --green:#24cb94;--purple:#a778f7;--red:#f26b75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{background:#0c1420;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;width:100%}
input::placeholder{color:#66768c}
h1,h2,h3,p{margin-top:0}
h1{font-size:23px;letter-spacing:-.7px;margin-bottom:4px}
h2{font-size:15px}
h3{font-size:13px}
small,.muted{color:var(--muted)}
.hidden{display:none!important}
.btn{border:1px solid var(--border);background:#172232;color:var(--text);padding:9px 13px;border-radius:8px;font-weight:650}
.btn:hover{border-color:#62748e}
.btn.primary{background:var(--orange);color:#16100c;border-color:var(--orange)}
.btn.blue{background:#2165c6;border-color:#2165c6;color:white}
.btn.sm{font-size:11px;padding:6px 9px}
.btn.danger{color:#ff929b;border-color:#713c4b}
.app{display:flex;min-height:100vh}
.sidebar{width:225px;background:var(--side);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:7px 10px 25px}
.brand-icon{width:32px;height:32px;background:linear-gradient(135deg,#ffad48,#e95b15);border-radius:9px;display:grid;place-items:center;color:#1c1007;font-size:19px;font-weight:950}
.brand b{font-size:14px;letter-spacing:-.3px}
.brand b span{color:var(--orange)}
.brand small{display:block;font-size:9px;letter-spacing:1.7px}
.nav-label{font-size:10px;letter-spacing:1.4px;color:#63758e;padding:18px 12px 7px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:#a5b1c2;text-align:left;padding:10px;border-radius:8px;margin:2px 0}
.nav-btn:hover{background:#192333;color:white}
.nav-btn.active{color:#ffa354;background:#30251e;border-color:#62402a}
.nav-icon{width:20px;text-align:center;font-size:16px}
.side-bottom{border-top:1px solid var(--border);margin-top:22px;padding:17px 10px;color:var(--muted);font-size:11px}
.main{min-width:0;flex:1;padding:16px 22px 35px;max-width:1900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top-left{display:flex;align-items:center;gap:12px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{width:270px}
.company-select{width:175px}
.avatar{height:33px;width:33px;border-radius:50%;background:#303e53;display:grid;place-items:center;font-weight:800}
.icon-btn{width:35px;height:35px;border-radius:8px;border:1px solid var(--border);background:#131d2a;color:#bac9d9}
.heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.heading p{margin:0;color:var(--muted)}
.heading-actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:13px}
.panel,.stat{background:linear-gradient(145deg,#151f2c,#101925);border:1px solid var(--border);border-radius:10px}
.stat{padding:15px;min-height:119px}
.stat-head{display:flex;justify-content:space-between;align-items:center;color:#b5c1d1;font-size:11px}
.stat-icon{width:29px;height:29px;display:grid;place-items:center;background:#263040;border-radius:9px;font-size:15px}
.stat-value{font-size:24px;font-weight:850;letter-spacing:-.8px;margin:8px 0 2px}
.stat-foot{font-size:10px;color:var(--green)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(260px,1fr);gap:12px;margin-bottom:12px}
.panel{padding:16px;min-width:0}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.panel-title h2{margin:0}
.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:10px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--orange)}
.dot.blue{background:var(--blue)}
.dot.green{background:var(--green)}
.dot.purple{background:var(--purple)}
.chart-svg{width:100%;height:255px;display:block}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:12px}
.bar-item{display:grid;grid-template-columns:100px 1fr 35px;align-items:center;gap:9px;margin:15px 0;font-size:11px}
.bar-track{height:10px;background:#222e3c;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--orange);border-radius:3px}
.donut-layout{display:flex;align-items:center;justify-content:center;gap:20px;min-height:190px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
.donut:after{content:"";position:absolute;inset:35px;background:#131d2a;border-radius:50%}
.legend-list{display:grid;gap:11px;font-size:11px}
.insight{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}
.insight-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#30251e;color:var(--orange);flex-shrink:0}
.insight b{display:block;font-size:12px}
.insight p{margin:4px 0;color:var(--muted);font-size:11px}
.progress{height:6px;background:#263344;border-radius:10px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--orange)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;color:#8090a7;font-size:10px;text-transform:uppercase;letter-spacing:.7px}
th,td{padding:12px 9px;border-bottom:1px solid var(--border)}
td{color:#d4dfea}
tr:hover td{background:#ffffff05}
.badge{display:inline-block;border-radius:20px;padding:3px 8px;font-size:10px;background:#283344;color:#c5d0df}
.badge.ok{background:#173b31;color:#65e1ac}
.badge.warn{background:#40311e;color:#ffca78}
.badge.red{background:#40232b;color:#ff9da5}
.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{max-width:340px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.notice{padding:12px;background:#1a2837;border:1px solid #32465b;border-radius:9px;color:#afc1d6;margin:12px 0}
.module-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.module{background:#151f2c;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:left;color:var(--text);min-height:124px}
.module:hover{border-color:var(--orange)}
.module .symbol{font-size:22px;color:var(--orange)}
.module b{display:block;margin:13px 0 4px}
.module small{font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid label{display:block;color:#adbdce;font-size:11px;margin-bottom:5px}
.form-grid .full{grid-column:1/-1}
.modal-back{position:fixed;inset:0;z-index:100;background:#000b;display:grid;place-items:center;padding:15px}
.modal{background:#151f2c;border:1px solid #40516a;border-radius:13px;padding:22px;width:min(730px,100%);max-height:90vh;overflow:auto}
.modal-actions{display:flex;gap:9px;margin-top:19px}
.toast{position:fixed;bottom:20px;right:20px;background:#253549;border:1px solid #546781;color:white;border-radius:9px;padding:13px 17px;z-index:200;max-width:90vw}
.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 65% 25%,#2a251d,#090e17 55%);padding:20px}
.auth-card{width:min(420px,100%);padding:30px;background:#151f2c;border:1px solid var(--border);border-radius:14px}
.auth-card h1{font-size:27px}
.auth-card .btn{width:100%;margin-top:16px}
.mobile-menu{display:none}
@media(max-width:1200px){
 .stats{grid-template-columns:repeat(3,1fr)}
 .bottom-grid{grid-template-columns:1fr 1fr}
 .module-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
 .sidebar{width:65px}
 .brand div:last-child,.nav-label,.nav-btn .nav-text,.side-bottom{display:none}
 .brand{padding:7px 5px 20px}
 .nav-btn{justify-content:center}
 .dashboard-grid{grid-template-columns:1fr}
 .module-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
 .app{display:block}
 .sidebar{width:100%;height:57px;position:fixed;top:auto;bottom:0;z-index:40;padding:5px;display:flex;overflow:auto;border-right:0;border-top:1px solid var(--border)}
 .brand,.side-bottom,.nav-label{display:none}
 #nav{display:flex;gap:4px}
 .nav-btn{min-width:45px;flex-shrink:0}
 .main{padding:12px 11px 85px}
 .search{width:100%;order:3}
 .top-right{width:100%}
 .company-select{flex:1}
 .stats{grid-template-columns:repeat(2,1fr)}
 .bottom-grid{grid-template-columns:1fr}
 .module-grid{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr}
 .chart-svg{height:210px}
 .stat{padding:12px}
 .stat-value{font-size:21px}
 .panel{padding:13px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth">
 <div class="auth-card">
  <div style="color:var(--orange);font-weight:800;letter-spacing:2px">BUSINESS ENTERPRISE</div>
  <h1>MEU NEGÓCIO <span style="color:var(--orange)">PRO</span></h1>
  <p class="muted">Gestão empresarial e recursos humanos em um só ambiente.</p>
  <div class="notice">Projeto Firebase de teste. Entre com sua conta Google.</div>
  <button class="btn primary" id="loginBtn">Entrar com Google</button>
  <p id="authError" class="muted" style="margin-top:15px"></p>
 </div>
</div>

<div id="appScreen" class="app hidden">
 <aside class="sidebar">
  <div class="brand">
   <div class="brand-icon">M</div>
   <div><b>MEU <span>NEGÓCIO</span></b><small>PRO ENTERPRISE</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-bottom">● Enterprise Test<br>Dados vinculados ao Firebase.</div>
 </aside>
 <main class="main">
  <div class="top">
   <div class="top-left"><span style="color:var(--orange);font-weight:800">◈</span><b id="topLabel">Executive Overview</b></div>
   <div class="top-right">
    <input class="search" id="globalSearch" placeholder="Pesquisar módulos...">
    <select class="company-select" id="companySelect"></select>
    <button class="icon-btn" id="notifyBtn" title="Notificações">♧</button>
    <button class="btn sm" id="addCompanyBtn">＋ Empresa</button>
    <div class="avatar" id="avatar">U</div>
    <button class="btn sm" id="logoutBtn">Sair</button>
   </div>
  </div>
  <div class="heading">
   <div><h1 id="pageTitle">Painel executivo</h1><p id="subtitle">Visão geral da organização</p></div>
   <div class="heading-actions" id="pageActions"></div>
  </div>
  <div id="view"></div>
 </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
 getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,
 getRedirectResult,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
 getFirestore,collection,doc,getDoc,getDocs,addDoc,
 updateDoc,query,where,writeBatch,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* CONFIGURAÇÃO FIREBASE DO PROJETO DE TESTE */
const firebaseConfig={
 apiKey:"AIzaSyB-IiVlnzc_RESH_10MDmZsfnJ3iGm9zqw",
 authDomain:"meu-negocio-enterprise-teste.firebaseapp.com",
 projectId:"meu-negocio-enterprise-teste",
 storageBucket:"meu-negocio-enterprise-teste.firebasestorage.app",
 messagingSenderId:"1083026433106",
 appId:"1:1083026433106:web:9041a8eb3959a9a101eb8b",
 measurementId:"G-BW9N9QCFJ7"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const S={
 user:null,companies:[],cid:"",role:"",page:"dashboard",
 employees:[],departments:[],leaves:[],members:[],
 vacancies:[],candidates:[],attendance:[],payroll:[]
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money=x=>Number(x||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const col=n=>collection(db,"companies",S.cid,n);
const ref=(n,id)=>doc(db,"companies",S.cid,n,id);
const admin=()=>["owner","admin","hr"].includes(S.role);
const manager=()=>admin()||S.role==="manager";
const hrRead=()=>manager()||S.role==="auditor";
const owner=()=>S.role==="owner";
const auditRead=()=>admin()||S.role==="auditor";
const fmtDate=x=>x?String(x).split("-").reverse().join("/"):"—";
const today=()=>new Date().toISOString().slice(0,10);
const num=x=>Number(x)||0;
const empName=id=>S.employees.find(e=>e.id===id)?.name||"—";
const depName=id=>S.departments.find(d=>d.id===id)?.name||"Não definido";

function toast(message){
 $("toastRoot").innerHTML=`<div class="toast">${esc(message)}</div>`;
 setTimeout(()=>{$("toastRoot").innerHTML=""},4000);
}
function fail(e){
 console.error(e);
 if(e?.code==="permission-denied")return "Sem permissão no Firestore.";
 if(e?.code==="auth/unauthorized-domain")return "Autorize o domínio no Firebase Authentication.";
 return e?.message||"Erro inesperado.";
}
function field(label,name,value="",type="text",required=false){
 return `<div><label>${esc(label)}</label><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?"required":""}></div>`;
}
function selectField(label,name,options,current=""){
 return `<div><label>${esc(label)}</label><select name="${esc(name)}">
 ${options.map(o=>{
  const v=typeof o==="string"?o:o.value;
  const t=typeof o==="string"?o:o.label;
  return `<option value="${esc(v)}" ${v===current?"selected":""}>${esc(t)}</option>`;
 }).join("")}</select></div>`;
}
function noteField(label,name,value=""){
 return `<div class="full"><label>${esc(label)}</label><textarea name="${esc(name)}" rows="3">${esc(value)}</textarea></div>`;
}
function modal(title,fields,save){
 $("modalRoot").innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
 <div class="panel-title"><h2>${esc(title)}</h2><button class="btn sm" id="closeModal">✕</button></div>
 <form id="modalForm"><div class="form-grid">${fields}</div>
 <div class="modal-actions"><button class="btn primary" type="submit">Salvar</button>
 <button class="btn" type="button" id="cancelModal">Cancelar</button></div></form></div></div>`;
 const close=()=>{$("modalRoot").innerHTML=""};
 $("closeModal").onclick=close;
 $("cancelModal").onclick=close;
 $("modalForm").onsubmit=async ev=>{
  ev.preventDefault();
  const btn=ev.target.querySelector('[type="submit"]');
  btn.disabled=true;
  try{
   await save(Object.fromEntries(new FormData(ev.target)));
   close();
   toast("Informações salvas.");
  }catch(e){toast(fail(e))}
  finally{btn.disabled=false}
 };
}
function badge(s){
 const good=["Ativo","Aprovado","Presente","Concluído","Contratado","Aberta"].includes(s);
 const bad=["Rejeitado","Desligado","Cancelada"].includes(s);
 return `<span class="badge ${good?"ok":bad?"red":"warn"}">${esc(s||"—")}</span>`;
}
function panel(title,content,actions=""){
 return `<section class="panel"><div class="panel-title"><h2>${esc(title)}</h2><div>${actions}</div></div>${content}</section>`;
}
function table(headers,rows){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
 <tbody>${rows.join("")}</tbody></table></div>${rows.length?"":'<div class="empty">Nenhum registro encontrado.</div>'}`;
}
function stat(title,value,icon,color="var(--orange)",footer="DADOS ATUAIS"){
 return `<div class="stat"><div class="stat-head"><span>${esc(title)}</span>
 <span class="stat-icon" style="color:${color}">${icon}</span></div>
 <div class="stat-value">${esc(value)}</div><div class="stat-foot">● ${esc(footer)}</div></div>`;
}
function stats(items){return `<div class="stats">${items.join("")}</div>`}
function barChart(items,color="var(--orange)"){
 const max=Math.max(1,...items.map(x=>num(x.value)));
 return items.length?items.map(x=>`
 <div class="bar-item"><span>${esc(x.label)}</span>
 <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,num(x.value))/max*100}%;background:${color}"></div></div>
 <b>${num(x.value)}</b></div>`).join(""):'<div class="empty">Sem dados para o gráfico.</div>';
}
function donut(items){
 const colors=["#398eff","#ff842d","#a778f7","#24cb94","#f0b53e","#f26b75"];
 const total=items.reduce((s,x)=>s+num(x.value),0);
 if(!total)return '<div class="empty">Sem dados para o gráfico.</div>';
 let offset=0;
 const stops=items.map((x,i)=>{
  const start=offset;
  offset+=num(x.value)/total*100;
  return `${colors[i%colors.length]} ${start}% ${offset}%`;
 });
 return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${stops.join(",")})"></div>
 <div class="legend-list">${items.map((x,i)=>`
 <div><span class="dot" style="background:${colors[i%colors.length]}"></span>
 ${esc(x.label)} <b>${Math.round(num(x.value)/total*100)}%</b></div>`).join("")}</div></div>`;
}
function lineChart(points,color="#ff842d"){
 const width=780,height=270,left=48,right=16,top=18,bottom=36;
 const max=Math.max(1,...points);
 const plotW=width-left-right,plotH=height-top-bottom;
 const coords=points.map((v,i)=>[
  left+(points.length===1?.5:i/(points.length-1))*plotW,
  top+plotH-(v/max)*plotH
 ]);
 const path=coords.map((p,i)=>(i?"L":"M")+p.join(",")).join(" ");
 const area=path+` L ${coords.at(-1)[0]},${top+plotH} L ${coords[0][0]},${top+plotH} Z`;
 const grid=[0,.25,.5,.75,1].map(t=>{
  const y=top+plotH*(1-t);
  return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#2b3848" stroke-dasharray="3 5"/>
  <text x="5" y="${y+4}" fill="#8190a5" font-size="11">${Math.round(max*t)}</text>`;
 }).join("");
 const labels=points.map((_,i)=>i%Math.max(1,Math.ceil(points.length/8))===0?
  `<text x="${coords[i][0]}" y="${height-9}" text-anchor="middle" fill="#8190a5" font-size="10">${i+1}</text>`:"").join("");
 return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Gráfico de evolução">
 <defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="${color}" stop-opacity=".25"/>
 <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
 ${grid}<path d="${area}" fill="url(#areaGradient)"/>
 <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 ${coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join("")}
 ${labels}</svg>`;
}
function monthSeries(rows,dateKey,months=12){
 const now=new Date();
 const result=[];
 for(let i=months-1;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const prefix=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  result.push(rows.filter(x=>String(x[dateKey]||"").startsWith(prefix)).length);
 }
 return result;
}
function exportCSV(filename,headers,rows){
 const csv=[headers,...rows].map(row=>row.map(v=>{
  let text=String(v??"");
  if(/^\s*[=+\-@]/.test(text))text="'"+text;
  return `"${text.replace(/"/g,'""')}"`;
 }).join(";")).join("\r\n");
 const url=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
 const a=document.createElement("a");a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function audit(action,target){
 try{
  await addDoc(col("audit"),{
   action,target,actorUid:S.user.uid,actorName:S.user.displayName||"",
   createdAt:serverTimestamp()
  });
 }catch(e){console.warn("Auditoria:",e)}
}

/* AUTENTICAÇÃO */
$("loginBtn").onclick=async()=>{
 $("authError").textContent="";
 try{await signInWithPopup(auth,provider)}
 catch(e){
  if(e.code==="auth/popup-blocked"){
   try{await signInWithRedirect(auth,provider);return}
   catch(x){$("authError").textContent=fail(x);return}
  }
  $("authError").textContent=fail(e);
 }
};

async function loadCompanies(){

async function selectCompany(cid){
 if(!S.companies.some(c=>c.id===cid))throw Error("Empresa não autorizada.");
 const membership=await getDoc(doc(db,"companies",cid,"members",S.user.uid));
 if(!membership.exists())throw Error("Sua conta não possui acesso a esta empresa.");
 S.cid=cid;S.role=membership.data().role;
 S.page="dashboard";
 sessionStorage.setItem("mn_company",cid);
 await loadData();render();
}
async function loadData(){
 const collections=[
  "employees","departments","leaves","members",
  "vacancies","candidates","attendance","payroll"
 ];
 const permission={
  employees:hrRead(),departments:true,leaves:hrRead(),
  members:true,vacancies:hrRead(),candidates:hrRead(),
  attendance:hrRead(),payroll:admin()
 };
 const results=await Promise.all(collections.map(async name=>{
  if(!permission[name])return [];
  try{
   const snap=await getDocs(col(name));
   return snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
   if(e.code==="permission-denied"){
    console.warn("Coleção não autorizada:",name);
    return [];
   }
   throw e;
  }
 }));
 collections.forEach((name,i)=>S[name]=results[i]);
}
async function refresh(){await loadData();render()}

 modal("Solicitação de ausência",`
 ${selectField("Colaborador","employeeId",S.employees.map(e=>({value:e.id,label:e.name})))}

 ${noteField("Observações","notes")}
 `,async v=>{
  if(!admin())throw Error("Sem permissão.");
  if(v.end<v.start)throw Error("Período inválido.");
  if(S.leaves.some(l=>l.employeeId===v.employeeId&&l.status==="Aprovado"&&v.start<=l.end&&v.end>=l.start))
   throw Error("Há uma ausência aprovada no mesmo período.");
  await addDoc(col("leaves"),{...v,status:"Pendente",createdAt:serverTimestamp()});
  await audit("Solicitar ausência",empName(v.employeeId));await refresh();
 });

async function decideLeave(id,status){
 if(!manager())return;
 const l=S.leaves.find(x=>x.id===id);
 if(!l||l.status!=="Pendente")return;
 if(status==="Aprovado"&&S.leaves.some(x=>
  x.id!==id&&x.employeeId===l.employeeId&&x.status==="Aprovado"&&
  l.start<=x.end&&l.end>=x.start))return toast("Conflito de período.");
 if(!confirm(`Confirmar: ${status}?`))return;
 try{
  await updateDoc(ref("leaves",id),{
   status,decidedBy:S.user.uid,decidedAt:serverTimestamp()
  });
  await audit("Decisão de ausência: "+status,empName(l.employeeId));
  await refresh();
 }catch(e){toast(fail(e))}
}

/* FOLHA ADMINISTRATIVA */
function payrollPage(){
 const totals=S.payroll.reduce((a,p)=>{
  a.base+=num(p.base);a.extra+=num(p.extra);a.deductions+=num(p.deductions);
  return a;
 },{base:0,extra:0,deductions:0});
 $("view").innerHTML=`
 ${stats([
  stat("Salário-base registrado",money(totals.base),"▣"),
  stat("Adicionais",money(totals.extra),"＋","var(--green)"),
  stat("Descontos manuais",money(totals.deductions),"−","var(--red)"),
  stat("Total líquido estimado",money(totals.base+totals.extra-totals.deductions),"◇","var(--blue)"),
  stat("Lançamentos",S.payroll.length,"▦")
 ])}
 ${panel("Lançamentos administrativos",
 table(["Colaborador","Competência","Base","Adicionais","Descontos","Total","Ação"],
 S.payroll.map(p=>`<tr><td>${esc(empName(p.employeeId))}</td>
 <td>${esc(p.period)}</td><td>${money(p.base)}</td>
 <td>${money(p.extra)}</td><td>${money(p.deductions)}</td>
 <td>${money(num(p.base)+num(p.extra)-num(p.deductions))}</td>
 <td>${admin()?`<button class="btn sm" data-pay="${p.id}">Editar</button>`:"—"}</td></tr>`)),
 admin()?'<button class="btn primary sm" id="newPay">＋ Lançamento</button>':"")}
 <div class="notice">Simulação administrativa manual. Não calcula INSS, IRRF, FGTS, férias, 13º ou rescisão legalmente. Não transmite dados ao eSocial.</div>`;
 if(admin()){
  $("newPay").onclick=()=>payrollModal();
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>payrollModal(b.dataset.pay));
 }
}
function payrollModal(id=null){
 const p=S.payroll.find(x=>x.id===id)||{};
 if(!S.employees.length)return toast("Cadastre colaboradores primeiro.");
 modal("Lançamento de folha administrativa",`
 ${selectField("Colaborador","employeeId",S.employees.map(e=>({value:e.id,label:e.name})),p.employeeId)}
 ${field("Competência (AAAA-MM)","period",p.period||today().slice(0,7),"month",true)}
 ${field("Salário-base","base",p.base||"0","number",true)}
 ${field("Adicionais","extra",p.extra||"0","number")}
 ${field("Descontos manuais","deductions",p.deductions||"0","number")}
 ${noteField("Observações","notes",p.notes)}
 `,async v=>{
  if(!admin())throw Error("Sem permissão.");
  if(["base","extra","deductions"].some(k=>!Number.isFinite(Number(v[k]))||Number(v[k])<0))
   throw Error("Valores inválidos.");
  if(id)await updateDoc(ref("payroll",id),{...v,updatedAt:serverTimestamp()});
  else await addDoc(col("payroll"),{...v,createdAt:serverTimestamp()});
  await audit("Lançamento administrativo de folha",empName(v.employeeId));
  await refresh();
 });
}

function companyModal(){
 modal("Cadastrar empresa",`
 ${field("Razão social ou nome","name","","text",true)}
 ${field("Nome fantasia","tradeName")}
 ${field("CNPJ","cnpj")}
 ${field("Cidade","city")}
 ${field("Estado","state")}
 `,async v=>{
  if(!v.name.trim())throw Error("Informe o nome.");
  const d=doc(collection(db,"companies"));
  const batch=writeBatch(db);
  batch.set(d,{
   name:v.name.trim(),tradeName:v.tradeName.trim(),cnpj:v.cnpj.trim(),
   city:v.city.trim(),state:v.state.trim(),
   ownerUid:S.user.uid,memberUids:[S.user.uid],createdAt:serverTimestamp()

  });

 <td><small>${esc(m.uid||m.id)}</small></td></tr>`)),
 owner()?'<button class="btn primary sm" id="newMember">＋ Autorizar usuário</button>':"")+
 '<div class="notice">O cadastro de membros usa UID. Convites por e-mail e administração segura de perfis exigem backend e regras específicas.</div>';

function memberModal(){
 modal("Autorizar membro",`
 ${field("UID do Firebase Authentication","uid","","text",true)}
 ${field("E-mail","email","","email",true)}
 ${field("Nome","name")}
 ${selectField("Perfil","role",["admin","hr","manager","employee","auditor"])}
 `,async v=>{
  if(!owner())throw Error("Apenas o proprietário.");
  const uid=v.uid.trim();
  if(!uid||uid.includes("/"))throw Error("UID inválido.");
  if(S.members.some(m=>m.uid===uid))throw Error("Membro já existe.");
  const batch=writeBatch(db);
  batch.set(ref("members",uid),{
   uid,email:v.email.trim(),name:v.name.trim(),role:v.role,createdAt:serverTimestamp()
  });
  const c=S.companies.find(x=>x.id===S.cid);
  batch.update(doc(db,"companies",S.cid),{
   memberUids:[...new Set([...(c.memberUids||[]),uid])]
  });
  await batch.commit();await audit("Autorizar membro",v.email);
  await loadCompanies();
 });
}

/* AUDITORIA */
async function auditPage(){
 $("view").innerHTML=panel("Histórico de atividades","Carregando...");
 try{
  const snap=await getDocs(col("audit"));
  const rows=snap.docs.map(d=>d.data()).sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,100);
  if(S.page!=="audit")return;
  $("view").innerHTML=panel("Últimas atividades",
   table(["Data","Responsável","Ação","Registro"],rows.map(a=>`
   <tr><td>${a.createdAt?.toDate?.().toLocaleString("pt-BR")||"—"}</td>
   <td>${esc(a.actorName||a.actorUid)}</td><td>${esc(a.action)}</td>
   <td>${esc(a.target)}</td></tr>`)))+
   '<div class="notice">Auditoria básica registrada no navegador. Para auditoria inviolável, é necessário registrar eventos no servidor.</div>';
 }catch(e){toast(fail(e))}
}
