function printRecord(k,itemId){const o=datasets(k).find(x=>x.id===itemId);if(!o)return;const html=`<h1>${h(title(k))}</h1>${schemas[k].filter(f=>!f.section).map(f=>`<p><b>${h(f.label)}:</b> ${h(o[f.key])}</p>`).join('')}`;printDoc(html)}
function printDoc(html){modal(`<div class="bar"><button class="btn" onclick="window.print()">Imprimir / Salvar como PDF</button></div><article class="doc">${html}</article>`)}
function doc(itemId){const o=db.documentos.find(x=>x.id===itemId);if(!o)return;const company=db.empresa;printDoc(`<div class="doc-header"><h2>${h(company.fantasia||company.razao||'MEU NEGÓCIO')}</h2><div>${h(company.cnpj||'')} ${h(company.telefone||'')}</div><div>${h(company.endereco||'')} ${h(company.cidade||'')}</div></div><h1>${h(o.titulo||o.tipo||'Documento')}</h1><p><b>Número:</b> ${h(o.numero||'—')} &nbsp; <b>Emissão:</b> ${h(o.emissao||today())}</p><p><b>Destinatário:</b> ${h(o.destinatario||'—')}</p><p><b>Assunto:</b> ${h(o.assunto||'—')}</p><p>${h(o.conteudo||'')}</p>${o.valor?`<p><b>Valor:</b> ${money(o.valor)}</p>`:''}<p><b>Responsável:</b> ${h(o.responsavel||'—')}</p><div class="doc-footer">Documento gerado pelo MEU NEGÓCIO PRO — uso interno. Verifique o conteúdo antes de utilizar.</div>`)}
function report(){const a=total('Receita','Pago'),b=total('Despesa','Pago');return `<div class="stats">${stat('Receitas realizadas',money(a))}${stat('Despesas realizadas',money(b))}${stat('Saldo realizado',money(a-b))}${stat('A receber',money(total('Receita','Pendente')))}${stat('A pagar',money(total('Despesa','Pendente')))}${stat('Clientes',db.clientes.length)}${stat('Produtos',db.produtos.length)}${stat('Funcionários',db.funcionarios.length)}</div>`}
function backup(){download('meu-negocio-backup-v2.json',JSON.stringify({version:2,db,extra},null,2),'application/json')}
async function restore(input){const f=input.files[0];if(!f)return;try{if(f.size>8000000)throw Error('Arquivo muito grande');const o=JSON.parse(await f.text());if(!o.db||!Array.isArray(o.db.clientes)||!Array.isArray(o.db.financeiro))throw Error('Formato inválido');if(!confirm('Restaurar backup e substituir registros locais?'))return;Object.keys(db).forEach(k=>{if(k==='empresa'&&o.db[k]&&typeof o.db[k]==='object')db[k]=o.db[k];else if(Array.isArray(db[k])&&Array.isArray(o.db[k]))db[k]=o.db[k]});if(o.extra)Object.keys(extra).forEach(k=>{if(Array.isArray(o.extra[k]))extra[k]=o.extra[k]});save();render();alert('Backup restaurado')}catch(e){alert('Erro no backup: '+e.message)}input.value=''}
function render(){let out='';switch(page){case'inicio':out=hero('Seu negócio em um só lugar','Gestão empresarial, vendas, documentos, pessoas, operações e relatórios.')+report()+`<div class="tiles">${DEPTS.slice(1).map(x=>`<button class="tile" onclick="go('${x[0]}')"><div style="font-size:25px">${x[1]}</div><strong>${x[2]}</strong></button>`).join('')}</div>`;break;case'gestao':out=hero('🏢 Gestão empresarial','Empresa, filiais, fornecedores, departamentos e patrimônio.')+`<div class="panel"><h2>Empresa</h2><p>${h(db.empresa.razao||'Empresa não cadastrada')}</p><button class="btn" onclick="form('empresa')">Cadastrar / editar empresa</button></div>`+list('filiais')+list('fornecedores')+list('departments')+list('assets');break;case'financeiro':out=hero('💳 Financeiro','Receitas, despesas, contas e controle de caixa.')+report()+list('financeiro')+list('bank');break;case'vendas':out=hero('🛒 Vendas e CRM','Clientes, relacionamento, orçamentos e atendimento.')+list('clientes')+budgetUI()+list('atendimentos');break;case'documentos':out=hero('📄 Central de documentos e PDF','Crie, consulte, imprima e salve documentos como PDF.')+`<div class="panel"><h2>Modelos rápidos</h2><div class="bar">${['Contrato','Recibo','Declaração','Proposta','Ata','Carta','Requerimento','Ordem de serviço'].map(x=>`<button class="btn secondary" onclick="template('${x}')">${x}</button>`).join('')}</div></div>`+list('documentos');break;case'rh':out=hero('👥 Recursos humanos','Cadastro funcional, benefícios, férias e histórico.')+list('funcionarios');break;case'estoque':out=hero('📦 Estoque e compras','Produtos, inventário, movimentações e fornecedores.')+`<div class="stats">${stat('Produtos',db.produtos.length)}${stat('Unidades',db.produtos.reduce((s,p)=>s+Number(p.quantidade||0),0))}${stat('Estoque baixo',db.produtos.filter(p=>p.tipo!=='Serviço'&&Number(p.quantidade||0)<=Number(p.minimo||0)).length)}${stat('Custo estimado',money(db.produtos.reduce((s,p)=>s+Number(p.quantidade||0)*Number(p.custo||0),0)))}</div>`+list('produtos')+list('movimentos')+list('compras');break;case'fiscal':out=hero('🧾 Fiscal e contábil','Controle interno de documentos, sem emissão fiscal oficial.')+list('fiscais');break;case'operacoes':out=hero('📋 Operações','Projetos, tarefas, serviços e execução.')+list('projetos')+list('tarefas');break;case'relatorios':out=hero('📊 Relatórios e backup','Indicadores reais com base nos registros locais.')+report()+`<div class="panel"><h2>Exportação e segurança</h2><p class="note">Faça backup regularmente. O armazenamento local não é adequado para dados empresariais sensíveis ou colaboração entre usuários.</p><div class="bar"><button class="btn" onclick="backup()">Baixar backup JSON</button><button class="btn secondary" onclick="$('backupInput').click()">Restaurar backup</button><input id="backupInput" type="file" accept=".json" hidden onchange="restore(this)"><button class="btn secondary" onclick="window.print()">Imprimir painel</button></div></div>`;break;case'ia':out=hero('✨ BUSINESS IA','Integração real ainda exige backend seguro, autorização e serviço de IA.')+`<div class="panel"><h2>Resumo local</h2><p>Clientes: ${db.clientes.length}. Funcionários: ${db.funcionarios.length}. Saldo realizado: ${money(total('Receita','Pago')-total('Despesa','Pago'))}.</p><p class="note">Este resumo é calculado no navegador; não é gerado por inteligência artificial.</p></div>`;break} $('main').innerHTML=out}
function template(t){const examples={Contrato:'CONTRATO DE PRESTAÇÃO DE SERVIÇOS\n\nPARTES: [identificar contratante e contratado]\nOBJETO: [descrever o serviço]\nPRAZO: [definir]\nVALOR E PAGAMENTO: [definir]\nOBRIGAÇÕES: [detalhar]\nRESCISÃO: [condições]\nASSINATURAS: [campos].',Recibo:'RECEBI de [nome] a quantia de R$ [valor], referente a [descrição], na data de [data].\n\nAssinatura: ____________________',Declaração:'DECLARO, para os devidos fins, que [descrever os fatos].\n\nLocal e data: [preencher]\nAssinatura: ____________________',Proposta:'PROPOSTA COMERCIAL\n\nCliente: [nome]\nEscopo: [serviços e entregas]\nPreço: [valor]\nPrazo: [prazo]\nCondições: [detalhar]',Ata:'ATA DE REUNIÃO\n\nData: [data]\nParticipantes: [nomes]\nPauta: [assuntos]\nDecisões: [decisões]\nResponsáveis: [nomes]',Carta:'À [destinatário],\n\n[texto da carta]\n\nAtenciosamente,\n[responsável]',Requerimento:'À autoridade competente,\n\nEu, [identificação], venho requerer [pedido] pelos motivos [fundamentos].\n\n[local, data e assinatura]','Ordem de serviço':'ORDEM DE SERVIÇO\n\nCliente: [nome]\nServiço: [descrição]\nMateriais: [itens]\nResponsável: [nome]\nPrazo: [data]\nValor: [valor]'};const o={id:id(),titulo:t,tipo:t,numero:'DOC-'+Date.now().toString().slice(-6),conteudo:examples[t]||'',emissao:today(),status:'Rascunho'};db.documentos.unshift(o);save();form('documentos',o.id)}
let budgetItems=[];function budgetUI(){return `<div class="panel"><h2>Orçamentos (${db.orcamentos.length})</h2><div class="bar"><button class="btn" onclick="newBudget()">＋ Novo orçamento com itens</button></div><div class="table"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Ações</th></tr></thead><tbody>${db.orcamentos.map(o=>`<tr><td>${h(o.numero)}</td><td>${h(o.cliente)}</td><td>${money(o.total)}</td><td><button class="btn secondary" onclick="budgetDoc('${o.id}')">PDF</button> <button class="btn danger" onclick="deleteBudget('${o.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum orçamento.</td></tr>'}</tbody></table></div></div>`}
function newBudget(){budgetItems=[];modal(`<h2>Novo orçamento comercial</h2><form id="budgetForm" class="form"><div class="field"><label>Número *</label><input name="numero" required value="ORC-${Date.now().toString().slice(-6)}"></div><div class="field"><label>Cliente *</label><select name="cliente" required><option value="">Selecione</option>${db.clientes.map(c=>`<option>${h(c.nome)}</option>`).join('')}</select></div><div class="field"><label>Validade</label><input type="date" name="validade"></div><div class="field"><label>Condições de pagamento</label><input name="pagamento"></div><div class="full section">Produtos / serviços</div><div class="field"><label>Produto</label><select id="budgetProduct">${db.produtos.map(p=>`<option value="${p.id}">${h(p.nome)} — ${money(p.preco)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="budgetQty" type="number" min="1" value="1"></div><div class="full"><button type="button" class="btn secondary" onclick="addBudgetItem()">Adicionar item</button><div id="budgetList"></div></div><div class="field"><label>Desconto (R$)</label><input name="desconto" type="number" min="0" step="any" value="0"></div><div class="field"><label>Frete (R$)</label><input name="frete" type="number" min="0" step="any" value="0"></div><div class="full bar"><button class="btn">Salvar orçamento</button></div></form>`);$('budgetForm').onsubmit=e=>{e.preventDefault();if(!budgetItems.length)return alert('Adicione itens');const o=Object.fromEntries(new FormData(e.target));const subtotal=budgetItems.reduce((s,x)=>s+x.q*x.preco,0);o.desconto=Number(o.desconto||0);o.frete=Number(o.frete||0);if(o.desconto>subtotal)return alert('Desconto acima do subtotal');o.id=id();o.data=today();o.itens=budgetItems.map(x=>({...x}));o.total=subtotal-o.desconto+o.frete;db.orcamentos.unshift(o);if(save()){closeModal();render()}}}
function addBudgetItem(){const p=db.produtos.find(x=>x.id===$('budgetProduct').value),q=Number($('budgetQty').value);if(!p||!Number.isInteger(q)||q<1)return alert('Escolha um produto e quantidade válida');budgetItems.push({nome:p.nome,q,preco:Number(p.preco||0)});$('budgetList').innerHTML=budgetItems.map((x,i)=>`<p>${h(x.nome)} × ${x.q} — ${money(x.q*x.preco)} <button type="button" class="btn danger" onclick="budgetItems.splice(${i},1);addBudgetRefresh()">Remover</button></p>`).join('')}
function addBudgetRefresh(){$('budgetList').innerHTML=budgetItems.map((x,i)=>`<p>${h(x.nome)} × ${x.q} — ${money(x.q*x.preco)} <button type="button" class="btn danger" onclick="budgetItems.splice(${i},1);addBudgetRefresh()">Remover</button></p>`).join('')}
function budgetDoc(itemId){const o=db.orcamentos.find(x=>x.id===itemId);if(!o)return;printDoc(`<div class="doc-header"><h2>${h(db.empresa.fantasia||db.empresa.razao||'MEU NEGÓCIO')}</h2><p>${h(db.empresa.cnpj||'')} — ${h(db.empresa.telefone||'')}</p></div><h1>ORÇAMENTO COMERCIAL</h1><p><b>Número:</b> ${h(o.numero)} | <b>Data:</b> ${h(o.data)}</p><p><b>Cliente:</b> ${h(o.cliente)} | <b>Validade:</b> ${h(o.validade)}</p><table><thead><tr><th>Item</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th></tr></thead><tbody>${o.itens.map(x=>`<tr><td>${h(x.nome)}</td><td>${x.q}</td><td>${money(x.preco)}</td><td>${money(x.q*x.preco)}</td></tr>`).join('')}</tbody></table><p><b>Desconto:</b> ${money(o.desconto)} | <b>Frete:</b> ${money(o.frete)}</p><h2>Total: ${money(o.total)}</h2><p>Condições: ${h(o.pagamento)}</p><div class="doc-footer">Proposta comercial. Não é documento fiscal.</div>`)}
function deleteBudget(itemId){if(confirm('Excluir orçamento?')){db.orcamentos=db.orcamentos.filter(o=>o.id!==itemId);save();render()}}
nav();render();
</script></body></html>
