
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e18">
<title>MEU NEGÓCIO PRO | V101 Infinite Space</title>
<style>
:root{
  --bg:#080e18;
  --side:#0c1421;
  --card:#121e2e;
  --card2:#162537;
  --line:#29394e;
  --text:#edf6ff;
  --muted:#91a5bb;
  --cyan:#39e5d2;
  --orange:#ff914d;
  --blue:#539dff;
  --green:#45dca1;
}
*{box-sizing:border-box}
body{
  margin:0;
  font:14px/1.5 system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{
  background:#0c1725;
  border:1px solid var(--line);
  border-radius:10px;
  color:white;
  padding:11px;
  min-width:0;
}
input:focus,select:focus{
  outline:2px solid var(--cyan);
}
.hidden{display:none!important}
.layout{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  flex-shrink:0;
  background:var(--side);
  border-right:1px solid var(--line);
  padding:22px 12px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
}
.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 9px 28px;
}
.logo-icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  background:linear-gradient(135deg,#48ffe2,#218bbd);
  color:#06151c;
  border-radius:12px;
  font-size:23px;
  font-weight:900;
  box-shadow:0 0 28px #36dfcf55;
}
.logo strong{font-size:15px}
.logo strong span{color:var(--cyan)}
.logo small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
}
.nav-title{
  font-size:10px;
  letter-spacing:1.6px;
  color:#71879e;
  padding:18px 12px 8px;
}
.nav{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#b4c4d5;
  border-radius:10px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  margin:2px 0;
}
.nav:hover{background:#1a2a3d}
.nav.active{
  color:#72ffee;
  background:linear-gradient(90deg,#164343,#112732);
  border-color:#2d7778;
}
.nav .ico{
  font-size:17px;
  width:22px;
  text-align:center;
}
.main{
  flex:1;
  min-width:0;
  padding:22px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:25px;
}
.topright{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}
.btn{
  background:#1a2b3d;
  color:var(--text);
  border:1px solid #345068;
  border-radius:10px;
  padding:10px 14px;
  font-weight:650;
}
.btn:hover{border-color:var(--cyan)}
.btn.primary{
  background:linear-gradient(120deg,#24b9b3,#45edda);
  border:0;
  color:#062122;
}
.btn.orange{
  background:linear-gradient(120deg,#ffae64,#ff7a39);
  border:0;
  color:#25140b;
}
h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.8px;
}
h2{font-size:16px;margin:0}
p{color:var(--muted)}
.pagehead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.pagehead p{margin:3px 0}
.hero{
  height:320px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 75% 50%,#17454b,#0b1b2c 55%,#0a1421);
  border:1px solid #2a6869;
  border-radius:20px;
  margin-bottom:16px;
}
#threeMount{
  position:absolute;
  inset:0;
  z-index:1;
}
#threeMount canvas{
  display:block;
  width:100%;
  height:100%;
}
.hero-content{
  position:relative;
  z-index:2;
  padding:36px;
  max-width:57%;
  pointer-events:none;
}
.hero-content h2{
  font-size:clamp(26px,3.5vw,44px);
  letter-spacing:-1.5px;
  line-height:1.13;
  margin:13px 0;
}
.hero-content p{
  max-width:440px;
  color:#bdd1df;
}
.hero-buttons{
  display:flex;
  gap:9px;
  margin-top:22px;
  flex-wrap:wrap;
  pointer-events:auto;
}
.eyebrow{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
}
.webgl-badge{
  position:absolute;
  right:17px;
  bottom:14px;
  z-index:2;
  color:#89f5e7;
  font-size:10px;
  border:1px solid #267b78;
  background:#071a22d9;
  padding:7px 11px;
  border-radius:30px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:14px;
}
.stat,.panel{
  background:linear-gradient(145deg,#152335,#101b29);
  border:1px solid var(--line);
  border-radius:13px;
}
.stat{
  padding:17px;
  min-height:125px;
  transition:transform .2s,border-color .2s;
}
.stat:hover{
  transform:translateY(-4px);
  border-color:#3c9897;
}
.stat-label{
  color:#acbfd0;
  font-size:11px;
}
.stat-value{
  font-size:27px;
  font-weight:850;
  margin:9px 0 3px;
}
.stat-foot{
  font-size:10px;
  color:var(--green);
}
.grid-main{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(260px,1fr);
  gap:13px;
  margin-bottom:13px;
}
.grid-bottom{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.panel{
  padding:18px;
  min-width:0;
}
.panelhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.panelhead small{color:var(--muted)}
.chart{
  display:block;
  width:100%;
  height:250px;
}
.bar{
  display:grid;
  grid-template-columns:100px 1fr 28px;
  gap:9px;
  align-items:center;
  font-size:11px;
  margin:16px 0;
}
.track{
  height:10px;
  border-radius:7px;
  background:#29384a;
  overflow:hidden;
}
.fill{
  height:100%;
  border-radius:7px;
  background:linear-gradient(90deg,#2586bb,var(--cyan));
}
.donut-layout{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:185px;
}
.donut{
  width:140px;
  height:140px;
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
.donut:after{
  content:"";
  position:absolute;
  inset:32px;
  border-radius:50%;
  background:#111b29;
}
.legend{display:grid;gap:9px;font-size:11px}
.legend span{color:#aebed0}
.activity{
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.activity:last-child{border:0}
.activity small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.card3d{
  background:#142235;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  min-height:130px;
  transform-style:preserve-3d;
  transition:transform .15s,border-color .2s;
  position:relative;
  overflow:hidden;
}
.card3d:hover{border-color:var(--cyan)}
.card3d strong{
  display:block;
  margin:12px 0 5px;
}
.card3d small{color:var(--muted)}
.card3d .symbol{
  color:var(--cyan);
  font-size:23px;
}
.notice{
  padding:13px;
  background:#102c36;
  border:1px solid #2b5b67;
  border-radius:10px;
  margin:12px 0;
  color:#c1dce4;
}
.table-scroll{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:580px;
  text-align:left;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
}
th{
  color:#8ca4b8;
  font-size:11px;
}
td{font-size:12px}
.tag{
  background:#20463f;
  color:#7cf3c5;
  padding:4px 9px;
  border-radius:20px;
  font-size:11px;
}
.auth-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(circle at 65% 25%,#164247,#080e18 65%);
}
.auth-card{
  width:min(430px,100%);
  background:#132132;
  border:1px solid #315466;
  border-radius:18px;
  padding:30px;
}
.auth-card .btn{width:100%;margin-top:15px}
.dialog-bg{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  display:grid;
  place-items:center;
  padding:15px;
}
.dialog{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#152435;
  border:1px solid #426174;
  border-radius:16px;
  padding:23px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin:17px 0;
}
.form-grid label{
  display:grid;
  gap:6px;
  font-size:12px;
  color:#aec4d4;
}
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:150;
  background:#1c3c43;
  border:1px solid #4a9b8f;
  border-radius:10px;
  padding:13px 17px;
}
@media(max-width:1200px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid-bottom{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  .sidebar{width:70px;padding:15px 5px}
  .logo .brand-text,.nav-title,.nav-text{display:none}
  .nav{justify-content:center}
  .grid-main{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  .layout{display:block}
  .sidebar{
    width:100%;
    height:60px;
    position:fixed;
    top:auto;
    bottom:0;
    z-index:50;
    display:flex;
    padding:5px;
    border-right:0;
    border-top:1px solid var(--line);
  }
  .sidebar .logo{display:none}
  #navigation{display:flex;gap:4px}
  .nav{min-width:46px}
  .main{padding:13px 11px 85px}
  .topright{width:100%}
  .topright select{flex:1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-bottom,.cards{grid-template-columns:1fr}
  .hero{height:350px}
  .hero-content{padding:22px;max-width:95%}
  .hero-content h2{font-size:29px}
  #threeMount{opacity:.6}
  .form-grid{grid-template-columns:1fr}
  .donut-layout{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    transition:none!important;
    animation:none!important;
  }
}

/* V22: mobile usability, accessible chart focus, avoid layout overflow */
#view{min-width:0}#view .mnp-analytics{max-width:100%;overflow:hidden}
#view .v20-visual>*{min-width:0}
#bsp-shell{max-width:100%;overflow:hidden}
@media(max-width:720px){#bsp-canvas{height:min(530px,70svh)!important;min-height:340px}#bsp-controls{bottom:8px}#bsp-controls button,#bsp-controls select{padding:8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* V24: touch-first interactive business insights */
.v24-controls{display:grid;grid-template-columns:minmax(170px,2fr) repeat(2,minmax(120px,1fr)) auto;gap:10px;align-items:end;margin:14px 0}
.v24-controls label{font-size:12px;color:#b8d9e8;display:flex;flex-direction:column;gap:6px}
.v24-controls input,.v24-controls select,.v24-controls button{min-height:44px;min-width:0;width:100%;border-radius:12px;border:1px solid rgba(115,230,245,.25);background:#112b3b;color:#f2fbff;padding:9px 12px;font:inherit}

(function(){

 const navigation=document.getElementById('navigation');
 let lastFocus=null;
 function setOpen(open){
  document.body.classList.toggle('mobile-menu-open',open);
  backdrop.hidden=!open;
  openBtn.setAttribute('aria-expanded',String(open));
  menu.setAttribute('aria-hidden',String(!open&&window.innerWidth<=700));
  if(open){lastFocus=document.activeElement;closeBtn.focus();}
  else if(lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null;}
 }
 openBtn.addEventListener('click',()=>setOpen(true));

function esc(value) {
  return String(value ?? "").replace(

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"

  }

  if (code === "auth/popup-blocked") {
    return "O navegador bloqueou a janela de login.";
  }

  if (code === "auth/popup-closed-by-user") {
    return "A janela de login foi fechada.";
  }

  if (code === "auth/network-request-failed") {
    return "Falha na conexão com a internet.";
  }

  return error?.message || "Ocorreu um erro.";
}

function money(value) {
  return Number(value || 0).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );
}

function today() {
  const date = new Date();

  const year = date.getFullYear();
  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatDate(value) {
  if (!value) return "—";

  const match = String(value).match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return `${match[3]}/${match[2]}/${match[1]}`;
  }

  return String(value);
}

/* =========================================
   OPERAÇÕES DE CADASTRO
========================================= */

async function saveRecord(
  collectionName,
  data,
  id = null
) {
  if (!S.user || !S.companyId) {
    throw new Error("Faça login e selecione uma empresa.");
  }

  if (
    !collections.includes(collectionName) ||
    collectionName === "members"
  ) {
    throw new Error("Coleção não autorizada para cadastro genérico.");
  }

  const hrCollections = ["employees","leaves","vacancies","candidates","attendance","benefits","sst","training","performance","positions"];
  const businessCollections = ["finance","sales","stock","purchases","documents","projects","support","tasks","events","clients","suppliers","quotes"];
  if (hrCollections.includes(collectionName) && !isAdmin()) {
    throw new Error("Sem permissão para alterar registros de RH.");
  }
  if (businessCollections.includes(collectionName) && !canManageBusiness()) {
    throw new Error("Sem permissão para alterar registros empresariais.");
  }
  if (collectionName === "payroll" && !isSecurityAdmin()) {
    throw new Error("A folha exige perfil proprietário ou administrador.");
  }
  if (JSON.stringify(data).length > 100000) {
    throw new Error("Registro muito grande.");
  }

  if (collectionName === "payroll") {
    await savePayrollSecure({companyId:S.companyId,id:id||null,data});
    return;
  }

  const batch=writeBatch(db);
  const target=id?companyDoc(collectionName,id):doc(companyCollection(collectionName));
  if(id){
    const current=await getDoc(target);
    if(!current.exists())throw new Error('Registro não encontrado.');
    batch.update(target,{...data,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  }else{
    batch.set(target,{...data,createdAt:serverTimestamp(),createdBy:S.user.uid});
  }
  if(isSecurityAdmin()){
    const log=doc(companyCollection('audit'));
    batch.set(log,{action:id?'record_updated':'record_created',companyId:S.companyId,
      actorUid:S.user.uid,at:serverTimestamp(),schemaVersion:68,
      details:{collection:collectionName,recordId:target.id,fields:Object.keys(data).slice(0,40)}});
  }
  await batch.commit();
}

async function readCollection(name) {
  try {
    const snapshot = await getDocs(
      companyCollection(name)
    );

    return snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));
  } catch (error) {
    if (error.code === "permission-denied") {
      console.warn(
        "Sem acesso à coleção:",
        name
      );

      return [];
    }

    throw error;
  }
}

/* =========================================
   CARREGAMENTO DOS REGISTROS
========================================= */

async function reload() {
  if (!S.companyId) return;

  const restrictedHR = [
    "employees",
    "leaves",
    "vacancies",
    "candidates",
    "attendance",
    "payroll"
  ];

  const restrictedBusiness = [
    "finance",
    "sales",
    "stock",
    "purchases",
    "benefits",
    "sst",
    "training",
    "performance",
    "documents",
    "projects",
    "positions",
    "support",
    "tasks",
    "events",
    "clients",
    "suppliers",
    "quotes"
  ];

  const results = await Promise.all(
    collections.map(name => {
      if (
        restrictedHR.includes(name) &&
        !canReadHR()
      ) {
        return Promise.resolve([]);
      }

      if (
        name === "payroll" &&
        !isAdmin()
      ) {
        return Promise.resolve([]);
      }

      if (
        restrictedBusiness.includes(name) &&
        !canManageBusiness()
      ) {
        return Promise.resolve([]);
      }

      return readCollection(name);
    })
  );

  collections.forEach((name, index) => {
    S[name] = results[index];
  });

  render();
}

async function selectCompany(companyId) {
  const company = S.companies.find(
    item => item.id === companyId
  );

  if (!company) {
    throw new Error("Empresa não encontrada.");
  }

  const membership = await getDoc(
    doc(
      db,
      "companies",
      companyId,
      "members",
      S.user.uid
    )
  );

  if (!membership.exists()) {
    throw new Error(
      "Sua conta não possui acesso a esta empresa."
    );
  }

  S.companyId = companyId;
  S.role = membership.data().role || "employee";
  S.page = "dashboard";

  sessionStorage.setItem(
    "mn3d_company",
    companyId
  );

  $("companySelect").value = companyId;

  await reload();
}

async function loadCompanies() {
  const snapshot = await getDocs(
    query(
      collection(db, "companies"),
      where(
        "memberUids",
        "array-contains",
        S.user.uid
      )
    )
  );

  S.companies = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  $("companySelect").innerHTML =
    S.companies.map(company => `
      <option value="${esc(company.id)}">
        ${esc(company.name)}
      </option>
    `).join("");

  const savedCompany = sessionStorage.getItem(
    "mn3d_company"
  );

  const selectedCompany =
    S.companies.find(
      item => item.id === savedCompany
    )?.id ||
    S.companies[0]?.id;

  if (selectedCompany) {
    await selectCompany(selectedCompany);
    return;
  }

  S.companyId = "";
  S.role = "";

  $("pageTitle").textContent =
    "Bem-vindo ao MEU NEGÓCIO PRO";

  $("view").innerHTML = panel(
    "Primeira configuração",

function companyForm() {
  modal(
    "Cadastrar empresa",
    `
      ${inputField(
        "Razão social ou nome",
        "name",
        "",
        "text",
        true
      )}

      ${inputField(
        "Nome fantasia",
        "tradeName"

      )}

    async data => {

      }

        throw new Error("Informe o nome da empresa.");
      }

      const companyRef = doc(
        collection(db, "companies")
      );

      const batch = writeBatch(db);

      batch.set(companyRef, {
        ...data,
        ownerUid: S.user.uid,
        memberUids: [S.user.uid],
        createdAt: serverTimestamp()
      });

      batch.set(
        doc(
          db,
          "companies",
          companyRef.id,
          "members",
          S.user.uid

          uid: S.user.uid,
          email: S.user.email || "",
          name: S.user.displayName || "",
          role: "owner",
          createdAt: serverTimestamp()
        }
      );

      await batch.commit();

      sessionStorage.setItem(
        "mn3d_company",

      );

      await loadCompanies();
    }
  );

function geometryForTheme(shape) {
  switch (shape) {
    case "sphere":
      return new THREE.IcosahedronGeometry(1.3, 2);

    case "cube":
      return new THREE.BoxGeometry(2.1, 2.1, 2.1);

    case "ring":
      return new THREE.TorusKnotGeometry(
        .95, .3, 100, 12, 2, 3
      );

    default:
      return new THREE.IcosahedronGeometry(1.3, 1);
  }
}

/* =========================================
   INICIAR THREE.JS GLOBAL
========================================= */

function startGlobal3D() {
  if (global3D || !global3DEnabled) return;

  let renderer;

  try {
    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: "default"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 1.4)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    global3DMount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      .1,
      100
    );

    camera.position.set(0, 0, 12);

    const ambient = new THREE.AmbientLight(
      0x83bacc, 1.25
    );

    scene.add(ambient);

    const cyanLight = new THREE.PointLight(
      0x39e5d2, 55
    );

    cyanLight.position.set(4, 5, 5);
    scene.add(cyanLight);

    const orangeLight = new THREE.PointLight(
      0xff914d, 42
    );

    orangeLight.position.set(-5, -4, 3);
    scene.add(orangeLight);

    const rig = new THREE.Group();
    rig.position.set(3.8, 0, -4);
    scene.add(rig);

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x39e5d2,
      metalness: .65,
      roughness: .22,
      transparent: true,
      opacity: .42,
      flatShading: true,
      clearcoat: 1
    });

    const core = new THREE.Mesh(
      geometryForTheme("core"),
      coreMaterial
    );

    rig.add(core);

    const wire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.7, 2),
      new THREE.MeshBasicMaterial({
        color: 0x7bffef,
        wireframe: true,
        transparent: true,
        opacity: .35
      })
    );

    rig.add(wire);

    const rings = [];

    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
          2.15 + i * .35,
          .012,
          8,
          110
        ),
        new THREE.MeshBasicMaterial({
          color: i === 1 ? 0xff914d : 0x39e5d2,
          transparent: true,
          opacity: .35
        })
      );

      ring.rotation.x = i * .65 + .4;
      ring.rotation.y = i * .3;

      rig.add(ring);
      rings.push(ring);
    }

    const count = window.innerWidth < 700
      ? 180
      : 500;

    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      positions[i * 3] =
        (Math.random() - .5) * 32;

      positions[i * 3 + 1] =
        (Math.random() - .5) * 22;

      positions[i * 3 + 2] =
        (Math.random() - .5) * 20;
    }

    const particleGeometry =
      new THREE.BufferGeometry();

    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const particles = new THREE.Points(
      particleGeometry,
      new THREE.PointsMaterial({
        color: 0x79e9ff,
        size: .035,
        transparent: true,
        opacity: .65
      })
    );

    scene.add(particles);

    const pointer = {x: 0, y: 0};
    const target = {x: 0, y: 0};

    function onPointer(event) {
      target.x =
        (event.clientX / window.innerWidth - .5) * 2;

      target.y =
        (event.clientY / window.innerHeight - .5) * 2;
    }

    window.addEventListener(
      "pointermove",
      onPointer,
      {passive: true}
    );

    function onResize() {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      rig.position.x =
        window.innerWidth < 700 ? 1.5 : 3.8;
    }

    window.addEventListener("resize", onResize);
    onResize();

    const clock = new THREE.Clock();

    global3D = {
      renderer,
      scene,
      camera,
      rig,
      core,
      wire,
      rings,
      particles,
      coreMaterial,
      pointer,
      target,
      clock,
      onPointer,
      onResize,
      frame: 0
    };

    function animate() {
      if (!global3D ||
          global3D.renderer !== renderer) {
        return;
      }

      const time = clock.getElapsedTime();

      pointer.x +=
        (target.x - pointer.x) * .04;

      pointer.y +=
        (target.y - pointer.y) * .04;

      if (!reducedMotion) {
        rig.rotation.y =
          time * .12 + pointer.x * .2;

        rig.rotation.x =
          Math.sin(time * .2) * .1 -
          pointer.y * .12;

        core.rotation.x = time * .16;
        core.rotation.y = time * .23;

        wire.rotation.y = -time * .1;

        rings.forEach((ring, i) => {
          ring.rotation.z =
            time * (.04 + i * .025);
        });

        particles.rotation.y = time * .002;
      }

      renderer.render(scene, camera);

      if (!reducedMotion) {
        global3D.frame =
          requestAnimationFrame(animate);
      }
    }

    animate();

  } catch (error) {
    console.warn("WebGL indisponível:", error);
    renderer?.dispose();
    renderer?.domElement?.remove();
    global3DEnabled = false;
  }
}

/* =========================================
   TROCAR OBJETO 3D CONFORME A PÁGINA
========================================= */

function set3DTheme(page) {
  if (!global3D) return;

  const theme = sceneThemes[page] ||
    sceneThemes.dashboard;

  const oldGeometry = global3D.core.geometry;

  global3D.core.geometry =
    geometryForTheme(theme.shape);

  oldGeometry.dispose();

  global3D.coreMaterial.color.setHex(
    theme.color
  );

  global3D.coreMaterial.needsUpdate = true;
}

/* =========================================
   DESLIGAR THREE.JS GLOBAL
========================================= */

function stopGlobal3D() {
  if (!global3D) return;

  const t = global3D;
  global3D = null;

  cancelAnimationFrame(t.frame);

  window.removeEventListener(
    "pointermove",
    t.onPointer
  );

  window.removeEventListener(
    "resize",
    t.onResize
  );

  t.scene.traverse(object => {
    object.geometry?.dispose();

    if (object.material) {
      const materials =
        Array.isArray(object.material)
          ? object.material
          : [object.material];

      materials.forEach(material => {
        material.dispose();
      });
    }
  });

  t.renderer.dispose();
  t.renderer.domElement.remove();
}

   CONTROLE DO 3D

/* =========================================
   GRÁFICO DE LINHA
========================================= */

function lineChart(values) {
  const data = values.length ? values : [0];

  const width = 780;
  const height = 250;
  const left = 45;
  const top = 18;
  const bottom = 35;

  const max = Math.max(1, ...data);
  const plotWidth = width - left - 20;
  const plotHeight = height - top - bottom;

  const points = data.map((value, index) => {
    const x = left +
      (data.length === 1
        ? .5
        : index / (data.length - 1)) * plotWidth;

    const y = top +
      plotHeight -
      (Number(value) / max) * plotHeight;

    return [x, y];
  });

  const path = points.map((point, index) =>
    `${index ? "L" : "M"}${point[0]},${point[1]}`
  ).join(" ");

  const first = points[0];
  const last = points[points.length - 1];

  const area = `${path}
    L${last[0]},${top + plotHeight}
    L${first[0]},${top + plotHeight} Z`;

  return `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
      preserveAspectRatio="none"
      role="img"
      aria-label="Gráfico de evolução"
    >
      <defs>
        <linearGradient
          id="enterpriseChartFill"
          x1="0" y1="0" x2="0" y2="1"
        >
          <stop
            offset="0%"
            stop-color="#39e5d2"
            stop-opacity=".35"
          />
          <stop
            offset="100%"
            stop-color="#39e5d2"
            stop-opacity="0"
          />
        </linearGradient>
      </defs>

      ${[0, .25, .5, .75, 1].map(step => {
        const y = top + plotHeight * (1 - step);

        return `
          <line
            x1="${left}"
            y1="${y}"
            x2="${width - 20}"
            y2="${y}"
            stroke="#294052"
            stroke-dasharray="5 6"
          />
          <text
            x="5"
            y="${y + 4}"
            fill="#91a5bb"
            font-size="11"
          >
            ${Math.round(max * step)}
          </text>
        `;
      }).join("")}

      <path
        d="${area}"
        fill="url(#enterpriseChartFill)"
      />

      <path
        d="${path}"
        fill="none"
        stroke="#39e5d2"
        stroke-width="3"
        stroke-linejoin="round"
      />

      ${points.map(point => `
        <circle
          cx="${point[0]}"
          cy="${point[1]}"
          r="4"
          fill="#78fff0"
        />
      `).join("")}
    </svg>
  `;
}

/* =========================================
   GRÁFICO DE BARRAS
========================================= */

function bars(items) {
  if (!items.length) {
    return "<p>Sem dados cadastrados.</p>";
  }

  const max = Math.max(
    1,
    ...items.map(item => Number(item.value) || 0)
  );

  return items.map(item => {
    const value = Number(item.value) || 0;
    const percentage = Math.max(
      0,
      Math.min(100, value / max * 100)
    );

    return `
      <div class="bar">
        <span>${esc(item.label)}</span>

        <div class="track">
          <div
            class="fill"
            style="width:${percentage}%"
          ></div>
        </div>

        <b>${value}</b>
      </div>
    `;
  }).join("");
}

/* =========================================
   GRÁFICO DE DISTRIBUIÇÃO
========================================= */

function donut(items) {
  const colors = [
    "#539dff",
    "#ff914d",
    "#a67bfa",
    "#39e5d2",
    "#efc05b"
  ];

  const total = items.reduce(
    (sum, item) => sum + Number(item.value || 0),
    0
  );

  if (!total) {
    return "<p>Sem dados cadastrados.</p>";
  }

  let offset = 0;

  const stops = items.map((item, index) => {
    const start = offset;
    offset += Number(item.value || 0) / total * 100;

    return `${
      colors[index % colors.length]
    } ${start}% ${offset}%`;
  });

  return `
    <div class="donut-layout">
      <div
        class="donut"
        style="background:conic-gradient(${stops.join(",")})"
      ></div>

      <div class="legend">
        ${items.map((item, index) => `
          <div>
            <span style="color:${
              colors[index % colors.length]
            }">●</span>

            ${esc(item.label)}

            <strong>
              ${Math.round(
                Number(item.value || 0) / total * 100
              )}%
            </strong>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function admissionSeries() {
  const result = [];
  const now = new Date();

  for (let i = 11; i >= 0; i--) {
    const date = new Date(
      now.getFullYear(),
      now.getMonth() - i,
      1
    );

    const prefix =
      date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0");

    result.push(
      S.employees.filter(employee =>
        String(employee.admission || "")
          .startsWith(prefix)
      ).length
    );
  }

  return result;
}

function departmentData() {
  const result = S.departments.map(department => ({
    label: department.name,
    value: S.employees.filter(employee =>
      employee.departmentId === department.id
    ).length
  })).filter(item => item.value > 0);

  const withoutDepartment = S.employees.filter(
    employee =>
      !employee.departmentId ||
      !S.departments.some(
        department =>
          department.id === employee.departmentId
      )
  ).length;

  if (withoutDepartment) {
    result.push({
      label: "Sem departamento",
      value: withoutDepartment
    });
  }

  return result;
}

function employeeName(id) {
  return S.employees.find(
    employee => employee.id === id
  )?.name || "Não encontrado";
}

function departmentName(id) {
  return S.departments.find(
    department => department.id === id
  )?.name || "Não definido";
}

/* =========================================
   FOLHA ADMINISTRATIVA
========================================= */

function v40Num(x){const n=Number(x||0);return Number.isFinite(n)?n:0}
function v41Round(n){return Math.round((n+Number.EPSILON)*100)/100}
function v41SettingsKey(){return "mnp-v41-payroll-rates-"+String(S.companyId||"none")}
function v41Rates(){try{const x=JSON.parse(localStorage.getItem(v41SettingsKey())||"{}");return x&&typeof x==="object"?x:{}}catch{return {}}}
function v41Brackets(raw){
 if(!Array.isArray(raw)||!raw.length)return null;
 let last=0;
 for(const b of raw){if(!Number.isFinite(b.limit)||b.limit<=last||!Number.isFinite(b.rate)||b.rate<0||b.rate>1)return null;last=b.limit}
 return raw;
}
function v41Progressive(value,brackets){
 let prev=0,total=0;
 for(const b of brackets){const part=Math.max(0,Math.min(value,b.limit)-prev);total+=part*b.rate;prev=b.limit;if(value<=b.limit)break}
 if(value>prev)throw Error("Tabela incompleta para a remuneração informada");
 return v41Round(total);
}
function v41Tax(gross,r){
 const cfg=v41Rates();
 const inssTable=v41Brackets(cfg.inss);
 const irrfTable=v41Brackets(cfg.irrf);
 const automatic=cfg.mode==="auto"&&inssTable&&irrfTable&&cfg.validated===true&&cfg.competence===r.period;
 if(!automatic)return {inss:v40Num(r.inss),irrf:v40Num(r.irrf),automatic:false};
 const inss=v41Progressive(gross,inssTable);
 const dependentCount=Math.max(0,Math.floor(v40Num(r.dependents)));
 const irrfBase=Math.max(0,gross-inss-dependentCount*v40Num(cfg.dependentDeduction)-v40Num(r.otherTaxDeduction));
 const irrf=v41Round(Math.max(0,v41Progressive(irrfBase,irrfTable)-v40Num(cfg.irrfAdditionalReduction)));
 return {inss,irrf,automatic:true};
}
function v40Pay(r){
 const base=v40Num(r.base),extra=v40Num(r.extra),overtime=v40Num(r.overtime),night=v40Num(r.night),bonus=v40Num(r.bonus);
 const gross=v41Round(base+extra+overtime+night+bonus);
 const tax=v41Tax(gross,r);
 const inss=tax.inss,irrf=tax.irrf,other=v40Num(r.deductions),advances=v40Num(r.advances);
 const deductions=v41Round(inss+irrf+other+advances);
 const rate=(v41Rates().fgtsRate!==null&&v41Rates().fgtsRate!==undefined&&v41Rates().fgtsRate!==""&&Number.isFinite(Number(v41Rates().fgtsRate)))?Number(v41Rates().fgtsRate):null;
 const fgts=rate!==null&&rate>=0&&rate<=1?v41Round(gross*rate):v40Num(r.fgts);
 return {gross,deductions,net:v41Round(gross-deductions),fgts,base,extra,overtime,night,bonus,inss,irrf,other,advances,automatic:tax.automatic};
}
function v41RateEditor(){
 if(!isSecurityAdmin()){toast("Sem permissão.");return}
 const cfg=v41Rates();
 modal("Parâmetros de cálculo da folha",`
 <div class="notice">Configure tabelas oficiais vigentes para a competência. Sem tabelas verificadas, os tributos permanecem manuais. Tabelas locais não são configuração segura para fechamento oficial.</div>
 <label>Modo de cálculo<select name="mode"><option value="manual" ${cfg.mode!=="auto"?"selected":""}>Manual</option><option value="auto" ${cfg.mode==="auto"?"selected":""}>Automático com tabelas informadas</option></select></label>
 <label>Faixas INSS (JSON: [{\"limit\":1500,\"rate\":0.075},...])<textarea name="inssTable" rows="5">${esc(JSON.stringify(cfg.inss||[]))}</textarea></label>
 <label>Faixas IRRF (JSON: [{\"limit\":2500,\"rate\":0},...])<textarea name="irrfTable" rows="5">${esc(JSON.stringify(cfg.irrf||[]))}</textarea></label>
 ${inputField("Competência de validade (AAAA-MM)","competence",cfg.competence||today().slice(0,7),"month")}
 ${inputField("Dedução por dependente (R$)","dependentDeduction",cfg.dependentDeduction??0,"number")}
 ${inputField("Redução adicional IRRF (R$), quando aplicável","irrfAdditionalReduction",cfg.irrfAdditionalReduction??0,"number")}
 ${inputField("Alíquota FGTS (decimal: 0.08 = 8%)","fgtsRate",cfg.fgtsRate??"","number")}
 <label><input type="checkbox" name="validated" ${cfg.validated?"checked":""}> Conferi as tabelas e a vigência com fonte oficial</label>`,
 async data=>{
  const inss=JSON.parse(data.inssTable||"[]"),irrf=JSON.parse(data.irrfTable||"[]");
  if(data.mode==="auto"&&(!v41Brackets(inss)||!v41Brackets(irrf)||!(data.validated===true||data.validated==="on")))throw Error("Tabelas progressivas inválidas.");
  const fgtsRate=data.fgtsRate===""?null:Number(data.fgtsRate);
  if(fgtsRate!==null&&(!Number.isFinite(fgtsRate)||fgtsRate<0||fgtsRate>1))throw Error("Alíquota FGTS inválida.");
  const dependentDeduction=Number(data.dependentDeduction||0);
  if(!Number.isFinite(dependentDeduction)||dependentDeduction<0)throw Error("Dedução inválida.");
  const irrfAdditionalReduction=Number(data.irrfAdditionalReduction||0);
  if(!Number.isFinite(irrfAdditionalReduction)||irrfAdditionalReduction<0)throw Error("Redução IRRF inválida.");
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(data.competence||""))throw Error("Competência da tabela inválida.");
  localStorage.setItem(v41SettingsKey(),JSON.stringify({mode:data.mode,inss,irrf,fgtsRate,dependentDeduction,irrfAdditionalReduction,competence:data.competence,validated:data.validated===true||data.validated==="on"}));
  payrollPage();
 });
}

function v42PayView(r){
 if(r.status==="fechado"&&r.closedSnapshot&&Number.isFinite(r.closedSnapshot.net)){
  const x=r.closedSnapshot;
  return {...x,base:x.base||0,extra:x.extra||0,overtime:x.overtime||0,night:x.night||0,bonus:x.bonus||0,other:x.other||0,advances:x.advances||0};
 }
 return v40Pay(r);
}
function v42Simulator(){
 const html=`<div class="notice">Simulador gerencial. Valores de férias, 13º e rescisão não substituem cálculos legais e não são gravados na folha. Para rescisão, o cálculo depende de modalidade, aviso, saldo, férias e outras verbas.</div>
 ${inputField("Salário mensal (R$)","salary","3000","number")}
 ${inputField("Horas mensais contratuais","hours","220","number")}
 ${inputField("Horas extras 50% (quantidade)","overtimeHours","0","number")}
 ${inputField("Horas extras 100% (quantidade)","overtime100","0","number")}
 ${inputField("Dias úteis no período (DSR)","workDays","22","number")}
 ${inputField("Domingos e feriados para DSR","restDays","4","number")}
 ${inputField("Meses proporcionais (1 a 12)","months","12","number")}
 ${inputField("Dias de férias simulados (1 a 30)","vacationDays","30","number")}`;
 modal("Simulador de verbas — V42",html,async d=>{
  const values=["salary","hours","overtimeHours","overtime100","workDays","restDays","months","vacationDays"].map(k=>Number(d[k]));
  if(values.some(v=>!Number.isFinite(v)||v<0))throw Error("Preencha somente números válidos.");
  const [salary,hours,h50,h100,work,rest,months,days]=values;
  if(salary<=0||hours<=0||work<=0||months<1||months>12||!Number.isInteger(months)||days<1||days>30)throw Error("Confira os limites de jornada, meses e férias.");
  const rate=salary/hours,extra50=v41Round(rate*1.5*h50),extra100=v41Round(rate*2*h100);
  const dsr=v41Round((extra50+extra100)/work*rest);
  const thirteenth=v41Round(salary*months/12);
  const vacationBase=v41Round(salary*days/30),vacationThird=v41Round(vacationBase/3);

 });
}

function payrollForm(id = null) {
  if(!isSecurityAdmin()){toast("Acesso restrito.");return;}
  if (!S.employees.length) {
    toast("Cadastre um colaborador primeiro.");
    return;
  }

  const record = S.payroll.find(
    item => item.id === id
  ) || {};

  modal(
    id ? "Editar lançamento" : "Lançamento de folha",
    `
      ${selectField(
        "Colaborador",
        "employeeId",
        S.employees.map(employee => ({
          value: employee.id,
          label: employee.name
        })),
        record.employeeId
      )}

      ${inputField(
        "Competência (AAAA-MM)",
        "period",
        record.period ||
          today().slice(0, 7),
        "month",
        true
      )}

      ${inputField(
        "Valor base",
        "base",
        record.base || "0",
        "number",
        true
      )}

      ${inputField(
        "Adicionais",
        "extra",
        record.extra || "0",
        "number"
      )}

      ${inputField(
        "Descontos",
        "deductions",
        record.deductions || "0",
        "number"
      )}
      ${inputField("Horas extras (valor)", "overtime", record.overtime || "0", "number")}
      ${inputField("Adicional noturno (valor)", "night", record.night || "0", "number")}
      ${inputField("Bônus (valor)", "bonus", record.bonus || "0", "number")}
      ${inputField("Dependentes para IRRF", "dependents", record.dependents || "0", "number")}
      ${inputField("Outras deduções legais IRRF", "otherTaxDeduction", record.otherTaxDeduction || "0", "number")}
      ${inputField("INSS retido (informado)", "inss", record.inss || "0", "number")}
      ${inputField("IRRF retido (informado)", "irrf", record.irrf || "0", "number")}
      ${inputField("Adiantamentos", "advances", record.advances || "0", "number")}
      ${inputField("FGTS patronal (informado)", "fgts", record.fgts || "0", "number")}
      ${selectField("Situação", "status", [{value:"rascunho",label:"Rascunho"},{value:"conferido",label:"Conferido"},{value:"fechado",label:"Fechado"}],record.status||"rascunho")}
    `,
    async data => {
      if (!isSecurityAdmin()) {
        throw new Error("Sem permissão.");
      }

      for (const field of [
        "base",
        "extra",
        "deductions",
        "overtime", "night", "bonus", "inss", "irrf", "advances", "fgts", "dependents", "otherTaxDeduction"
      ]) {
        const value = Number(data[field] || 0);

        if (!Number.isFinite(value) || value < 0) {
          throw new Error(
            "Informe valores válidos e não negativos."
          );
        }

        data[field] = value;
      }

      if(!S.employees.some(e=>e.id===data.employeeId))throw new Error("Colaborador inválido.");
      if(!Number.isInteger(data.dependents)||data.dependents>30)throw new Error("Quantidade de dependentes inválida.");
      for(const field of ["base","extra","deductions","overtime","night","bonus","inss","irrf","advances","fgts","otherTaxDeduction"]){
        if(data[field]>100000000)throw new Error("Valor excede o limite permitido.");
      }
      if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(data.period||""))throw new Error("Competência inválida.");
      if(id&&record.status==="fechado")throw new Error("Folha fechada não pode ser editada nesta interface. Solicite estorno/reabertura controlada.");
      if(S.payroll.some(r=>r.id!==id&&r.employeeId===data.employeeId&&r.period===data.period))throw new Error("Já existe folha deste funcionário nesta competência.");
      if(!["rascunho","conferido","fechado"].includes(data.status))throw Error("Situação inválida.");
      if(id && record.status==="conferido" && data.status==="rascunho" && !confirm("Reverter conferência da folha?"))return;
      if(data.status==="fechado" && record.status!=="conferido")throw Error("Salve como Conferido antes de fechar.");
      if(data.status==="fechado" && v41Rates().mode==="auto" && !v41Tax(v40Num(data.base)+v40Num(data.extra)+v40Num(data.overtime)+v40Num(data.night)+v40Num(data.bonus),data).automatic)throw Error("Tabelas automáticas não validadas para esta competência.");
      const x=v40Pay(data);
      if(!Number.isFinite(x.net)||!Number.isFinite(x.gross)||!Number.isFinite(x.fgts))throw Error("Cálculo inválido.");
      if(x.deductions>x.gross)throw new Error("Descontos superam o salário bruto.");
      if(data.status==="fechado" && !isSecurityAdmin())throw new Error("Somente administrador pode fechar a folha.");
      if(data.status==="fechado" && !confirm("Confirmar fechamento administrativo? Isso não envia ao eSocial."))return;
      // O servidor gera o snapshot de fechamento e registra a autoria autenticada.
      delete data.closedSnapshot;
      await saveRecord("payroll", data, id);
      await reload();
    }
  );
}

/* =========================================
   FORMATAÇÃO DOS CAMPOS
========================================= */

function enterpriseFieldValue(field, value) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  if ([
    "amount",
    "price",
    "budget",
    "salary"
  ].includes(field.name)) {
    return money(value);
  }

  if (field.type === "date") {
    return formatDate(value);
  }

  return String(value);
}

/* =========================================
   CAMPOS AUTOMÁTICOS DOS FORMULÁRIOS
========================================= */

function enterpriseFormFields(config, record = {}) {
  return config.fields.map(field => {
    const value = record[field.name] ?? "";

    if (field.type === "select") {
      return selectField(
        field.label,
        field.name,
        field.options,
        value
      );
    }

    return inputField(
      field.label,
      field.name,
      value,
      field.type || "text",
      field.required || false
    );
  }).join("");
}

/* =========================================
   FORMULÁRIO UNIVERSAL
========================================= */

function enterpriseModuleForm(page, id = null) {
  const config = enterpriseModules[page];

  if (!config) {
    toast("Módulo não encontrado.");
    return;
  }

  if (!canEditEnterpriseModule(page)) {
    toast("Você não possui permissão.");
    return;
  }

  const records = S[config.collection] || [];

  const record = records.find(
    item => item.id === id
  ) || {};

  modal(
    id
      ? `Editar — ${config.title}`
      : `Novo registro — ${config.title}`,

    enterpriseFormFields(config, record),

    async data => {
      if (!canEditEnterpriseModule(page)) {
        throw new Error("Sem permissão.");
      }

      for (const field of config.fields) {
        if (
          field.required &&
          !String(data[field.name] ?? "").trim()
        ) {
          throw new Error(
            `Preencha o campo: ${field.label}`
          );
        }

        if (field.type === "number") {
          const raw = data[field.name];

          if (raw === "" || raw === undefined) {
            data[field.name] = 0;
          } else {
            const number = Number(raw);

            if (!Number.isFinite(number)) {
              throw new Error(
                `Número inválido: ${field.label}`
              );
            }

            data[field.name] = number;
          }
        }
      }

      if (
        page === "performance" &&
        (data.score < 0 || data.score > 10)
      ) {
        throw new Error(
          "A nota precisa estar entre 0 e 10."
        );
      }

      if (
        page === "projects" &&
        data.start &&
        data.deadline &&
        data.deadline < data.start
      ) {
        throw new Error(
          "O prazo final não pode ser anterior ao início."
        );
      }

      await saveRecord(
        config.collection,
        data,
        id
      );

      await reload();
    }
  );
}

/* =========================================
   PESQUISA DE REGISTROS
========================================= */

function filterEnterpriseRecords(page, term) {
  const config = enterpriseModules[page];

  if (!config) return [];

  const records = S[config.collection] || [];

  const search = String(term || "")
    .trim()
    .toLocaleLowerCase("pt-BR");

  if (!search) return records;

  return records.filter(record =>
    config.fields.some(field =>
      String(record[field.name] ?? "")
        .toLocaleLowerCase("pt-BR")
        .includes(search)
    )
  );
}

/* =========================================

========================================= */

function enterpriseTable(page, records) {
  const config = enterpriseModules[page];

  const fields = config.columns.map(name =>
    config.fields.find(field => field.name === name)

  return table(
    [

      "Ações"
    ],

    records.map(record => `

/* =========================================
   INDICADORES FINANCEIROS
========================================= */

function financeSummary() {
  const records = S.finance || [];

  const received = records
    .filter(record =>
      record.type === "Receita" &&
      record.status === "Recebido"
    )
    .reduce(
      (sum, record) =>
        sum + Number(record.amount || 0),
      0
    );

  const paid = records
    .filter(record =>
      record.type === "Despesa" &&
      record.status === "Pago"
    )
    .reduce(
      (sum, record) =>
        sum + Number(record.amount || 0),
      0
    );

  const pending = records
    .filter(record =>
      record.status === "Pendente"
    )
    .length;

  return `
    <div class="stats">
      ${stat("Receitas recebidas", money(received))}
      ${stat("Despesas pagas", money(paid))}
      ${stat("Saldo registrado", money(received - paid))}
      ${stat("Pendências", pending)}
      ${stat("Lançamentos", records.length)}
    </div>
  `;
}

/* =========================================
   INDICADORES DE ESTOQUE
========================================= */

function stockSummary() {
  const records = S.stock || [];

  const lowStock = records.filter(record =>
    Number(record.quantity || 0) <=
    Number(record.minimum || 0)
  ).length;

  const totalItems = records.reduce(
    (sum, record) =>
      sum + Number(record.quantity || 0),
    0
  );

  const estimatedValue = records.reduce(
    (sum, record) =>
      sum +
      Number(record.quantity || 0) *
      Number(record.price || 0),
    0
  );

  return `
    <div class="stats">
      ${stat("Produtos", records.length)}
      ${stat("Unidades", totalItems)}
      ${stat("Estoque baixo", lowStock)}
      ${stat("Valor estimado", money(estimatedValue))}
    </div>
  `;
}

/* =========================================
   INDICADORES DE CRM
========================================= */

function salesSummary() {
  const records = S.sales || [];

  const won = records.filter(
    record => record.status === "Ganho"
  );

  const totalWon = won.reduce(
    (sum, record) =>
      sum + Number(record.amount || 0),
    0
  );

  const negotiation = records.filter(
    record => record.status === "Negociação"
  ).length;

  return `
    <div class="stats">
      ${stat("Oportunidades", records.length)}
      ${stat("Negociações", negotiation)}
      ${stat("Vendas ganhas", won.length)}
      ${stat("Valor ganho", money(totalWon))}
    </div>
  `;
}

   ENTERPRISE PLUS — SEGURANÇA E EXPORTAÇÃO
========================================= */
function canEditEnterpriseModule(page) {
  const hrModules = ["benefits", "sst", "training", "performance", "positions"];
  return hrModules.includes(page) ? isAdmin() : canManageBusiness();
}

function exportEnterpriseCSV(page) {
  const config = enterpriseModules[page];
  if (!config || !canEditEnterpriseModule(page)) return;
  const records = filterEnterpriseRecords(page, $("enterpriseSearch")?.value || "");
  const columns = config.fields;
  const csvCell = value => '"' + String(value ?? "")
    .replace(/^[=+@\-\t\r]/, "'$&")
    .replace(/"/g, '""') + '"';
  const lines = [
    columns.map(f => csvCell(f.label)).join(";"),
    ...records.map(r => columns.map(f => csvCell(r[f.name])).join(";"))
  ];
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")],
    {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `meu-negocio-${page}-${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Exportação CSV preparada.");
}

onAuthStateChanged(auth, async user => {
  S.user = user;

  if (!user) {
    S.companies = [];
    S.companyId = "";
    S.role = "";
    S.page = "dashboard";

    stopGlobal3D();

    $("authScreen").classList.remove("hidden");

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");

  if (global3DEnabled) {
    startGlobal3D();
  }

  try {
    await loadCompanies();
  } catch (error) {
    toast(errorText(error));

    $("view").innerHTML = panel(

          id="retryLoad"

        </button>
      `
    );

    $("retryLoad").onclick = () => {
      loadCompanies().catch(error => {
        toast(errorText(error));
      });
    };
  }
});

function v10SafeDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(String(d||''));}
function v10MonthShift(date,delta){const [y,m,d]=date.split('-').map(Number);const target=new Date(y,m-1+delta,1);const last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;}
function v10CSV(name,headers,rows){const safe=x=>{let s=String(x??'');if(/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv=[headers,...rows].map(row=>row.map(safe).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}

function v11SettleForm(reverse=false){
 if(!canManageBusiness())return toast('Sem permissão para movimentar o financeiro.');
 const options=S.finance.filter(r=>!r.archived&&(reverse?['Pago','Recebido'].includes(r.status):r.status==='Pendente'));
 if(!options.length)return toast(reverse?'Não há baixas para estornar.':'Não há lançamentos pendentes.');
 const choose=selectField('Lançamento','recordId',options.map(r=>({value:r.id,label:(r.description||'Sem descrição')+' — '+money(r.amount)+' — '+r.type})));
 const fields=choose+(reverse?
   inputField('Motivo do estorno','reason','','text',true):
   inputField('Data da liquidação','settledOn',today(),'date',true)+
   selectField('Forma de pagamento','method',['Pix','Transferência','Dinheiro','Cartão','Boleto','Outro'])+
   inputField('Referência do comprovante (opcional)','reference')+
   inputField('Observações','reason'));
 modal(reverse?'Estornar baixa financeira':'Confirmar pagamento / recebimento',fields,async data=>{
  if(!canManageBusiness())throw Error('Permissão insuficiente.');
  const ref=companyDoc('finance',data.recordId);
  const now=new Date().toISOString();
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw Error('Lançamento não encontrado.');
   const r=snap.data();
   if(r.archived)throw Error('Registro arquivado.');
   if(reverse&&!['Pago','Recebido'].includes(r.status))throw Error('A baixa já foi estornada ou alterada.');
   if(!reverse&&r.status!=='Pendente')throw Error('Este lançamento já foi liquidado ou cancelado.');
   const amount=Number(r.amount);
   if(!Number.isFinite(amount)||amount<=0)throw Error('Valor do lançamento inválido.');
   if(!reverse&&!v10SafeDate(data.settledOn))throw Error('Informe uma data válida.');
   const history=Array.isArray(r.settlementHistory)?r.settlementHistory:[];
   if(history.length>=150)throw Error('Limite de histórico atingido. Exporte os registros antes de prosseguir.');
   const event={id:crypto.randomUUID(),action:reverse?'Estorno':'Baixa',at:now,uid:S.user.uid,
    amount,method:reverse?'':data.method,reference:reverse?'':String(data.reference||'').slice(0,180),
    reason:String(data.reason||'').slice(0,400),previousStatus:r.status};
   tx.update(ref,{status:reverse?'Pendente':r.type==='Receita'?'Recebido':'Pago',
    paymentDate:reverse?'':data.settledOn,
    paymentMethod:reverse?'':data.method,
    paymentReference:reverse?'':String(data.reference||'').slice(0,180),
    settlementHistory:[...history,event],updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  });
  await reload();
  toast(reverse?'Baixa estornada.':'Baixa registrada.');
 });
}

function v12OrderPanel(){

 return panel('Pedidos integrados: vendas + estoque + financeiro',`
 <p>Registre a venda de um produto em estoque. A confirmação cria um pedido, desconta as unidades e gera uma conta a receber pendente, em uma única transação.</p>
 <div class="v11-actions"><button class="btn primary" id="v12NewOrder">Nova venda integrada</button><button class="btn" id="v12OrdersCSV">Exportar pedidos</button></div>

function v12OrderForm(){
 if(!canManageBusiness())return toast('Sem permissão.');
 const products=S.stock.filter(p=>!p.archived&&Number.isSafeInteger(Number(p.quantity))&&Number(p.quantity)>0);
 if(!products.length)return toast('Cadastre produtos com saldo positivo no estoque.');
 const fields=inputField('Nome do cliente','customer','','text',true)+
 inputField('E-mail do cliente (opcional)','email','','email')+
 selectField('Produto do estoque','productId',products.map(p=>({value:p.id,label:(p.name||'Produto')+' — saldo '+p.quantity+' — '+money(p.price)})))+
 inputField('Quantidade de unidades','quantity','1','number',true)+
 inputField('Preço unitário negociado (R$)','unitPrice','','number',true)+
 inputField('Vencimento da cobrança','dueDate',today(),'date',true)+
 inputField('Observações','notes');
 modal('Confirmar pedido integrado',fields,async d=>{
  if(!canManageBusiness())throw Error('Permissão insuficiente.');
  const qty=Number(d.quantity),unit=Number(d.unitPrice);
  if(!Number.isSafeInteger(qty)||qty<=0||qty>1000000)throw Error('Quantidade inválida.');
  if(!Number.isFinite(unit)||unit<=0||unit>100000000)throw Error('Preço inválido.');
  if(!v10SafeDate(d.dueDate))throw Error('Vencimento inválido.');
  const total=Math.round(qty*unit*100)/100;
  if(!Number.isFinite(total)||total<=0||total>1e12)throw Error('Total inválido.');
  const productRef=companyDoc('stock',d.productId);
  const saleRef=doc(companyCollection('sales'));
  const financeRef=companyDoc('finance','order-'+saleRef.id);
  const now=new Date().toISOString();
  await runTransaction(db,async tx=>{
   const snap=await tx.get(productRef);
   const financeSnap=await tx.get(financeRef);
   if(!snap.exists())throw Error('Produto não encontrado.');
   if(financeSnap.exists())throw Error('Pedido já processado.');
   const item=snap.data(),available=Number(item.quantity);
   if(item.archived||!Number.isSafeInteger(available)||available<qty)throw Error('Estoque insuficiente ou produto inativo.');
   const movements=Array.isArray(item.movements)?item.movements:[];
   if(movements.length>=300)throw Error('Histórico de estoque cheio; exporte antes de prosseguir.');
   const movement={id:saleRef.id,type:'Saída',label:'Venda integrada',quantity:qty,note:'Pedido '+saleRef.id,date:now,uid:S.user.uid};
   tx.update(productRef,{quantity:available-qty,movements:[...movements,movement],updatedAt:serverTimestamp(),updatedBy:S.user.uid});
   tx.set(saleRef,{name:String(d.customer).trim().slice(0,160),email:String(d.email||'').slice(0,160),
    product:String(item.name||'Produto').slice(0,160),productId:d.productId,orderQuantity:qty,
    unitPrice:unit,amount:total,status:'Ganho',orderKind:'stock-sale',orderNumber:saleRef.id,
    financeId:financeRef.id,notes:String(d.notes||'').slice(0,500),createdAt:serverTimestamp(),createdBy:S.user.uid});
   tx.set(financeRef,{description:'Venda '+saleRef.id+' — '+String(d.customer).slice(0,100),
    type:'Receita',category:'Vendas integradas',amount:total,date:today(),dueDate:d.dueDate,
    status:'Pendente',saleId:saleRef.id,orderKind:'stock-sale',createdAt:serverTimestamp(),createdBy:S.user.uid});
  });
  await reload();toast('Pedido confirmado, estoque atualizado e cobrança criada.');
 });
}

document.head.appendChild(v32Style);
function v32Number(x){
 if(typeof x==='number')return Number.isFinite(x)?x:NaN;
 const s=String(x??'').trim().replace(/[R$\s]/g,'');
 if(!s)return NaN;
 const normalized=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;
 const n=Number(normalized);return Number.isFinite(n)?n:NaN;
}
function v32Date(value){
 if(!value)return '';
 if(value&&typeof value.toDate==='function')return v32Date(value.toDate());
 if(value instanceof Date)return Number.isNaN(value.getTime())?'':value.toISOString().slice(0,10);
 const s=String(value).trim();
 const br=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
 if(br)return `${br[3]}-${br[2]}-${br[1]}`;
 return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):'';
}
function v32CashRecords(){

  const type=String(r.type||'').trim().toLowerCase();
  const status=String(r.status||'').trim().toLowerCase();
  const amount=v32Number(r.amount);
  return {...r,_type:type,_status:status,_amount:amount,_due:v32Date(r.dueDate||r.date),_paid:v32Date(r.paymentDate||r.date)};
 });
}
function v32Money(value){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value)}
function v32Download(rows){
 const cols=['Descrição','Tipo','Categoria','Valor','Status','Vencimento','Liquidação','Conta','Centro de custo'];
 const csvCell=v=>{
  let s=String(v??'');
  if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
 };
 const lines=[cols,...rows.map(r=>[r.description,r.type,r.category,r.amount,r.status,r.dueDate||r.date,r.paymentDate,r.account,r.costCenter])];
 const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='financeiro-relatorio-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function v32FinancialPanel(){
 if(S.page!=='finance')return;
 const view=$('view');if(!view)return;
 view.querySelector('#v32-financial-center')?.remove();
 const section=document.createElement('section');
 section.id='v32-financial-center';section.className='v32-fin';
 section.innerHTML=`<h3>◈ Centro de inteligência financeira</h3>
 <p>Fluxo realizado, contas a pagar e receber, vencimentos, categorias e projeção simples — com dados registrados na empresa.</p>
 <div class="v32-controls">
 <label>Período <select id="v32-period"><option value="30">30 dias</option><option value="90" selected>90 dias</option><option value="180">180 dias</option><option value="365">365 dias</option></select></label>
 <label>Conta <select id="v32-account"><option value="">Todas as contas</option></select></label>
 <button type="button" id="v32-export">Exportar CSV</button>
 </div><div id="v32-output" aria-live="polite"></div>`;
 view.prepend(section);
 const all=v32CashRecords();
 const accounts=[...new Set(all.map(r=>String(r.account||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const select=section.querySelector('#v32-account');
 accounts.forEach((account,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=account;select.appendChild(o)});
 function draw(){
  const days=Number(section.querySelector('#v32-period').value);
  const accountIndex=select.value;
  const filtered=all.filter(r=>accountIndex===''||String(r.account||'').trim()===accounts[Number(accountIndex)]);
  const todayKey=new Date().toISOString().slice(0,10);
  const from=new Date();from.setDate(from.getDate()-days);const fromKey=from.toISOString().slice(0,10);
  const valid=filtered.filter(r=>Number.isFinite(r._amount)&&r._amount>0&&['receita','despesa'].includes(r._type));
  const pending=valid.filter(r=>r._status==='pendente');
  const settled=valid.filter(r=>(r._type==='receita'&&r._status==='recebido')||(r._type==='despesa'&&r._status==='pago'));

function v33Money(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n)}

function v33Scope(){return 'mnp-v33-budget-'+String(S.companyId||'none')}

function v33IsSettled(r){return r._type==='receita'?r._status==='recebido':r._type==='despesa'&&r._status==='pago'}
function v33MonthRows(month){

function v34RecordId(r){

function v34Suggest(tx,records){
 const targetDate=Date.parse(tx.date+'T12:00:00');
 return records.map((r,i)=>{
  const expected=(r._type==='despesa'?-r._amount:r._amount);
  if(!Number.isFinite(expected)||Math.abs(expected-tx.amount)>0.005)return null;
  const recordDate=v32Date(r.paymentDate)||v32Date(r.dueDate)||v32Date(r.date);
  const diff=recordDate?Math.abs((Date.parse(recordDate+'T12:00:00')-targetDate)/86400000):999;
  if(diff>7)return null;
  const words=x=>new Set(String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(w=>w.length>2));
  const a=words(tx.desc),b=words(r.description);
  const overlap=[...a].filter(w=>b.has(w)).length;
  return {i,r,score:Math.max(0,7-diff)+overlap*2,diff};
 }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,15);
}

function v33ParseCSV(text){
 const out=[],row=[];let cur='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"'){if(quoted&&text[i+1]==='"'){cur+='"';i++}else quoted=!quoted}
  else if(!quoted&&(ch===';'||ch===',')){row.push(cur);cur=''}
  else if(!quoted&&(ch==='\n'||ch==='\r')){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))out.push([...row]);row.length=0}
  else cur+=ch;
 }
 if(quoted)throw Error('CSV com aspas não fechadas.');
 row.push(cur);if(row.some(x=>x.trim()))out.push([...row]);
 return out;
}
function v33ParseAmount(s){
 const t=String(s||'').replace(/[R$\s]/g,'').trim();
 if(!t)return NaN;
 if(t.includes(',')&&t.includes('.'))return Number(t.replace(/\./g,'').replace(',','.'));
 if(t.includes(','))return Number(t.replace(',','.'));
 return Number(t);
}
function v33Import(text){
 const rows=v33ParseCSV(text.replace(/^\uFEFF/,''));
 if(rows.length<2)throw Error('CSV sem movimentações.');
 const names=rows[0].map(x=>x.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
 const field=(aliases)=>names.findIndex(n=>aliases.includes(n));
 const di=field(['data','date','data movimento','data movimentacao','data da transacao']);
 const ai=field(['valor','amount','valor (r$)','valor r$']);
 const ti=field(['descricao','description','historico','memo','detalhes']);
 const idi=field(['id','id transacao','transaction id','identificador']);
 if(di<0||ai<0)throw Error('CSV precisa das colunas Data e Valor.');
 const list=[],seen=new Set();
 for(const cells of rows.slice(1,5001)){
  const date=v32Date(cells[di]),amount=v33ParseAmount(cells[ai]);
  if(!date||!Number.isFinite(amount)||amount===0)continue;
  const desc=String(ti>=0?cells[ti]||'':'').slice(0,180);
  const id=String(idi>=0?cells[idi]||'':'').slice(0,100);
  const key=[date,amount.toFixed(2),id||desc].join('|');
  if(seen.has(key))continue;seen.add(key);
  list.push({date,amount,desc,id,key});
 }
 if(!list.length)throw Error('Nenhuma movimentação válida. Use data AAAA-MM-DD ou DD/MM/AAAA e valor com sinal.');
 return list;
}

 const blob=new Blob(['\uFEFF'+lines.map(x=>x.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});

function v35Panel(){
 if(S.page!=='finance')return;
 const view=$('view');if(!view)return;view.querySelector('#v35-area')?.remove();
 const el=document.createElement('section');el.className='v35-area';el.id='v35-area';

  const factors=scenario==='conservative'?[.85,1.1]:scenario==='optimistic'?[1.15,.95]:[1,1];
  const budgets=v33LoadBudget();const data=[];
  for(let i=0;i<12;i++){

   data.push({month,...r,plannedIncome,plannedExpense,scenarioIncome:plannedIncome*factors[0],scenarioExpense:plannedExpense*factors[1]});

 el.querySelector('#v35-backup').onclick=()=>{

  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-planejamento-'+v33IsoLocal(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

   for(const [k,v] of Object.entries(obj.budgets)){
    if(k==='_categoryLimits'){if(!v||typeof v!=='object'||Array.isArray(v)||Object.entries(v).some(([name,n])=>name.length>60||!Number.isFinite(n)||n<0||n>1e12))throw Error('Limites inválidos.');continue}
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(k)||!v||typeof v!=='object'||!Number.isFinite(v.income)||!Number.isFinite(v.expense)||v.income<0||v.expense<0||v.income>1e12||v.expense>1e12)throw Error('Orçamento inválido.');

  }catch(err){alert('Não foi possível restaurar: '+err.message)}finally{e.target.value=''}

function v38CheckBudget(b){

function v38DateAdd(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return v33IsoLocal(x)}
function v38CashForecast(start,days,opening,inFactor,outFactor){
 const end=v38DateAdd(start,days-1),all=v32CashRecords(),events=new Map();let undated=0;
 for(const r of all){if(!['receita','despesa'].includes(r._type)||!Number.isFinite(r._amount)||r._amount<=0||v33IsSettled(r))continue;
  const date=v32Date(r.dueDate)||r._due;
  if(!date){undated++;continue}if(date<start||date>end)continue;
  const e=events.get(date)||{income:0,expense:0};if(r._type==='receita')e.income+=r._amount*inFactor;else e.expense+=r._amount*outFactor;events.set(date,e);
 }
 let balance=opening;const rows=[];for(let i=0;i<days;i++){const date=v38DateAdd(start,i),e=events.get(date)||{income:0,expense:0};balance+=e.income-e.expense;rows.push({date,...e,balance})}
 return {rows,undated,min:Math.min(opening,...rows.map(r=>r.balance)),ending:balance};
}

/* V39 — recorrências e projeção probabilística (somente simulação).
   Dados de recorrência locais, não criam contas reais nem pagamentos. */
const v39Css=document.createElement('style');
v39Css.textContent=`.v39-area{padding:16px;margin:16px 0;border:1px solid #4c8ba7;border-radius:16px;background:#10293b;color:#f1fbff}.v39-area input,.v39-area select,.v39-area button{min-height:43px;padding:9px;border-radius:9px;background:#1b3e53;color:white;border:1px solid #59889c;max-width:100%}.v39-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.v39-row label{display:flex;flex:1 1 140px;flex-direction:column;gap:5px}.v39-area button{cursor:pointer}.v39-area .v39-note{font-size:.85rem;color:#b7d0dd}.v39-area .v39-scroll{overflow:auto}.v39-area table{width:100%;min-width:570px;border-collapse:collapse}.v39-area td,.v39-area th{padding:8px;border-bottom:1px solid #416378;text-align:left}`;
document.head.appendChild(v39Css);
function v39Key(){return 'mnp-v39-recurring-'+String(S.companyId||'none')}
function v39Read(){try{const a=JSON.parse(localStorage.getItem(v39Key())||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x==='object').slice(0,300):[]}catch{return []}}
function v39Store(a){localStorage.setItem(v39Key(),JSON.stringify(a))}
function v39RecurringForecast(start,days,opening,incFactor,outFactor,recurring){
 const base=v38CashForecast(start,days,opening,incFactor,outFactor);
 const rows=base.rows.map(x=>({...x}));let balance=opening;
 for(const row of rows){
  const day=Number(row.date.slice(8,10)),ym=row.date.slice(0,7);
  const last=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate();
  for(const r of recurring){
   if(row.date<r.start||r.end&&row.date>r.end)continue;
   if(day!==Math.min(Number(r.day),last))continue;
   const amount=Number(r.amount)*(r.type==='receita'?incFactor:outFactor)*(Number(r.probability)/100);
   if(r.type==='receita')row.income+=amount;else row.expense+=amount;
  }
  balance+=row.income-row.expense;row.balance=balance;
 }
 return {rows,ending:balance,min:Math.min(opening,...rows.map(r=>r.balance)),undated:base.undated};
}
function v39Panel(){

 root.innerHTML=`<h3>◈ Projeção avançada — recorrências e probabilidade</h3>
 <p class="v39-note">Simule receitas e despesas mensais recorrentes e probabilidade de recebimento. Não cria lançamentos financeiros. Dados de recorrência são armazenados apenas neste dispositivo.</p>
 <div class="v39-row">
 <label>Descrição<input id="v39-desc" maxlength="90" placeholder="Aluguel, assinatura, mensalidade"></label>

 <label>Dia do mês<input id="v39-day" type="number" min="1" max="31" value="5"></label>
 <label>Probabilidade (%)<input id="v39-prob" type="number" min="0" max="100" value="100"></label>
 <label>Início<input id="v39-start" type="date"></label>

 <div id="v39-list" class="v39-scroll"></div>
 <div class="v39-row"><label>Saldo inicial (R$)<input id="v39-opening" type="number" step="0.01" value="0"></label>
 <label>Período<select id="v39-days"><option>30</option><option>60</option><option selected>90</option><option>180</option><option>365</option></select></label>
 <label>Fator de receitas (%)<input id="v39-inc" type="number" min="0" max="300" value="100"></label>
 <label>Fator de despesas (%)<input id="v39-out" type="number" min="0" max="300" value="100"></label>

 <div id="v39-result" aria-live="polite"></div>`;
 view.prepend(root);
 root.querySelector('#v39-start').value=v33IsoLocal(new Date());
 let latest=null;
 function list(){
  const data=v39Read();
  root.querySelector('#v39-list').innerHTML=`<table><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Dia</th><th>Prob.</th><th>Ação</th></tr></thead><tbody>${data.map(r=>`<tr><td>${esc(r.desc)}</td><td>${esc(r.type)}</td><td>${v33Money(r.amount)}</td><td>${r.day}</td><td>${r.probability}%</td><td><button type="button" data-remove="${esc(r.id)}">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma recorrência simulada.</td></tr>'}</tbody></table>`;
  root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{v39Store(v39Read().filter(x=>x.id!==b.dataset.remove));list();calculate()});
 }
 function calculate(){
  const opening=Number(root.querySelector('#v39-opening').value),days=Number(root.querySelector('#v39-days').value),inc=Number(root.querySelector('#v39-inc').value),out=Number(root.querySelector('#v39-out').value);
  if(![opening,days,inc,out].every(Number.isFinite)||inc<0||out<0||inc>300||out>300)return;
  const start=v33IsoLocal(new Date());
  latest=v39RecurringForecast(start,days,opening,inc/100,out/100,v39Read());
  root.querySelector('#v39-result').innerHTML=`<p><strong>Saldo final projetado: ${v33Money(latest.ending)}</strong> · Menor saldo: ${v33Money(latest.min)} · Dias negativos: ${latest.rows.filter(x=>x.balance<0).length}</p>
  <p class="v39-note">A probabilidade representa valor esperado, não previsão garantida. Não contabilize uma mesma recorrência duas vezes: se já estiver cadastrada como pendência, não a adicione aqui.</p>
  <div class="v39-scroll"><table><thead><tr><th>Data</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr></thead><tbody>${latest.rows.map(r=>`<tr><td>${r.date}</td><td>${v33Money(r.income)}</td><td>${v33Money(r.expense)}</td><td>${v33Money(r.balance)}</td></tr>`).join('')}</tbody></table></div>`;
 }
 root.querySelector('#v39-add').onclick=()=>{
  const desc=root.querySelector('#v39-desc').value.trim(),type=root.querySelector('#v39-type').value,amount=Number(root.querySelector('#v39-amount').value),day=Number(root.querySelector('#v39-day').value),probability=Number(root.querySelector('#v39-prob').value),start=root.querySelector('#v39-start').value,end=root.querySelector('#v39-end').value;
  if(!desc||!Number.isFinite(amount)||amount<=0||amount>1e12||!Number.isInteger(day)||day<1||day>31||!Number.isFinite(probability)||probability<0||probability>100||!start||end&&end<start){alert('Confira os campos da recorrência.');return}
  const all=v39Read();if(all.length>=300){alert('Limite de 300 simulações.');return}
  all.push({id:crypto.randomUUID(),desc,type,amount,day,probability,start,end});try{v39Store(all);list();calculate()}catch{alert('Falha ao salvar no dispositivo.')}
 };
 root.querySelector('#v39-run').onclick=calculate;
 root.querySelector('#v39-csv').onclick=()=>{if(!latest)return;v35CsvDownload('projecao-avancada.csv',[['Data','Entradas','Saídas','Saldo'],...latest.rows.map(r=>[r.date,r.income.toFixed(2),r.expense.toFixed(2),r.balance.toFixed(2)])])};
 list();calculate();
}

function v52csv(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n')}

function v52Finance(){
 const rows=S.finance||[],today=v52date();let month=today.slice(0,7),kind='',state='';
 const el=document.createElement('section');el.id='v52Finance';el.innerHTML=`<div class="panel"><h2>Central financeira V52</h2><p class="v52-note">Indicadores de caixa incluem apenas receitas recebidas e despesas pagas. Valores pendentes não entram no saldo realizado.</p><div id="v52Totals" class="v52-grid"></div><div class="v52-controls"><label>Competência<input id="v52Month" type="month" value="${month}"></label><label>Tipo<select id="v52Type"><option value="">Todos</option><option>Receita</option><option>Despesa</option></select></label><label>Situação<select id="v52Status"><option value="">Todas</option><option>Pendente</option><option>Pago</option><option>Recebido</option><option>Cancelado</option></select></label></div><div class="v52-controls"><button class="btn" id="v52Export">Exportar CSV filtrado</button><button class="btn" id="v52Pending">Ver vencidos</button><button class="btn" id="v52Backup">Backup financeiro JSON</button></div><div class="v52-table" id="v52List"></div></div>`;
 $('view').appendChild(el);
 const matches=()=>rows.filter(r=>(!month||String(r.date||r.dueDate||'').slice(0,7)===month)&&(!kind||r.type===kind)&&(!state||r.status===state));
 const draw=()=>{
  const filtered=matches(),sum=(type,status)=>filtered.filter(r=>r.type===type&&r.status===status).reduce((a,r)=>a+v52cents(r.amount),0);
  const rec=sum('Receita','Recebido'),paid=sum('Despesa','Pago'),toReceive=sum('Receita','Pendente'),toPay=sum('Despesa','Pendente');
  const overdue=filtered.filter(r=>r.status==='Pendente'&&v52validDate(r.dueDate||r.date)&&(r.dueDate||r.date)<today);
  el.querySelector('#v52Totals').innerHTML=v52Card('Recebido',rec)+v52Card('Pago',paid)+v52Card('Saldo realizado',rec-paid)+v52Card('A receber',toReceive)+v52Card('A pagar',toPay)+`<div class="v52-card"><small>Vencidos</small><strong class="v52-warn">${overdue.length}</strong><small>Conferir vencimentos</small></div>`;
  el.querySelector('#v52List').innerHTML=`<table><thead><tr><th>Descrição</th><th>Data</th><th>Vencimento</th><th>Tipo</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${filtered.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(r=>`<tr><td>${esc(r.description)}</td><td>${esc(r.date||'—')}</td><td>${esc(r.dueDate||'—')}</td><td>${esc(r.type)}</td><td>${money(r.amount)}</td><td>${esc(r.status)}</td><td><button class="btn" data-v52-edit="${esc(r.id)}">Editar</button> <button class="btn" data-v52-close="${esc(r.id)}">${r.status==='Pendente'?'Liquidar':'Reabrir'}</button> <button class="btn" data-v52-delete="${esc(r.id)}">Excluir</button></td></tr>`).join('')}</tbody></table>${filtered.length?'':'<p>Nenhum lançamento encontrado.</p>'}`;
  el.querySelectorAll('[data-v52-edit]').forEach(b=>b.onclick=()=>enterpriseModuleForm('finance',b.dataset.v52Edit));
  el.querySelectorAll('[data-v52-close]').forEach(b=>b.onclick=async()=>{
   const r=rows.find(x=>x.id===b.dataset.v52Close);if(!r)return;
   if(r.status==='Cancelado'){toast('Registro cancelado. Edite para alterar.');return}

   b.disabled=true;try{await saveRecord('finance',{status:next,paymentDate:next==='Pendente'?'':v52date()},r.id);await reload();toast('Situação atualizada.')}catch(e){toast(errorText(e))}finally{b.disabled=false}
  });
  el.querySelectorAll('[data-v52-delete]').forEach(b=>b.onclick=async()=>{
   const r=rows.find(x=>x.id===b.dataset.v52Delete);if(!r||!canManageBusiness())return;

   b.disabled=true;try{if(!canManageBusiness())throw Error('Sem permissão para excluir lançamentos.');await deleteDoc(companyDoc('finance',r.id));await reload();toast('Lançamento excluído.')}catch(e){toast(errorText(e))}finally{b.disabled=false}
