/* V53 — backup verificado e recuperação conservadora. */
const v53BackupCollections=['finance','stock','sales','purchases','projects','departments','documents','support'];
const v53AdminCollections=['benefits','sst','training','performance','positions','employees','leaves','attendance','vacancies','candidates'];
function v53AllowedCollections(){return isSecurityAdmin()?[...v53BackupCollections,...v53AdminCollections]:[...v53BackupCollections]}
function v53NameOk(name){return v53AllowedCollections().includes(name)}
const v53MaxBytes=8*1024*1024;
const v53Encode=o=>JSON.stringify(o);
async function v53Hash(payload){const bytes=new TextEncoder().encode(payload);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
function v53Clean(value){if(value==null||['string','number','boolean'].includes(typeof value))return value;if(Array.isArray(value))return value.map(v53Clean);if(typeof value==='object'){if(typeof value.toDate==='function')return {__mnp_timestamp:value.toDate().toISOString()};const o={};for(const [k,v] of Object.entries(value)){if(k==='__proto__'||k==='constructor'||k==='prototype'||typeof v==='function'||v===undefined)continue;o[k]=v53Clean(v)}return o}return null}
function v53RestoreValue(v){if(Array.isArray(v))return v.map(v53RestoreValue);if(v&&typeof v==='object'){if(Object.keys(v).length===1&&typeof v.__mnp_timestamp==='string'){const d=new Date(v.__mnp_timestamp);if(!Number.isFinite(d.getTime()))throw Error('Data de registro inválida.');return d}const o={};for(const [k,x] of Object.entries(v)){if(['__proto__','prototype','constructor'].includes(k))throw Error('Chave inválida.');o[k]=v53RestoreValue(x)}return o}return v}
function v53Backup(){
 const el=document.createElement('section');el.className='panel';el.id='v53BackupPanel';el.innerHTML=`<h2>◈ Backup e recuperação V54</h2><p>Exportação atualizada diretamente do Firestore, com SHA-256 e conferência de integridade (o hash não comprova autoria). A recuperação <strong>somente adiciona documentos ausentes</strong>, nunca apaga ou substitui registros existentes.</p><div class="v52-controls"><button class="btn" id="v53Export" type="button">Gerar backup verificado</button><label>Conferir arquivo JSON<input id="v53File" type="file" accept=".json,application/json"></label><button class="btn" id="v53Import" type="button" disabled>Recuperar documentos ausentes</button></div><p id="v53Message" role="status" style="overflow-wrap:anywhere"></p><div id="v53Preview" class="v52-table"></div><p class="v52-note">Inclui até 13 coleções: financeiro, estoque, vendas, compras, projetos, departamentos, documentos, atendimento e, apenas para administradores, benefícios, SST, treinamentos, desempenho e cargos. Não inclui autenticação, membros, folha de pagamento, funcionários, frequência, candidatos nem arquivos do Firebase Storage. Guarde o arquivo em local privado; ele pode conter dados pessoais.</p>`;
 $('view').appendChild(el);
 const msg=el.querySelector('#v53Message'),button=el.querySelector('#v53Import');let pending=null;
 el.querySelector('#v53Export').onclick=async()=>{
  const btn=el.querySelector('#v53Export');btn.disabled=true;msg.textContent='Lendo registros atualizados do Firebase...';
  try{
   if(!isSecurityAdmin()||!S.user?.uid||!S.companyId)throw Error('Acesso administrativo necessário.');
   const companyId=S.companyId,items={};let count=0;
   for(const name of v53AllowedCollections()){const snap=await getDocs(companyCollection(name));items[name]=snap.docs.map(d=>({id:d.id,data:v53Clean(d.data())}));count+=snap.size;if(count>12000)throw Error('Limite de 12 mil documentos excedido.');}
   if(S.companyId!==companyId)throw Error('Empresa mudou durante a exportação.');
   const payload={schema:'mnp-backup-v53',companyId,createdAt:new Date().toISOString(),collections:items};
   const canonical=v53Encode(payload);const checksum=await v53Hash(canonical);
   const output=JSON.stringify({payload,checksum:{algorithm:'SHA-256',value:checksum}},null,2);
   if(new Blob([output]).size>v53MaxBytes)throw Error('Backup excedeu 8 MB. Use exportações por módulo.');
   v52Download(output,'backup-verificado-'+companyId+'-'+v52date()+'.json','application/json');
   msg.textContent='Backup gerado: '+count+' registros em '+Object.keys(items).length+' coleções. SHA-256: '+checksum;
  }catch(e){msg.textContent='Falha ao exportar: '+errorText(e)}finally{btn.disabled=false}
 };
 el.querySelector('#v53File').onchange=async e=>{
  pending=null;button.disabled=true;el.querySelector('#v53Preview').replaceChildren();const file=e.target.files?.[0];if(!file)return;
  try{
   if(!isSecurityAdmin())throw Error('Acesso administrativo necessário.');
   if(file.size>v53MaxBytes)throw Error('Arquivo maior que 8 MB.');
   const parsed=JSON.parse(await file.text());const payload=parsed.payload;
   if(payload?.schema!=='mnp-backup-v53'||payload.companyId!==S.companyId)throw Error('Backup de outra empresa ou formato incompatível.');
   if(parsed.checksum?.algorithm!=='SHA-256'||!(/^[0-9a-f]{64}$/.test(parsed.checksum?.value||'')))throw Error('Checksum ausente ou inválido.');
   if(await v53Hash(v53Encode(payload))!==parsed.checksum.value)throw Error('Integridade inválida: arquivo modificado ou corrompido.');
   if(!payload.collections||typeof payload.collections!=='object'||Array.isArray(payload.collections)||Object.keys(payload.collections).some(k=>!v53NameOk(k)))throw Error('Coleção não autorizada no backup.');
   const missing=[];let existing=0,scanned=0;
   for(const [name,entries] of Object.entries(payload.collections)){
    if(!Array.isArray(entries)||entries.length>12000)throw Error('Lista de documentos inválida.');
    const seen=new Set();const current=await getDocs(companyCollection(name));const ids=new Set(current.docs.map(d=>d.id));
    for(const entry of entries){
     if(!entry||typeof entry.id!=='string'||!entry.id||entry.id.length>500||entry.id.includes('/')||seen.has(entry.id)||!entry.data||typeof entry.data!=='object'||Array.isArray(entry.data))throw Error('Documento inválido ou duplicado no backup.');
     seen.add(entry.id);scanned++;if(scanned>12000)throw Error('Muitos documentos.');
     if(ids.has(entry.id))existing++;else missing.push({name,id:entry.id,data:v53RestoreValue(entry.data)});
    }
   }
   pending={companyId:S.companyId,missing,checksum:parsed.checksum.value};button.disabled=missing.length===0;
   msg.textContent=`Arquivo íntegro. ${scanned} registros conferidos; ${existing} já existem; ${missing.length} ausentes. Nenhum dado foi alterado.`;
   const table=document.createElement('table');const body=document.createElement('tbody');for(const name of Object.keys(payload.collections)){const tr=document.createElement('tr');const a=document.createElement('td'),b=document.createElement('td');a.textContent=name;b.textContent=String(missing.filter(x=>x.name===name).length)+' ausentes';tr.append(a,b);body.append(tr)}table.append(body);el.querySelector('#v53Preview').append(table);
  }catch(err){msg.textContent='Arquivo rejeitado: '+String(err.message||err)}
 };
 button.onclick=async()=>{
  if(!pending||pending.companyId!==S.companyId||!isSecurityAdmin())return;
  if(!confirm(`Recuperar até ${pending.missing.length} documentos ausentes nesta empresa? Documentos existentes não serão alterados. A operação pode ser parcialmente concluída se houver falha.`))return;
  button.disabled=true;msg.textContent='Recuperando documentos ausentes...';let restored=0,skipped=0;
  try{
   for(const item of pending.missing){
    if(S.companyId!==pending.companyId || !isSecurityAdmin() || !S.user?.uid)throw Error('Sessão ou empresa alterada; operação interrompida.');
    const ref=companyDoc(item.name,item.id);
    const outcome=await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(snap.exists())return 'existing';tx.set(ref,item.data);return 'added'});if(outcome==='added')restored++;else skipped++;
   }
   msg.textContent=`Recuperação concluída: ${restored} documentos adicionados; ${skipped} já existiam. Nenhum registro anterior foi substituído.`;
   pending=null;await reload();
  }catch(e){msg.textContent=`Recuperação interrompida após ${restored} inclusões. Confira os registros antes de tentar novamente. ${errorText(e)}`}
 };
}
function v52Backup(){v53Backup()}
const v52OriginalRender=render;
render=function(){v52OriginalRender();if(!S.companyId)return;if(S.page==='finance'&&canManageBusiness())v52Finance();if(S.page==='stock'&&canManageBusiness())v52Stock();if(S.page==='sales'&&canManageBusiness())v52Sales();if(S.page==='dashboard'&&isSecurityAdmin())v52Backup()};
/* Validação adicional de lançamentos antes de enviar ao Firestore */
const v52OriginalSaveRecord=saveRecord;
saveRecord=async function(name,data,id=null){
 if(name==='finance'){
  const amount=Number(data.amount);if('amount' in data&&(!Number.isFinite(amount)||amount<=0||amount>1e12))throw Error('Valor financeiro deve ser maior que zero e válido.');
  if(data.type&& !['Receita','Despesa'].includes(data.type))throw Error('Tipo financeiro inválido.');
  if(data.status&& !['Pendente','Pago','Recebido','Cancelado'].includes(data.status))throw Error('Situação financeira inválida.');
  if(data.date&&!v52validDate(data.date))throw Error('Data inválida.');
  if(data.dueDate&&!v52validDate(data.dueDate))throw Error('Vencimento inválido.');
 }
 if(name==='stock'){
  for(const field of ['quantity','minimum','cost'])if(field in data&&(!Number.isFinite(Number(data[field]))||Number(data[field])<0))throw Error(`Valor inválido: ${field}`);
 }
 return v52OriginalSaveRecord(name,data,id);
};


/* V55: conclusão transacional de vendas, estoque e financeiro.
   Ação explícita: vendas antigas não são movimentadas retroativamente. */
function v55IntegrationPanel(){
 const view=$('view');if(!view||document.getElementById('v55Integration'))return;
 const section=document.createElement('section');section.className='panel';section.id='v55Integration';
 section.innerHTML=`<h2>◈ Integração V55.1 — Vendas + Estoque + Financeiro</h2>
 <p>Conclua uma venda para registrar a receita e baixar o estoque em uma única transação.
 A operação é idempotente: a mesma venda não será integrada duas vezes. A integração cria também um registro de auditoria.</p>
 <form id="v55Form" class="v52-controls">
 <label>Venda<select name="sale" required></select></label>
 <label>Produto do estoque<select name="stock" required></select></label>
 <label>Quantidade<input name="quantity" type="number" min="1" step="1" value="1" required></label>
 <label>Recebimento<select name="payment"><option value="Pendente">Pendente</option><option value="Recebido">Recebido</option></select></label>
 <button type="submit" class="btn primary">Concluir venda integrada</button>
 </form><p id="v55Feedback" role="status"></p>
 <p class="v52-note">Use para vendas de produtos cadastrados no estoque. Serviços e vendas antigas não são movimentados automaticamente. Não substitui emissão fiscal.</p>`;
 view.append(section);
 const form=section.querySelector('form');
 const sales=(S.sales||[]).filter(x=>!x.integrationV55&&x.status!=='Perdido'&&Number.isFinite(Number(x.amount))&&Number(x.amount)>0);
 const products=(S.stock||[]).filter(x=>Number.isSafeInteger(Number(x.quantity))&&Number(x.quantity)>0);
 form.elements.sale.innerHTML='<option value="">Selecione a venda</option>'+sales.map(x=>`<option value="${esc(x.id)}">${esc(x.name||'Cliente')} — ${esc(x.product||'Venda')} — R$ ${esc(String(x.amount||0))}</option>`).join('');
 form.elements.stock.innerHTML='<option value="">Selecione o produto</option>'+products.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(String(x.quantity))} disponíveis)</option>`).join('');
 form.onsubmit=async e=>{
  e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
  const message=section.querySelector('#v55Feedback');
  try{
   if(!canManageBusiness()||!S.user?.uid||!S.companyId)throw Error('Sem permissão empresarial.');
   const companyId=S.companyId,uid=S.user.uid,role=S.role;
   const saleId=form.elements.sale.value,stockId=form.elements.stock.value;
   const qty=Number(form.elements.quantity.value),payment=form.elements.payment.value;
   if(!saleId||!stockId||!Number.isSafeInteger(qty)||qty<1||qty>1000000)throw Error('Selecione venda, produto e quantidade válida.');
   if(!['Pendente','Recebido'].includes(payment))throw Error('Situação inválida.');
   if(!confirm('Confirmar venda? A quantidade será descontada do estoque e a receita será criada no financeiro.'))return;
   if(S.companyId!==companyId||S.user?.uid!==uid||S.role!==role)throw Error('Sessão ou empresa alterada.');
   const saleRef=doc(db,'companies',companyId,'sales',saleId);
   const stockRef=doc(db,'companies',companyId,'stock',stockId);
   const financeRef=doc(db,'companies',companyId,'finance','sale-v55-'+saleId);
   const auditRef=doc(db,'companies',companyId,'audit','sale-v55-'+saleId);
   const outcome=await runTransaction(db,async tx=>{
    const [saleSnap,stockSnap,financeSnap,auditSnap]=await Promise.all([tx.get(saleRef),tx.get(stockRef),tx.get(financeRef),tx.get(auditRef)]);
    if(!saleSnap.exists()||!stockSnap.exists())throw Error('Venda ou produto não encontrado.');
    const sale=saleSnap.data(),stock=stockSnap.data();
    if(sale.integrationV55||financeSnap.exists()||auditSnap.exists())throw Error('Venda já integrada: nenhuma movimentação adicional realizada.');
    if(sale.status==='Perdido')throw Error('Venda perdida não pode ser concluída.');
    const amount=Number(sale.amount),available=Number(stock.quantity);
    if(!Number.isFinite(amount)||amount<=0||amount>1e12)throw Error('Valor da venda inválido.');
    if(!Number.isSafeInteger(available)||available<qty)throw Error('Estoque insuficiente.');
    const movements=Array.isArray(stock.movements)?stock.movements:[];
    if(movements.length>=300)throw Error('Limite de movimentos atingido para este produto.');
    const now=new Date().toISOString(),today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    tx.update(stockRef,{quantity:available-qty,movements:[...movements,{id:'sale-v55-'+saleId,type:'Saída',label:'Venda integrada',quantity:qty,note:'Venda '+saleId,date:now,uid}],updatedAt:serverTimestamp(),updatedBy:uid});
    tx.update(saleRef,{status:'Ganho',integrationV55:{stockId,quantity:qty,financeId:financeRef.id,at:now,by:uid},updatedAt:serverTimestamp(),updatedBy:uid});
    tx.set(auditRef,{action:'sale_integrated',saleId,stockId,financeId:financeRef.id,quantity:qty,stockBefore:available,stockAfter:available-qty,amount,payment,at:serverTimestamp(),actorUid:uid,companyId});
    tx.set(financeRef,{description:'Venda integrada — '+String(sale.name||'Cliente').slice(0,120),type:'Receita',category:'Vendas',amount,date:today,dueDate:today,status:payment,source:'sales-v55',sourceSaleId:saleId,createdAt:serverTimestamp(),createdBy:uid});
    return {amount,qty};
   });
   if(S.companyId!==companyId||S.user?.uid!==uid)throw Error('Operação concluída na empresa anterior. Atualize a tela para consultar.');
   message.textContent=`Venda integrada: ${outcome.qty} unidade(s) baixada(s) e receita de R$ ${outcome.amount.toFixed(2)} registrada.`;
   await reload();toast('Venda, estoque e financeiro integrados.');
  }catch(err){message.textContent=errorText(err);toast(errorText(err))}
  finally{button.disabled=false}
 };
}
const v55PreviousRender=render;
render=function(){v55PreviousRender();if(false&&S.companyId&&S.page==='sales'&&canManageBusiness())v55IntegrationPanel()};

/* V61 — Consolidação: trilha de auditoria, venda com múltiplos produtos,
   cancelamento transacional, painel RH, relatórios e backup ampliado.
   Dados anteriores permanecem intactos. */
const v61Date=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const v61AuditRef=(c)=>doc(collection(db,'companies',c,'audit'));
function v61AuditData(action,details,companyId=S.companyId){return {action,details,companyId,actorUid:S.user.uid,at:serverTimestamp(),schemaVersion:61}}
async function v61DeleteFinance(row){
 if(!isSecurityAdmin()||!S.user?.uid||!S.companyId)throw Error('Somente administração pode excluir lançamentos.');
 if(row.sourceSaleId||String(row.source||'').startsWith('sales-'))throw Error('Receita vinculada a venda: use o cancelamento integrado.');
 const c=S.companyId,ref=doc(db,'companies',c,'finance',row.id),audit=v61AuditRef(c);
 await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Lançamento não encontrado.');if(snap.data().sourceSaleId)throw Error('Lançamento vinculado a venda.');tx.delete(ref);tx.set(audit,v61AuditData('finance_deleted',{recordId:row.id,description:String(snap.data().description||'').slice(0,120),amount:Number(snap.data().amount)||0},c))});
}
const v61SaveOriginal=saveRecord;
saveRecord=async function(name,data,id=null){
 if(id&&name==='finance'){
  const snap=await getDoc(companyDoc('finance',id));
  if(snap.exists()&&snap.data().sourceSaleId)throw Error('Receita integrada: edições diretas bloqueadas. Use o fluxo da venda.');
 }
 if(id&&name==='sales'){
  const snap=await getDoc(companyDoc('sales',id));
  if(snap.exists()&&(snap.data().integrationV55||snap.data().integrationV61))throw Error('Venda integrada: edição direta bloqueada para proteger o estoque.');
 }
 return v61SaveOriginal(name,data,id);
};
function v61SalesPanel(){

 const root=document.createElement('section');root.className='panel';root.id='v61Sales';
 root.innerHTML=`<h2>◈ V61 — Venda com vários produtos</h2><p>Selecione uma oportunidade e adicione até 15 produtos. A receita e todas as baixas de estoque são gravadas juntas. Não executa novamente vendas já integradas.</p>

 <p id="v61SaleMessage" role="status"></p><hr><h3>Cancelamento e devolução integral</h3><p>Restaura as quantidades e cancela a receita. Somente vendas criadas pela V61 podem ser canceladas aqui. A devolução é integral, não parcial.</p><div class="v52-controls"><label>Venda integrada<select id="v61CancelSale"></select></label><button type="button" class="btn" id="v61Cancel">Cancelar e devolver</button></div><p id="v61CancelMessage" role="status"></p>`;
 view.append(root);const form=root.querySelector('#v61SaleForm');
 const sales=(S.sales||[]).filter(x=>!x.integrationV55&&!x.integrationV61&&x.status!=='Perdido'&&Number(x.amount)>0);
 form.elements.sale.innerHTML='<option value="">Selecione</option>'+sales.map(x=>`<option value="${esc(x.id)}">${esc(x.name||'Cliente')} — ${money(x.amount)}</option>`).join('');
 const stock=(S.stock||[]).filter(x=>Number.isSafeInteger(Number(x.quantity))&&Number(x.quantity)>0);
 function addItem(){const area=root.querySelector('#v61Items');if(area.children.length>=15)return toast('Limite de 15 produtos por venda.');const row=document.createElement('div');row.className='v52-controls';row.innerHTML=`<label>Produto<select class="v61Product" required><option value="">Selecione</option>${stock.map(x=>`<option value="${esc(x.id)}">${esc(x.name||'Produto')} — saldo ${esc(String(x.quantity))}</option>`).join('')}</select></label><label>Quantidade<input class="v61Quantity" type="number" min="1" max="1000000" step="1" value="1" required></label><button type="button" class="btn">Remover</button>`;row.querySelector('button').onclick=()=>row.remove();area.append(row)}
 root.querySelector('#v61Add').onclick=addItem;addItem();
 form.onsubmit=async event=>{event.preventDefault();const btn=form.querySelector('[type=submit]');btn.disabled=true;const msg=root.querySelector('#v61SaleMessage');
  try{if(!isSecurityAdmin()||!S.companyId||!S.user?.uid)throw Error('Somente administração pode finalizar vendas.');const c=S.companyId,uid=S.user.uid,saleId=form.elements.sale.value,payment=form.elements.payment.value;

function v69Quotes(){
 const root=v69Container('Orçamentos profissionais','Propostas detalhadas com vários itens, desconto, validade, impressão e histórico. Não é nota fiscal.');
 const clients=S.clients||[],quotes=S.quotes||[];
 root.innerHTML=`<div class="mn69-grid"><div class="mn69-kpi">Orçamentos<strong>${quotes.length}</strong></div><div class="mn69-kpi">Aprovados<strong>${quotes.filter(x=>x.status==='Aprovado').length}</strong></div><div class="mn69-kpi">Valor aprovado<strong>${v69Money(quotes.filter(x=>x.status==='Aprovado').reduce((n,x)=>n+Number(x.amount||0),0))}</strong></div></div>
 <form id="mn69Quote" class="mn69-panel"><h3 id="mn69FormTitle">Novo orçamento</h3><div class="mn69-grid">
 <label>Cliente<select name="clientId" required><option value="">Selecione</option>${clients.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>
 <label>Validade<input name="validUntil" type="date" required></label><label>Descrição / assunto<input name="description" maxlength="160" required></label>
 <label>Desconto (R$)<input name="discount" type="number" min="0" max="100000000" step="0.01" value="0"></label>
 <label>Condições de pagamento<input name="paymentTerms" maxlength="180" placeholder="Ex.: 50% entrada, 50% entrega"></label>

 <div id="mn69Total" class="mn69-total">Total: R$ 0,00</div><div class="mn69-actions"><button type="submit" class="btn primary">Salvar orçamento</button><button type="button" class="btn" id="mn69Reset">Novo orçamento</button></div></form>
 <div class="mn69-panel"><h3>Orçamentos salvos</h3><label>Buscar <input type="search" id="mn69Find" placeholder="Cliente, assunto, situação" style="width:100%;padding:11px"></label><div class="mn69-scroll" id="mn69List"></div></div>`;
 const form=$('mn69Quote'),items=$('mn69Items');let editing=null;
 const addItem=(item={})=>{if(items.children.length>=30)return toast('Máximo de 30 itens por orçamento.');const row=document.createElement('div');row.className='mn69-item';row.innerHTML=`<input class="desc" aria-label="Descrição do item" maxlength="140" placeholder="Produto ou serviço" required value="${esc(item.description||'')}"><input class="qty" aria-label="Quantidade" type="number" min="0.001" max="1000000" step="0.001" required value="${esc(String(item.quantity??1))}"><input class="unit" aria-label="Valor unitário" type="number" min="0" max="100000000" step="0.01" required value="${esc(String(item.unitPrice??0))}"><strong class="line">${v69Money((item.quantity??1)*(item.unitPrice??0))}</strong><button class="btn" type="button" aria-label="Remover item">×</button>`;row.querySelector('button').onclick=()=>{if(items.children.length>1)row.remove();calculate()};row.querySelectorAll('input').forEach(el=>el.oninput=calculate);items.append(row);calculate()};
 const getItems=()=>[...items.children].map(row=>({description:row.querySelector('.desc').value.trim(),quantity:Number(row.querySelector('.qty').value),unitPrice:Number(row.querySelector('.unit').value)}));
 const calculate=()=>{const data=getItems(),subtotal=data.reduce((n,x)=>n+x.quantity*x.unitPrice,0),discount=Number(form.elements.discount.value||0);[...items.children].forEach((row,i)=>row.querySelector('.line').textContent=v69Money(data[i].quantity*data[i].unitPrice));$('mn69Total').textContent=`Subtotal ${v69Money(subtotal)} − desconto ${v69Money(discount)} = ${v69Money(Math.max(0,subtotal-discount))}`};
 form.elements.discount.oninput=calculate;$('mn69Add').onclick=()=>addItem();
 const reset=()=>{editing=null;form.reset();items.innerHTML='';addItem();$('mn69FormTitle').textContent='Novo orçamento';};$('mn69Reset').onclick=reset;reset();
 form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('[type=submit]');b.disabled=true;try{
 const d=Object.fromEntries(new FormData(form)),list=getItems();if(!clients.some(c=>c.id===d.clientId))throw Error('Selecione um cliente cadastrado.');if(!v68DateOk(d.validUntil))throw Error('Validade inválida.');if(!d.description.trim())throw Error('Informe o assunto.');if(!list.length||list.some(x=>!x.description||!Number.isFinite(x.quantity)||x.quantity<=0||!Number.isFinite(x.unitPrice)||x.unitPrice<0))throw Error('Verifique descrição, quantidade e preço de cada item.');
 const subtotal=Math.round(list.reduce((n,x)=>n+x.quantity*x.unitPrice,0)*100)/100,discount=Number(d.discount||0);if(!Number.isFinite(subtotal)||subtotal>100000000||!Number.isFinite(discount)||discount<0||discount>subtotal)throw Error('Desconto ou total inválido.');
 const old=editing?quotes.find(x=>x.id===editing):null;if(old?.status==='Aprovado'||old?.status==='Convertido')throw Error('Orçamento aprovado não pode ser editado.');
 const amount=Math.round((subtotal-discount)*100)/100;
 await saveRecord('quotes',{clientId:d.clientId,description:d.description.trim(),validUntil:d.validUntil,paymentTerms:d.paymentTerms||'',notes:d.notes||'',items:list,subtotal,discount,amount,status:old?.status||'Rascunho',schemaVersion:69},editing);await reload();toast('Orçamento salvo.');
 }catch(err){toast(errorText(err))}finally{b.disabled=false}};
 const list=$('mn69List');const draw=()=>{const q=$('mn69Find').value.toLowerCase();const rows=quotes.filter(x=>[x.description,x.status,clients.find(c=>c.id===x.clientId)?.name].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=`<table><thead><tr><th>Cliente</th><th>Assunto</th><th>Validade</th><th>Total</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(clients.find(c=>c.id===x.clientId)?.name||'Cliente não encontrado')}</td><td>${esc(x.description||'')}</td><td>${esc(x.validUntil||'')}</td><td>${v69Money(x.amount)}</td><td>${esc(x.status||'Rascunho')}</td><td><button class="btn" data-print="${esc(x.id)}">Imprimir / PDF</button> ${x.status==='Rascunho'?`<button class="btn" data-edit="${esc(x.id)}">Editar</button><button class="btn" data-approve="${esc(x.id)}">Aprovar</button>`:''}</td></tr>`).join('')}</tbody></table>`;
 list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=quotes.find(y=>y.id===b.dataset.edit);if(!x)return;reset();editing=x.id;for(const k of ['clientId','description','validUntil','discount','paymentTerms','notes'])form.elements[k].value=x[k]??'';items.innerHTML='';(Array.isArray(x.items)&&x.items.length?x.items:[{description:x.description,quantity:1,unitPrice:x.amount}]).forEach(addItem);calculate();$('mn69FormTitle').textContent='Editar orçamento';form.scrollIntoView({behavior:'smooth'});});
 list.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const x=quotes.find(y=>y.id===b.dataset.approve);if(!x||x.status!=='Rascunho'||!confirm('Marcar orçamento como aprovado?'))return;try{await saveRecord('quotes',{status:'Aprovado',approvedAt:new Date().toISOString()},x.id);await reload();toast('Orçamento aprovado.')}catch(err){toast(errorText(err))}});
 list.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>v69Print(quotes.find(y=>y.id===b.dataset.print),clients));};$('mn69Find').oninput=draw;draw();
}

 const old=document.getElementById('mn69Print');old?.remove();const section=document.createElement('section');section.id='mn69Print';section.style.cssText='position:fixed;inset:0;background:white;color:#111;z-index:99999;overflow:auto;padding:28px;font:14px Arial';

 document.body.append(section);section.querySelector('#mn69Close').onclick=()=>section.remove();section.querySelector('#mn69PrintBtn').onclick=()=>{document.body.classList.add('mn69-printing');window.print();document.body.classList.remove('mn69-printing')};

function v70ValidCnpj(value){const n=String(value||'').replace(/\D/g,'');if(!n)return true;if(n.length!==14||/^(\d)\1+$/.test(n))return false;const digit=(length)=>{const weights=length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];const sum=weights.reduce((a,w,i)=>a+Number(n[i])*w,0),r=sum%11;return r<2?0:11-r};return Number(n[12])===digit(12)&&Number(n[13])===digit(13)}

function v70CompanyEditor(){if(!isOwner())return toast('Somente o proprietário pode alterar os dados da empresa.');const company=S.companies.find(x=>x.id===S.companyId)||{};const overlay=document.createElement('div');overlay.className='dialog-bg';overlay.style.zIndex='99990';overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="Cadastro empresarial" style="max-width:850px;max-height:90vh;overflow:auto"><h2>Cadastro completo da empresa</h2><p>Preencha apenas informações reais. CPF de responsáveis e documentos pessoais não são necessários aqui.</p><form id="v70CompanyForm"><div class="v70-fields">${v70CompanyFields.map(([key,label,required])=>`<label>${esc(label)}<input name="${key}" maxlength="160" ${required?'required':''} value="${esc(company[key]||'')}"></label>`).join('')}</div><div class="v70-actions"><button class="btn primary" type="submit">Salvar dados</button><button class="btn" type="button" id="v70Cancel">Cancelar</button></div></form></section>`;document.body.append(overlay);overlay.querySelector('#v70Cancel').onclick=()=>overlay.remove();overlay.querySelector('#v70CompanyForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const data=Object.fromEntries(new FormData(e.currentTarget));data.name=data.name.trim();data.cnpj=data.cnpj.replace(/\D/g,'');data.state=data.state.toUpperCase().trim();if(data.name.length<2)throw Error('Informe a razão social.');if(!v70ValidCnpj(data.cnpj))throw Error('CNPJ inválido: confira os dígitos.');if(data.state&&!/^[A-Z]{2}$/.test(data.state))throw Error('UF deve ter duas letras.');await updateDoc(doc(db,'companies',S.companyId),{...data,updatedAt:serverTimestamp()});overlay.remove();await reload();toast('Dados empresariais atualizados.')}catch(err){toast(errorText(err))}finally{b.disabled=false}}}

function v72Payroll(){
 if(!isSecurityAdmin()||!S.companyId)return;
 const view=$('view');if(!view||view.querySelector('#v72Payroll'))return;
 const root=document.createElement('section');root.id='v72Payroll';root.className='v72-area';

 <p class="v72-muted">Conferência inclui: competência duplicada, funcionário ausente, valores negativos, líquido inconsistente, descontos superiores ao bruto, fechamento sem snapshot e ausência de tabelas fiscais validadas. Férias, 13º, rescisões, médias, convenções coletivas e incidências legais exigem rotinas próprias e conferência profissional.</p>`;

 root.querySelector('#v72Stats').innerHTML=stats.map(([k,v])=>`<div class="v72-stat"><small>${k}</small><strong>${v}</strong></div>`).join('');
 root.querySelector('#v72Rows').innerHTML=`<table><thead><tr><th>Funcionário</th><th>Competência</th><th>Bruto</th><th>Descontos</th><th>Líquido</th><th>Estado</th><th>Conferência</th></tr></thead><tbody>${filtered.map(({r,x})=>`<tr><td>${esc(employeeName(r.employeeId))}</td><td>${esc(r.period||'')}</td><td>${money(x.gross)}</td><td>${money(x.deductions)}</td><td>${money(x.net)}</td><td>${esc(r.status||'rascunho')}</td><td>${issues(r,x).length?esc(issues(r,x).join('; ')):'Sem alertas básicos'}</td></tr>`).join('')}</tbody></table>`;
 root.querySelector('#v72Warnings').innerHTML=flagged.length?`<div class="v72-alert">${flagged.length} lançamento(s) exigem conferência. A ausência de alerta não significa conformidade legal.</div>`:'<div class="v72-alert v72-ok">Sem inconsistências básicas nos registros filtrados. Confira cálculos legais e documentos.</div>';
 };root.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',refresh));root.querySelector('#v72All').onclick=()=>{root.querySelector('#v72Period').value='';refresh()};root.querySelector('#v72Export').onclick=()=>v52Download(v52csv([['Funcionário','Competência','Bruto','Descontos','Líquido','FGTS','Status','Alertas'],...filtered.map(({r,x})=>[employeeName(r.employeeId),r.period,x.gross,x.deductions,x.net,x.fgts,r.status,issues(r,x).join('; ')])]),'conferencia-folha-v72.csv','text/csv;charset=utf-8');refresh();

function v73Review(r){const x=v42PayView(r),a=[];
 if(!S.employees.some(e=>e.id===r.employeeId))a.push('Colaborador inexistente');
 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.period||''))a.push('Competência inválida');
 if(S.payroll.filter(y=>y.employeeId===r.employeeId&&y.period===r.period).length>1)a.push('Competência duplicada');
 if(!Number.isFinite(x.gross)||!Number.isFinite(x.net)||x.net<0||x.deductions>x.gross)a.push('Valores inconsistentes');
 if(r.status==='fechado'&&!r.closedSnapshot)a.push('Fechamento sem snapshot');
 if(r.status==='fechado'&&(!r.closedAt||!r.closedBy))a.push('Fechamento sem autoria/data');
 if(r.status==='conferido'&&!r.reviewedAt)a.push('Conferência sem data/autoria do servidor');
 if(r.status==='fechado'&&(!r.reviewedAt||!r.reviewedBy))a.push('Conferência sem autoria');
 return a;

function v73Payroll(){if(!isSecurityAdmin()||S.page!=='payroll')return;const view=$('view');if(!view||view.querySelector('#v73Payroll'))return;
 const root=document.createElement('section');root.id='v73Payroll';root.className='v73-panel';root.innerHTML=`<h2>Conferência avançada e fechamento da folha</h2><p>Consolidação administrativa por competência, com rastreabilidade e pendências. Não substitui o processamento legal da folha.</p><div class="v73-toolbar"><input type="month" id="v73Month" aria-label="Competência"><select id="v73State"><option value="">Todos os estados</option><option value="rascunho">Rascunho</option><option value="conferido">Conferido</option><option value="fechado">Fechado</option></select><input id="v73Name" placeholder="Buscar colaborador" aria-label="Buscar colaborador"><button class="btn" id="v73Export">Exportar conferência</button></div><div id="v73Summary" class="v73-grid"></div><div id="v73Alerts"></div><div id="v73Results" class="v73-scroll"></div><div class="v73-warning">Checklist obrigatório antes do fechamento: cadastro contratual e jornada; ponto e ausências; adicionais e médias; benefícios e descontos autorizados; tabelas legais vigentes; conferência por responsável; aprovação; comprovantes; obrigações legais externas. Os cálculos locais são gerenciais e não são homologação tributária.</div>`;view.append(root);
 let rows=[];const refresh=()=>{const month=root.querySelector('#v73Month').value,state=root.querySelector('#v73State').value,name=root.querySelector('#v73Name').value.trim().toLocaleLowerCase('pt-BR');rows=S.payroll.filter(r=>(!month||r.period===month)&&(!state||r.status===state)&&(!name||employeeName(r.employeeId).toLocaleLowerCase('pt-BR').includes(name)));const total=k=>rows.reduce((a,r)=>a+Number(v42PayView(r)[k]||0),0);const problems=rows.filter(r=>v73Review(r).length);root.querySelector('#v73Summary').innerHTML=[['Registros',rows.length],['Bruto',money(total('gross'))],['Descontos',money(total('deductions'))],['Líquido',money(total('net'))],['FGTS informado',money(total('fgts'))],['Com alertas',problems.length]].map(([k,v])=>`<div class="v73-tile"><small>${k}</small><strong>${v}</strong></div>`).join('');root.querySelector('#v73Alerts').innerHTML=problems.length?`<div class="v73-warning">${problems.length} registro(s) com pendências técnicas. Revise antes de fechar.</div>`:'<div class="v73-ok">Nenhuma inconsistência técnica básica encontrada nos registros filtrados. Isso não valida a legislação.</div>';root.querySelector('#v73Results').innerHTML=`<table><thead><tr><th>Colaborador</th><th>Competência</th><th>Estado</th><th>Bruto</th><th>Líquido</th><th>Conferido por</th><th>Fechado por</th><th>Pendências</th></tr></thead><tbody>${rows.map(r=>{const x=v42PayView(r);return `<tr><td>${esc(employeeName(r.employeeId))}</td><td>${esc(r.period||'')}</td><td>${esc(r.status||'rascunho')}</td><td>${money(x.gross)}</td><td>${money(x.net)}</td><td>${esc(r.reviewedBy||'—')}</td><td>${esc(r.closedBy||'—')}</td><td>${esc(v73Review(r).join('; ')||'Sem alerta técnico')}</td></tr>`}).join('')}</tbody></table>`};root.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',refresh));root.querySelector('#v73Export').onclick=()=>v52Download(v52csv([['Colaborador','Competência','Situação','Bruto','Descontos','Líquido','FGTS','Conferido por','Fechado por','Alertas'], function v82Dashboard(){if(S.page!=='dashboard'||!S.companyId||document.getElementById('v82Dashboard'))return;const root=document.createElement('section');root.id='v82Dashboard';root.className='v82-wrap';root.innerHTML=`<div class="v82-head"><div><h2 style="margin:0">📊 Inteligência empresarial</h2><p class="v82-note">Indicadores com base nos registros disponíveis da empresa selecionada.</p></div><div class="v82-controls"><label>Período<select id="v82Range"><option value="6">Últimos 6 meses</option><option value="12">Últimos 12 meses</option><option value="3">Últimos 3 meses</option></select></label><div class="v82-actions"><button type="button" class="btn" id="v82Csv">Exportar CSV</button><button type="button" class="btn" id="v82Print">Imprimir relatório</button></div></div></div><div id="v82Results" aria-live="polite"></div><p class="v82-note">Receitas e despesas realizadas consideram lançamentos com situação Recebido/Pago. Previsões consideram vencimentos registrados, não saldo bancário. Dados sem datas válidas não entram nas séries. Vendas e financeiro podem representar o mesmo fato: não são somados entre si.</p>`;const view=$('view');const anchor=view.querySelector('.stats');if(anchor)anchor.after(root);else view.prepend(root);let exportRows=[];function redraw(){const months=v82Months(Number(root.querySelector('#v82Range').value));const fin=(S.finance||[]).filter(x=>!x.archived);const series=months.map(m=>{const r=fin.filter(x=>v82Date(x.paymentDate||x.paidAt||x.date||x.dueDate)===m);const due=fin.filter(x=>v82Date(x.dueDate||x.date)===m);const received=r.filter(x=>x.type==='Receita'&&x.status==='Recebido').reduce((a,x)=>a+v82Number(x.amount),0);const paid=r.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,x)=>a+v82Number(x.amount),0);const pendingIncome=due.filter(x=>x.type==='Receita'&&x.status==='Pendente').reduce((a,x)=>a+v82Number(x.amount),0);const pendingExpense=due.filter(x=>x.type==='Despesa'&&x.status==='Pendente').reduce((a,x)=>a+v82Number(x function v83PurchasePanel(){if(S.page!=='purchases'||!S.companyId||!canManageBusiness()||$('v83PurchasePanel'))return;

function addItem(){if(items.children.length>=15)return toast('Máximo de 15 itens.');const div=document.createElement('div');div.className='v83-row';div.innerHTML=`<label>Produto<select class="v83-product" required><option value="">Selecione</option>${stock().map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.sku||p.id)}</option>`).join('')}</select></label><label>Quantidade<input class="v83-qty" type="number" min="1" max="1000000" step="1" value="1" required></label><label>Custo unitário (R$)<input class="v83-price" type="number" min="0.01" max="100000000" step="0.01" required></label><button type="button" class="btn v83-remove" aria-label="Remover item">×</button>`;div.querySelector('.v83-remove').onclick=()=>{div.remove();calculate()};div.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calculate));items.append(div);calculate()}

<script>
/* V102 — Cosmic Journey Ultra: efeito independente dos gráficos 3D. */
(function(){
'use strict';
const canvas=document.getElementById('v101-space');
if(document.documentElement.dataset.nasaVideoBg==='1')return;
if(!canvas)return;
const ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)return;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const saveData=!!navigator.connection?.saveData;
const key='mn_v102_space_settings';
let prefs={enabled:true,speed:1};
try{const p=JSON.parse(localStorage.getItem(key)||'{}');if(typeof p.enabled==='boolean')prefs.enabled=p.enabled;if([0.25,0.6,1,1.7,2.5].includes(p.speed))prefs.speed=p.speed;}catch{}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(prefs));}catch{}};
let w=1,h=1,dpr=1,stars=[],dust=[],raf=0,last=0,slowFrames=0,quality=1;
const mobile=()=>innerWidth<760;
const rand=(a,b)=>a+Math.random()*(b-a);
const colors=['#d9f6ff','#99dfff','#fff7dd','#a4bfff','#e1c6ff'];
const controls=document.createElement('div');
controls.id='v102-space-controls';
controls.innerHTML=`<button id="v102-space-toggle" type="button" aria-pressed="true">✦ Fundo espacial: ligado</button><label for="v102-space-speed">Velocidade</label><select id="v102-space-speed" aria-label="Velocidade da viagem espacial"><option value="0.25">Muito lenta</option><option value="0.6">Lenta</option><option value="1">Normal</option><option value="1.7">Rápida</option><option value="2.5">Hiperespaço</option></select>`;
document.body.appendChild(controls);
const toggle=controls.querySelector('#v102-space-toggle');
const speed=controls.querySelector('#v102-space-speed');
speed.value=String(prefs.speed);
function seed(){
 const n=reduced.matches?75:(mobile()||saveData?150:360);
 stars=Array.from({length:Math.round(n*quality)},()=>({x:rand(-1.4,1.4),y:rand(-1.4,1.4),z:rand(.1,1),r:rand(.45,1.6),c:colors[Math.floor(rand(0,colors.length))]}));
 dust=Array.from({length:mobile()?36:85},()=>({x:rand(0,1),y:rand(0,1),r:rand(.3,1.2),a:rand(.05,.23)}));
}
function resize(){
 w=Math.max(1,innerWidth);h=Math.max(1,innerHeight);
 dpr=Math.min(devicePixelRatio||1,mobile()?1.15:1.65);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);seed();render(last);
}
function glow(x,y,r,stops){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 stops.forEach(([p,c])=>g.addColorStop(p,c));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function nebula(t){
 ctx.fillStyle='#02030d';ctx.fillRect(0,0,w,h);
 const u=t*.000016;
 // Camadas suaves de nuvens cósmicas, com brilho aditivo e paralaxe.
 ctx.save();ctx.globalCompositeOperation='screen';
 glow(w*(.24+Math.sin(u)*.055),h*(.28+Math.cos(u*.8)*.06),Math.max(w,h)*.78,[[0,'rgba(10,150,245,.62)'],[.28,'rgba(20,75,215,.36)'],[.67,'rgba(10,19,54,.045)'],[1,'rgba(0,0,0,0)']]);
 glow(w*(.74+Math.sin(u*.7)*.05),h*(.58+Math.cos(u*.5)*.05),Math.max(w,h)*.63,[[0,'rgba(221,34,166,.50)'],[.33,'rgba(135,35,204,.32)'],[.75,'rgba(16,12,53,.025)'],[1,'rgba(0,0,0,0)']]);
 glow(w*(.55+Math.cos(u*.6)*.07),h*(.34+Math.sin(u*.9)*.06),Math.max(w,h)*.37,[[0,'rgba(33,235,237,.40)'],[.38,'rgba(24,135,230,.20)'],[1,'rgba(0,0,0,0)']]);
 // Nebulosas adicionais, rosa, violeta e âmbar, com parallax lento.
 glow(w*(.14+Math.sin(u*.7)*.045),h*(.78+Math.cos(u*.4)*.06),Math.max(w,h)*.49,[[0,'rgba(255,93,143,.40)'],[.35,'rgba(159,43,164,.24)'],[1,'rgba(0,0,0,0)']]);
 glow(w*(.91+Math.cos(u*.9)*.035),h*(.19+Math.sin(u*.65)*.06),Math.max(w,h)*.40,[[0,'rgba(255,146,58,.33)'],[.36,'rgba(188,43,120,.19)'],[1,'rgba(0,0,0,0)']]);
 // Filamentos luminosos dão textura sem baixar imagens externas.
 ctx.globalAlpha=.20;ctx.lineWidth=Math.max(1.5,w/950);
 for(let i=0;i<9;i++){
  const shift=Math.sin(u*.55+i*.83)*w*.024;
  ctx.strokeStyle=i%3===0?'#40e9ff':i%3===1?'#e97bff':'#ff9e78';
  ctx.beginPath();
  const y=h*(.10+i*.105);
  ctx.moveTo(-w*.15,y+h*.12);
  ctx.bezierCurveTo(w*.25+shift,y-h*.24,w*.55-shift,y+h*.21,w*1.15,y-h*.09);
  ctx.stroke();
 }
 ctx.globalAlpha=1;
 ctx.restore();
 for(const p of dust){ctx.globalAlpha=p.a;ctx.fillStyle='#a9c9f7';ctx.fillRect(p.x*w,p.y*h,p.r,p.r);}
 ctx.globalAlpha=1;
}
function render(t){
 if(!prefs.enabled){ctx.fillStyle='#020511';ctx.fillRect(0,0,w,h);return;}
 nebula(t);
 const cx=w*.5,cy=h*.5,scale=Math.min(w,h)*.53;
 for(const s of stars){
  const z=Math.max(.04,s.z),x=cx+s.x*scale/z,y=cy+s.y*scale/z;
  if(x<-25||x>w+25||y<-25||y>h+25)continue;
  const r=Math.min(3.1,s.r*(1.1-z)*1.55+.22);
  ctx.globalAlpha=Math.min(1,.3+(1-z)*.76);ctx.fillStyle=s.c;
  if(z<.28&&!reduced.matches){
   const ox=cx+s.x*scale/(z+.025),oy=cy+s.y*scale/(z+.025);
   ctx.strokeStyle=s.c;ctx.lineWidth=Math.max(.45,r*.5);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(x,y);ctx.stroke();
  }
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function shouldRun(){return prefs.enabled&&!document.hidden&&!reduced.matches;}
function sync(){
 toggle.textContent=prefs.enabled?'✦ Fundo espacial: ligado':'✧ Fundo espacial: desligado';
 toggle.setAttribute('aria-pressed',String(prefs.enabled));
 speed.disabled=!prefs.enabled;
 canvas.style.display=prefs.enabled?'block':'none';
 cancelAnimationFrame(raf);raf=0;last=0;
 if(prefs.enabled)render(performance.now());
 if(shouldRun())raf=requestAnimationFrame(tick);
}
function tick(t){
 if(!shouldRun())return;
 if(!last)last=t;
 const dt=Math.min(60,t-last),interval=mobile()||saveData?1000/30:1000/45;
 if(dt<interval){raf=requestAnimationFrame(tick);return;}
 last=t;
 for(const s of stars){s.z-=dt*.00018*prefs.speed;if(s.z<.06){s.z=1;s.x=rand(-1.4,1.4);s.y=rand(-1.4,1.4);}}
 render(t);
 if(dt>48)slowFrames++;else slowFrames=Math.max(0,slowFrames-2);
 if(slowFrames>25&&quality>.55){quality=.55;seed();slowFrames=0;}
 raf=requestAnimationFrame(tick);
}
toggle.addEventListener('click',()=>{prefs.enabled=!prefs.enabled;save();sync();});
speed.addEventListener('change',()=>{prefs.speed=Number(speed.value)||1;save();});
addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',sync);
reduced.addEventListener?.('change',()=>{resize();sync();});
resize();sync();
})();
</script>

<script id="v104-nasa-engine">
/* NASA SVS official visualization. Source and credits: https://svs.gsfc.nasa.gov/14950/ */
(()=>{
 'use strict';
 const VIDEO='https://svs.gsfc.nasa.gov/vis/a010000/a014900/a014950/14950_Galaxies_FlyThrough_1080.mp4';
 const POSTER='https://svs.gsfc.nasa.gov/vis/a010000/a014900/a014950/14950_Galaxies_FlyThrough_Still.jpg';
 const KEY='mn_v104_nasa_bg';
 let settings={enabled:true,speed:1};
 try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(typeof v.enabled==='boolean')settings.enabled=v.enabled;if([.5,.75,1,1.25,1.5].includes(v.speed))settings.speed=v.speed;}catch{}
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(settings))}catch{}};
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 const saveData=!!navigator.connection?.saveData;
 const wrap=document.createElement('div');wrap.id='v104-nasa-wrap';wrap.setAttribute('aria-hidden','true');
 const poster=document.createElement('div');poster.className='v104-poster';poster.style.backgroundImage='url("'+POSTER+'")';
 const video=document.createElement('video');video.muted=true;video.loop=true;video.playsInline=true;video.autoplay=true;video.preload='none';video.setAttribute('muted','');video.setAttribute('playsinline','');
 video.poster=POSTER;
 wrap.append(poster,video);document.body.prepend(wrap);
 const ctrl=document.createElement('div');ctrl.id='v104-nasa-controls';
 ctrl.innerHTML='<button type="button" id="v104-toggle">Vídeo NASA: ligado</button><button type="button" id="v104-play">Iniciar vídeo</button><label for="v104-speed">Velocidade</label><select id="v104-speed"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option></select><a href="https://svs.gsfc.nasa.gov/14950/" target="_blank" rel="noopener noreferrer" title="NASA Goddard Space Flight Center — Conceptual Image Lab">NASA / créditos</a>';
 document.body.append(ctrl);
 const toggle=ctrl.querySelector('#v104-toggle'),play=ctrl.querySelector('#v104-play'),speed=ctrl.querySelector('#v104-speed');
 speed.value=String(settings.speed);
 let userStarted=false, failed=false;
 function start(force=false){
  if(!settings.enabled||document.hidden||reduced.matches)return;
  if(saveData&&!force&&!userStarted)return;
  if(!video.getAttribute('src'))video.src=VIDEO;
  video.playbackRate=settings.speed;
  const promise=video.play();if(promise?.catch)promise.catch(()=>{play.hidden=false;play.textContent='▶ Reproduzir NASA';});
 }
 function sync(){
  toggle.textContent=settings.enabled?'✦ Vídeo NASA: ligado':'✧ Vídeo NASA: desligado';
  toggle.setAttribute('aria-pressed',String(settings.enabled));
  speed.disabled=!settings.enabled;
  wrap.style.display=settings.enabled?'block':'none';
  if(!settings.enabled||document.hidden||reduced.matches){video.pause();play.hidden=!settings.enabled;return;}
  play.hidden=!saveData&&!failed;
  start();
 }
 video.addEventListener('playing',()=>{wrap.classList.add('v104-playing');failed=false;play.hidden=true});
 video.addEventListener('error',()=>{failed=true;wrap.classList.remove('v104-playing');play.hidden=false;play.textContent='▶ Tentar vídeo NASA';});
 toggle.addEventListener('click',()=>{settings.enabled=!settings.enabled;persist();sync()});
 play.addEventListener('click',()=>{userStarted=true;failed=false;start(true)});
 speed.addEventListener('change',()=>{settings.speed=Number(speed.value)||1;video.playbackRate=settings.speed;persist()});
 document.addEventListener('visibilitychange',sync);
 reduced.addEventListener?.('change',sync);
 sync();
})();
</script>
