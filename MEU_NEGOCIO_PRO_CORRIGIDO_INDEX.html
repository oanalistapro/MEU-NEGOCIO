
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#080e18">
<title>MEU NEGÓCIO PRO | Enterprise 3D</title>
<style>
:root{
  --bg:#080e18;
  --side:#0c1421;
  --card:#121e2e;
  --card2:#162537;
  --line:#29394e;
  --text:#edf6ff;
  --muted:#91a5bb;
  --cyan:#39e5d2;
  --orange:#ff914d;
  --blue:#539dff;
  --green:#45dca1;
}
*{box-sizing:border-box}
body{
  margin:0;
  font:14px/1.5 system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{
  background:#0c1725;
  border:1px solid var(--line);
  border-radius:10px;
  color:white;
  padding:11px;
  min-width:0;
}
input:focus,select:focus{
  outline:2px solid var(--cyan);
}
.hidden{display:none!important}
.layout{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  flex-shrink:0;
  background:var(--side);
  border-right:1px solid var(--line);
  padding:22px 12px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
}
.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 9px 28px;
}
.logo-icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  background:linear-gradient(135deg,#48ffe2,#218bbd);
  color:#06151c;
  border-radius:12px;
  font-size:23px;
  font-weight:900;
  box-shadow:0 0 28px #36dfcf55;
}
.logo strong{font-size:15px}
.logo strong span{color:var(--cyan)}
.logo small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
}
.nav-title{
  font-size:10px;
  letter-spacing:1.6px;
  color:#71879e;
  padding:18px 12px 8px;
}
.nav{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#b4c4d5;
  border-radius:10px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  margin:2px 0;
}
.nav:hover{background:#1a2a3d}
.nav.active{
  color:#72ffee;
  background:linear-gradient(90deg,#164343,#112732);
  border-color:#2d7778;
}
.nav .ico{
  font-size:17px;
  width:22px;
  text-align:center;
}
.main{
  flex:1;
  min-width:0;
  padding:22px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:25px;
}
.topright{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}
.btn{
  background:#1a2b3d;
  color:var(--text);
  border:1px solid #345068;
  border-radius:10px;
  padding:10px 14px;
  font-weight:650;
}
.btn:hover{border-color:var(--cyan)}
.btn.primary{
  background:linear-gradient(120deg,#24b9b3,#45edda);
  border:0;
  color:#062122;
}
.btn.orange{
  background:linear-gradient(120deg,#ffae64,#ff7a39);
  border:0;
  color:#25140b;
}
h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.8px;
}
h2{font-size:16px;margin:0}
p{color:var(--muted)}
.pagehead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.pagehead p{margin:3px 0}
.hero{
  height:320px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 75% 50%,#17454b,#0b1b2c 55%,#0a1421);
  border:1px solid #2a6869;
  border-radius:20px;
  margin-bottom:16px;
}
#threeMount{
  position:absolute;
  inset:0;
  z-index:1;
}
#threeMount canvas{
  display:block;
  width:100%;
  height:100%;
}
.hero-content{
  position:relative;
  z-index:2;
  padding:36px;
  max-width:57%;
  pointer-events:none;
}
.hero-content h2{
  font-size:clamp(26px,3.5vw,44px);
  letter-spacing:-1.5px;
  line-height:1.13;
  margin:13px 0;
}
.hero-content p{
  max-width:440px;
  color:#bdd1df;
}
.hero-buttons{
  display:flex;
  gap:9px;
  margin-top:22px;
  flex-wrap:wrap;
  pointer-events:auto;
}
.eyebrow{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
}
.webgl-badge{
  position:absolute;
  right:17px;
  bottom:14px;
  z-index:2;
  color:#89f5e7;
  font-size:10px;
  border:1px solid #267b78;
  background:#071a22d9;
  padding:7px 11px;
  border-radius:30px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:14px;
}
.stat,.panel{
  background:linear-gradient(145deg,#152335,#101b29);
  border:1px solid var(--line);
  border-radius:13px;
}
.stat{
  padding:17px;
  min-height:125px;
  transition:transform .2s,border-color .2s;
}
.stat:hover{
  transform:translateY(-4px);
  border-color:#3c9897;
}
.stat-label{
  color:#acbfd0;
  font-size:11px;
}
.stat-value{
  font-size:27px;
  font-weight:850;
  margin:9px 0 3px;
}
.stat-foot{
  font-size:10px;
  color:var(--green);
}
.grid-main{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(260px,1fr);
  gap:13px;
  margin-bottom:13px;
}
.grid-bottom{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.panel{
  padding:18px;
  min-width:0;
}
.panelhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.panelhead small{color:var(--muted)}
.chart{
  display:block;
  width:100%;
  height:250px;
}
.bar{
  display:grid;
  grid-template-columns:100px 1fr 28px;
  gap:9px;
  align-items:center;
  font-size:11px;
  margin:16px 0;
}
.track{
  height:10px;
  border-radius:7px;
  background:#29384a;
  overflow:hidden;
}
.fill{
  height:100%;
  border-radius:7px;
  background:linear-gradient(90deg,#2586bb,var(--cyan));
}
.donut-layout{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:185px;
}
.donut{
  width:140px;
  height:140px;
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
.donut:after{
  content:"";
  position:absolute;
  inset:32px;
  border-radius:50%;
  background:#111b29;
}
.legend{display:grid;gap:9px;font-size:11px}
.legend span{color:#aebed0}
.activity{
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.activity:last-child{border:0}
.activity small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.card3d{
  background:#142235;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  min-height:130px;
  transform-style:preserve-3d;
  transition:transform .15s,border-color .2s;
  position:relative;
  overflow:hidden;
}
.card3d:hover{border-color:var(--cyan)}
.card3d strong{
  display:block;
  margin:12px 0 5px;
}
.card3d small{color:var(--muted)}
.card3d .symbol{
  color:var(--cyan);
  font-size:23px;
}
.notice{
  padding:13px;
  background:#102c36;
  border:1px solid #2b5b67;
  border-radius:10px;
  margin:12px 0;
  color:#c1dce4;
}
.table-scroll{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:580px;
  text-align:left;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
}
th{
  color:#8ca4b8;
  font-size:11px;
}
td{font-size:12px}
.tag{
  background:#20463f;
  color:#7cf3c5;
  padding:4px 9px;
  border-radius:20px;
  font-size:11px;
}
.auth-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(circle at 65% 25%,#164247,#080e18 65%);
}
.auth-card{
  width:min(430px,100%);
  background:#132132;
  border:1px solid #315466;
  border-radius:18px;
  padding:30px;
}
.auth-card .btn{width:100%;margin-top:15px}
.dialog-bg{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  display:grid;
  place-items:center;
  padding:15px;
}
.dialog{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#152435;
  border:1px solid #426174;
  border-radius:16px;
  padding:23px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin:17px 0;
}
.form-grid label{
  display:grid;
  gap:6px;
  font-size:12px;
  color:#aec4d4;
}
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:150;
  background:#1c3c43;
  border:1px solid #4a9b8f;
  border-radius:10px;
  padding:13px 17px;
}
@media(max-width:1200px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid-bottom{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  .sidebar{width:70px;padding:15px 5px}
  .logo .brand-text,.nav-title,.nav-text{display:none}
  .nav{justify-content:center}
  .grid-main{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  .layout{display:block}
  .sidebar{
    width:100%;
    height:60px;
    position:fixed;
    top:auto;
    bottom:0;
    z-index:50;
    display:flex;
    padding:5px;
    border-right:0;
    border-top:1px solid var(--line);
  }
  .sidebar .logo{display:none}
  #navigation{display:flex;gap:4px}
  .nav{min-width:46px}
  .main{padding:13px 11px 85px}
  .topright{width:100%}
  .topright select{flex:1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-bottom,.cards{grid-template-columns:1fr}
  .hero{height:350px}
  .hero-content{padding:22px;max-width:95%}
  .hero-content h2{font-size:29px}
  #threeMount{opacity:.6}
  .form-grid{grid-template-columns:1fr}
  .donut-layout{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">

    <h1>MEU NEGÓCIO <span style="color:var(--cyan)">PRO</span></h1>

    <button class="btn primary" id="loginBtn">Entrar com Google</button>

</div>

<div id="appScreen" class="layout hidden">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">M</div>
      <div class="brand-text">
        <strong>MEU <span>NEGÓCIO</span></strong>

      </div>

        <button class="btn" id="addCompany">＋ Empresa</button>

    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">

/* =========================================
   MEU NEGÓCIO PRO ENTERPRISE
   PARTE 2 — FIREBASE E ESTRUTURA
========================================= */

import * as THREE from
"https://esm.sh/three@0.170.0";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  query,
  where,
  writeBatch,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =========================================
   FIREBASE DE TESTE
   NÃO ALTERAR O PROJETO OFICIAL
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyB-IiVlnzc_RESH_10MDmZsfnJ3iGm9zqw",
  authDomain: "meu-negocio-enterprise-teste.firebaseapp.com",
  projectId: "meu-negocio-enterprise-teste",
  storageBucket: "meu-negocio-enterprise-teste.firebasestorage.app",
  messagingSenderId: "1083026433106",
  appId: "1:1083026433106:web:9041a8eb3959a9a101eb8b",
  measurementId: "G-BW9N9QCFJ7"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});

/* =========================================
   ESTADO GLOBAL
========================================= */

const $ = id => document.getElementById(id);

const S = {
  user: null,
  companies: [],
  companyId: "",
  role: "",
  page: "dashboard",

  employees: [],
  departments: [],
  leaves: [],
  members: [],
  vacancies: [],
  candidates: [],
  attendance: [],
  payroll: [],

  finance: [],
  sales: [],
  stock: [],
  purchases: [],
  benefits: [],
  sst: [],
  training: [],
  performance: [],
  documents: [],
  projects: [],
  positions: [],
  support: []
};

/* =========================================
   PROTEÇÃO DE TEXTO
========================================= */

function esc(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

/* =========================================
   PERMISSÕES
========================================= */

function isAdmin() {
  return ["owner", "admin", "hr"].includes(S.role);
}

function isOwner() {
  return S.role === "owner";
}

function canReadHR() {
  return isAdmin() ||
    ["manager", "auditor"].includes(S.role);
}

function canManageBusiness() {
  return ["owner", "admin"].includes(S.role);
}

/* =========================================
   COLEÇÕES DO FIRESTORE
========================================= */

const collections = [
  "employees",
  "departments",
  "leaves",
  "members",
  "vacancies",
  "candidates",
  "attendance",
  "payroll",
  "finance",
  "sales",
  "stock",
  "purchases",
  "benefits",
  "sst",
  "training",
  "performance",
  "documents",
  "projects",
  "positions",
  "support"
];

function companyCollection(name) {
  if (!S.companyId) {
    throw new Error("Selecione uma empresa.");
  }

  return collection(
    db,
    "companies",
    S.companyId,
    name
  );
}

function companyDoc(name, id) {
  if (!S.companyId) {
    throw new Error("Selecione uma empresa.");
  }

  return doc(
    db,
    "companies",
    S.companyId,
    name,
    id
  );
}

/* =========================================
   MENSAGENS
========================================= */

let toastTimeout;

function toast(message) {
  clearTimeout(toastTimeout);

  $("toastRoot").innerHTML = `
    <div class="toast" role="status">
      ${esc(message)}
    </div>
  `;

  toastTimeout = setTimeout(() => {
    $("toastRoot").innerHTML = "";
  }, 4500);
}

function errorText(error) {
  console.error(error);

  const code = error?.code || "";

  if (code === "permission-denied") {
    return "Permissão negada. Verifique as regras do Firestore.";
  }

  if (code === "auth/unauthorized-domain") {
    return "O domínio do GitHub precisa ser autorizado no Firebase.";
  }

  if (code === "auth/popup-blocked") {
    return "O navegador bloqueou a janela de login.";
  }

  if (code === "auth/popup-closed-by-user") {
    return "A janela de login foi fechada.";
  }

  if (code === "auth/network-request-failed") {
    return "Falha na conexão com a internet.";
  }

  return error?.message || "Ocorreu um erro.";
}

/* =========================================
   FORMATAÇÃO
========================================= */

function money(value) {
  return Number(value || 0).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );
}

function today() {
  const date = new Date();

  const year = date.getFullYear();
  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatDate(value) {
  if (!value) return "—";

  const match = String(value).match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return `${match[3]}/${match[2]}/${match[1]}`;
  }

  return String(value);
}

/* =========================================
   COMPONENTES DE INTERFACE
========================================= */

function panel(title, content, action = "") {
  return `
    <section class="panel">
      <div class="panelhead">
        <h2>${esc(title)}</h2>
        <div>${action}</div>
      </div>

      ${content}
    </section>
  `;
}

function stat(title, value, foot = "DADOS ATUAIS") {
  return `
    <div class="stat">
      <div class="stat-label">
        ${esc(title)}
      </div>

      <div class="stat-value">
        ${esc(value)}
      </div>

      <div class="stat-foot">
        ● ${esc(foot)}
      </div>
    </div>
  `;
}

function table(headers, rows) {
  return `
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            ${headers.map(
              header => `<th>${esc(header)}</th>`
            ).join("")}
          </tr>
        </thead>

        <tbody>
          ${rows.join("")}
        </tbody>
      </table>
    </div>

    ${
      rows.length
        ? ""
        : "<p>Nenhum registro cadastrado.</p>"
    }
  `;
}

/* =========================================
   CAMPOS DOS FORMULÁRIOS
========================================= */

function inputField(
  label,
  name,
  value = "",
  type = "text",
  required = false
) {
  return `
    <label>
      ${esc(label)}

      <input
        name="${esc(name)}"
        type="${esc(type)}"
        value="${esc(value)}"
        ${required ? "required" : ""}
      >
    </label>
  `;
}

function selectField(
  label,
  name,
  items,
  value = ""
) {
  return `
    <label>
      ${esc(label)}

      <select name="${esc(name)}">
        ${items.map(item => {
          const optionValue =
            typeof item === "string"
              ? item
              : item.value;

          const optionLabel =
            typeof item === "string"
              ? item
              : item.label;

          return `
            <option
              value="${esc(optionValue)}"
              ${
                String(optionValue) === String(value)
                  ? "selected"
                  : ""
              }
            >
              ${esc(optionLabel)}
            </option>
          `;
        }).join("")}
      </select>
    </label>
  `;
}

/* =========================================
   JANELAS DE CADASTRO
========================================= */

function modal(title, fields, onSave) {
  $("modalRoot").innerHTML = `
    <div class="dialog-bg">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-label="${esc(title)}"
      >
        <h2>${esc(title)}</h2>

        <form id="modalForm">
          <div class="form-grid">
            ${fields}
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button
              class="btn primary"
              type="submit"
            >
              Salvar
            </button>

            <button
              class="btn"
              type="button"
              id="cancelModal"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  `;

  $("cancelModal").onclick = () => {
    $("modalRoot").innerHTML = "";
  };

  $("modalForm").onsubmit = async event => {
    event.preventDefault();

      '[type="submit"]'
    );

    button.disabled = true;

    try {
      const data = Object.fromEntries(
        new FormData(event.target)
      );

      await onSave(data);

      toast(errorText(error));
    } finally {
      button.disabled = false;
    }

}

   OPERAÇÕES DE CADASTRO
========================================= */

async function saveRecord(
  collectionName,
  data,
  id = null
) {
  if (!S.user || !S.companyId) {
    throw new Error("Faça login e selecione uma empresa.");
  }

  if (
    !collections.includes(collectionName) ||
    collectionName === "members"
  ) {
    throw new Error("Coleção não autorizada para cadastro genérico.");
  }

  if (id) {
    await updateDoc(
      companyDoc(collectionName, id),
      {
        ...data,
        updatedAt: serverTimestamp(),
        updatedBy: S.user.uid
      }
    );
  } else {
    await addDoc(
      companyCollection(collectionName),
      {
        ...data,
        createdAt: serverTimestamp(),
        createdBy: S.user.uid
      }
    );
  }
}

/* =========================================
   CONSULTA DE DADOS
========================================= */

async function readCollection(name) {
  try {
    const snapshot = await getDocs(
      companyCollection(name)
    );

    return snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));
  } catch (error) {
    if (error.code === "permission-denied") {
      console.warn(
        "Sem acesso à coleção:",
        name
      );

      return [];
    }

    throw error;
  }
}

/* =========================================
   CARREGAMENTO DOS REGISTROS
========================================= */

async function reload() {
  if (!S.companyId) return;

  const restrictedHR = [
    "employees",
    "leaves",
    "vacancies",
    "candidates",
    "attendance",
    "payroll"
  ];

  const restrictedBusiness = [
    "finance",
    "sales",
    "stock",
    "purchases",
    "benefits",
    "sst",
    "training",
    "performance",
    "documents",
    "projects",
    "positions",
    "support"
  ];

  const results = await Promise.all(
    collections.map(name => {
      if (
        restrictedHR.includes(name) &&
        !canReadHR()
      ) {
        return Promise.resolve([]);
      }

      if (
        name === "payroll" &&
        !isAdmin()
      ) {
        return Promise.resolve([]);
      }

      if (
        restrictedBusiness.includes(name) &&
        !canManageBusiness()
      ) {
        return Promise.resolve([]);
      }

      return readCollection(name);
    })
  );

  collections.forEach((name, index) => {
    S[name] = results[index];
  });

  render();
}

async function selectCompany(companyId) {
  const company = S.companies.find(
    item => item.id === companyId
  );

  if (!company) {
    throw new Error("Empresa não encontrada.");
  }

  const membership = await getDoc(
    doc(
      db,
      "companies",
      companyId,
      "members",
      S.user.uid
    )
  );

  if (!membership.exists()) {
    throw new Error(
      "Sua conta não possui acesso a esta empresa."
    );
  }

  S.companyId = companyId;
  S.role = membership.data().role || "employee";
  S.page = "dashboard";

  sessionStorage.setItem(
    "mn3d_company",
    companyId
  );

  $("companySelect").value = companyId;

  await reload();
}

async function loadCompanies() {
  const snapshot = await getDocs(
    query(
      collection(db, "companies"),
      where(
        "memberUids",
        "array-contains",
        S.user.uid
      )
    )
  );

  S.companies = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  $("companySelect").innerHTML =
    S.companies.map(company => `
      <option value="${esc(company.id)}">
        ${esc(company.name)}
      </option>
    `).join("");

  const savedCompany = sessionStorage.getItem(
    "mn3d_company"
  );

  const selectedCompany =
    S.companies.find(
      item => item.id === savedCompany
    )?.id ||
    S.companies[0]?.id;

  if (selectedCompany) {
    await selectCompany(selectedCompany);
    return;
  }

  S.companyId = "";
  S.role = "";

  $("pageTitle").textContent =
    "Bem-vindo ao MEU NEGÓCIO PRO";

  $("view").innerHTML = panel(
    "Primeira configuração",
    `
      <p>
        Cadastre sua primeira empresa
        para começar a utilizar o sistema.
      </p>

      <button
        class="btn primary"
        id="firstCompany"

  );

function companyForm() {
  modal(
    "Cadastrar empresa",
    `
      ${inputField(
        "Razão social ou nome",
        "name",
        "",
        "text",
        true
      )}

      ${inputField(
        "Nome fantasia",
        "tradeName"
      )}

      ${inputField(
        "CNPJ",
        "cnpj"
      )}

      ${inputField(
        "Cidade",
        "city"
      )}

      ${inputField(
        "Estado",
        "state"
      )}
    `,
    async data => {
      if (!S.user) {
        throw new Error("Faça login primeiro.");
      }

      if (!data.name.trim()) {
        throw new Error("Informe o nome da empresa.");
      }

      const companyRef = doc(
        collection(db, "companies")
      );

      const batch = writeBatch(db);

      batch.set(companyRef, {
        ...data,
        ownerUid: S.user.uid,
        memberUids: [S.user.uid],
        createdAt: serverTimestamp()
      });

      batch.set(
        doc(
          db,
          "companies",
          companyRef.id,
          "members",
          S.user.uid
        ),
        {
          uid: S.user.uid,
          email: S.user.email || "",
          name: S.user.displayName || "",
          role: "owner",
          createdAt: serverTimestamp()
        }
      );

      await batch.commit();

      sessionStorage.setItem(
        "mn3d_company",
        companyRef.id
      );

      await loadCompanies();
    }
  );
}

/* =========================================
   FUNDO GLOBAL 3D
========================================= */

const global3DMount = document.createElement("div");
global3DMount.id = "global3D";
global3DMount.setAttribute("aria-hidden", "true");

document.body.prepend(global3DMount);

let global3D = null;
let global3DEnabled = true;

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

/* =========================================
   OBJETOS 3D POR DEPARTAMENTO
========================================= */

const sceneThemes = {
  dashboard:  {color: 0x39e5d2, shape: "core"},
  hr:         {color: 0x539dff, shape: "sphere"},
  employees:  {color: 0x539dff, shape: "sphere"},
  departments:{color: 0x39e5d2, shape: "cube"},
  leaves:     {color: 0xa67bfa, shape: "ring"},
  attendance: {color: 0x39e5d2, shape: "ring"},
  recruitment:{color: 0xff914d, shape: "core"},
  payroll:    {color: 0xff914d, shape: "cube"},
  companies:  {color: 0x39e5d2, shape: "cube"},
  members:    {color: 0x539dff, shape: "sphere"},
  catalog:    {color: 0xa67bfa, shape: "core"},
  finance:    {color: 0x45dca1, shape: "ring"},
  sales:      {color: 0xff914d, shape: "core"},
  stock:      {color: 0x539dff, shape: "cube"},
  purchases:  {color: 0xff914d, shape: "cube"},
  benefits:   {color: 0x45dca1, shape: "sphere"},
  sst:        {color: 0xff914d, shape: "sphere"},
  training:   {color: 0xa67bfa, shape: "core"},
  performance:{color: 0x39e5d2, shape: "ring"},
  documents:  {color: 0x539dff, shape: "cube"},
  projects:   {color: 0xa67bfa, shape: "cube"},
  positions:  {color: 0xff914d, shape: "sphere"},
  support:    {color: 0x39e5d2, shape: "ring"}
};

function geometryForTheme(shape) {
  switch (shape) {
    case "sphere":
      return new THREE.IcosahedronGeometry(1.3, 2);

    case "cube":
      return new THREE.BoxGeometry(2.1, 2.1, 2.1);

    case "ring":
      return new THREE.TorusKnotGeometry(
        .95, .3, 100, 12, 2, 3
      );

    default:
      return new THREE.IcosahedronGeometry(1.3, 1);
  }
}

/* =========================================
   INICIAR THREE.JS GLOBAL
========================================= */

function startGlobal3D() {
  if (global3D || !global3DEnabled) return;

  let renderer;

  try {
    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: "default"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 1.4)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    global3DMount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      .1,
      100
    );

    camera.position.set(0, 0, 12);

    const ambient = new THREE.AmbientLight(
      0x83bacc, 1.25
    );

    scene.add(ambient);

    const cyanLight = new THREE.PointLight(
      0x39e5d2, 55
    );

    cyanLight.position.set(4, 5, 5);
    scene.add(cyanLight);

    const orangeLight = new THREE.PointLight(
      0xff914d, 42
    );

    orangeLight.position.set(-5, -4, 3);
    scene.add(orangeLight);

    const rig = new THREE.Group();
    rig.position.set(3.8, 0, -4);
    scene.add(rig);

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x39e5d2,
      metalness: .65,
      roughness: .22,
      transparent: true,
      opacity: .42,
      flatShading: true,
      clearcoat: 1
    });

    const core = new THREE.Mesh(
      geometryForTheme("core"),
      coreMaterial
    );

    rig.add(core);

    const wire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.7, 2),
      new THREE.MeshBasicMaterial({
        color: 0x7bffef,
        wireframe: true,
        transparent: true,
        opacity: .35
      })
    );

    rig.add(wire);

    const rings = [];

    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
          2.15 + i * .35,
          .012,
          8,
          110
        ),
        new THREE.MeshBasicMaterial({
          color: i === 1 ? 0xff914d : 0x39e5d2,
          transparent: true,
          opacity: .35
        })
      );

      ring.rotation.x = i * .65 + .4;
      ring.rotation.y = i * .3;

      rig.add(ring);
      rings.push(ring);
    }

    const count = window.innerWidth < 700
      ? 180
      : 500;

    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      positions[i * 3] =
        (Math.random() - .5) * 32;

      positions[i * 3 + 1] =
        (Math.random() - .5) * 22;

      positions[i * 3 + 2] =
        (Math.random() - .5) * 20;
    }

    const particleGeometry =
      new THREE.BufferGeometry();

    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const particles = new THREE.Points(
      particleGeometry,
      new THREE.PointsMaterial({
        color: 0x79e9ff,
        size: .035,
        transparent: true,
        opacity: .65
      })
    );

    scene.add(particles);

    const pointer = {x: 0, y: 0};
    const target = {x: 0, y: 0};

    function onPointer(event) {
      target.x =
        (event.clientX / window.innerWidth - .5) * 2;

      target.y =
        (event.clientY / window.innerHeight - .5) * 2;
    }

    window.addEventListener(
      "pointermove",
      onPointer,
      {passive: true}
    );

    function onResize() {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      rig.position.x =
        window.innerWidth < 700 ? 1.5 : 3.8;
    }

    window.addEventListener("resize", onResize);
    onResize();

    const clock = new THREE.Clock();

    global3D = {
      renderer,
      scene,
      camera,
      rig,
      core,
      wire,
      rings,
      particles,
      coreMaterial,
      pointer,
      target,
      clock,
      onPointer,
      onResize,
      frame: 0
    };

    function animate() {
      if (!global3D ||
          global3D.renderer !== renderer) {
        return;
      }

      const time = clock.getElapsedTime();

      pointer.x +=
        (target.x - pointer.x) * .04;

      pointer.y +=
        (target.y - pointer.y) * .04;

      if (!reducedMotion) {
        rig.rotation.y =
          time * .12 + pointer.x * .2;

        rig.rotation.x =
          Math.sin(time * .2) * .1 -
          pointer.y * .12;

        core.rotation.x = time * .16;
        core.rotation.y = time * .23;

        wire.rotation.y = -time * .1;

        rings.forEach((ring, i) => {
          ring.rotation.z =
            time * (.04 + i * .025);
        });

        particles.rotation.y = time * .002;
      }

      renderer.render(scene, camera);

      if (!reducedMotion) {
        global3D.frame =
          requestAnimationFrame(animate);
      }
    }

    animate();

  } catch (error) {
    console.warn("WebGL indisponível:", error);
    renderer?.dispose();
    renderer?.domElement?.remove();
    global3DEnabled = false;
  }
}

/* =========================================
   TROCAR OBJETO 3D CONFORME A PÁGINA
========================================= */

function set3DTheme(page) {
  if (!global3D) return;

  const theme = sceneThemes[page] ||
    sceneThemes.dashboard;

  const oldGeometry = global3D.core.geometry;

  global3D.core.geometry =
    geometryForTheme(theme.shape);

  oldGeometry.dispose();

  global3D.coreMaterial.color.setHex(
    theme.color
  );

  global3D.coreMaterial.needsUpdate = true;
}

/* =========================================
   DESLIGAR THREE.JS GLOBAL
========================================= */

function stopGlobal3D() {
  if (!global3D) return;

  const t = global3D;
  global3D = null;

  cancelAnimationFrame(t.frame);

  window.removeEventListener(
    "pointermove",
    t.onPointer
  );

  window.removeEventListener(
    "resize",
    t.onResize
  );

  t.scene.traverse(object => {
    object.geometry?.dispose();

    if (object.material) {
      const materials =
        Array.isArray(object.material)
          ? object.material
          : [object.material];

      materials.forEach(material => {
        material.dispose();
      });
    }
  });

  t.renderer.dispose();
  t.renderer.domElement.remove();
}

/* =========================================
   CONTROLE DO 3D
========================================= */

function toggleGlobal3D() {
  global3DEnabled = !global3DEnabled;

  if (global3DEnabled) {
    startGlobal3D();
    set3DTheme(S.page);
  } else {
    stopGlobal3D();
  }

  const button = $("global3DToggle");

  if (button) {
    button.textContent = global3DEnabled
      ? "◉ 3D ativo"
      : "○ Ativar 3D";
  }
}

    return false;

  if ([
    "employees",
    "leaves",
    "attendance",
    "recruitment"
  ].includes(page)) {
    return canReadHR();
  }

  if ([
    "payroll",
    "benefits",
    "sst",
    "training",
    "performance",
    "positions"
  ].includes(page)) {
    return isAdmin();
  }

  if ([

    "sales",
    "stock",
    "purchases",
    "documents",
    "projects",
    "support"
  ].includes(page)) {
    return canManageBusiness();
  }

  return true;
}

/* =========================================
   GRÁFICO DE LINHA
========================================= */

function lineChart(values) {
  const data = values.length ? values : [0];

  const width = 780;
  const height = 250;
  const left = 45;
  const top = 18;
  const bottom = 35;

  const max = Math.max(1, ...data);
  const plotWidth = width - left - 20;
  const plotHeight = height - top - bottom;

  const points = data.map((value, index) => {
    const x = left +
      (data.length === 1
        ? .5
        : index / (data.length - 1)) * plotWidth;

    const y = top +
      plotHeight -
      (Number(value) / max) * plotHeight;

    return [x, y];
  });

  const path = points.map((point, index) =>
    `${index ? "L" : "M"}${point[0]},${point[1]}`
  ).join(" ");

  const first = points[0];
  const last = points[points.length - 1];

  const area = `${path}
    L${last[0]},${top + plotHeight}
    L${first[0]},${top + plotHeight} Z`;

  return `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
      preserveAspectRatio="none"
      role="img"
      aria-label="Gráfico de evolução"
    >
      <defs>
        <linearGradient
          id="enterpriseChartFill"
          x1="0" y1="0" x2="0" y2="1"
        >
          <stop
            offset="0%"
            stop-color="#39e5d2"
            stop-opacity=".35"
          />
          <stop
            offset="100%"
            stop-color="#39e5d2"
            stop-opacity="0"
          />
        </linearGradient>
      </defs>

      ${[0, .25, .5, .75, 1].map(step => {
        const y = top + plotHeight * (1 - step);

        return `
          <line
            x1="${left}"
            y1="${y}"
            x2="${width - 20}"
            y2="${y}"
            stroke="#294052"
            stroke-dasharray="5 6"
          />
          <text
            x="5"
            y="${y + 4}"
            fill="#91a5bb"
            font-size="11"
          >
            ${Math.round(max * step)}
          </text>
        `;
      }).join("")}

      <path
        d="${area}"
        fill="url(#enterpriseChartFill)"
      />

      <path
        d="${path}"
        fill="none"
        stroke="#39e5d2"
        stroke-width="3"
        stroke-linejoin="round"
      />

      ${points.map(point => `
        <circle
          cx="${point[0]}"
          cy="${point[1]}"
          r="4"
          fill="#78fff0"
        />
      `).join("")}
    </svg>
  `;
}

/* =========================================
   GRÁFICO DE BARRAS
========================================= */

function bars(items) {
  if (!items.length) {
    return "<p>Sem dados cadastrados.</p>";
  }

  const max = Math.max(
    1,
    ...items.map(item => Number(item.value) || 0)
  );

  return items.map(item => {
    const value = Number(item.value) || 0;
    const percentage = Math.max(
      0,
      Math.min(100, value / max * 100)
    );

    return `
      <div class="bar">
        <span>${esc(item.label)}</span>

        <div class="track">
          <div
            class="fill"
            style="width:${percentage}%"
          ></div>
        </div>

        <b>${value}</b>
      </div>
    `;
  }).join("");
}

/* =========================================
   GRÁFICO DE DISTRIBUIÇÃO
========================================= */

function donut(items) {
  const colors = [
    "#539dff",
    "#ff914d",
    "#a67bfa",
    "#39e5d2",
    "#efc05b"
  ];

  const total = items.reduce(
    (sum, item) => sum + Number(item.value || 0),
    0
  );

  if (!total) {
    return "<p>Sem dados cadastrados.</p>";
  }

  let offset = 0;

  const stops = items.map((item, index) => {
    const start = offset;
    offset += Number(item.value || 0) / total * 100;

    return `${
      colors[index % colors.length]
    } ${start}% ${offset}%`;
  });

  return `
    <div class="donut-layout">
      <div
        class="donut"
        style="background:conic-gradient(${stops.join(",")})"
      ></div>

      <div class="legend">
        ${items.map((item, index) => `
          <div>
            <span style="color:${
              colors[index % colors.length]
            }">●</span>

            ${esc(item.label)}

            <strong>
              ${Math.round(
                Number(item.value || 0) / total * 100
              )}%
            </strong>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

========================================= */

function admissionSeries() {
  const result = [];
  const now = new Date();

  for (let i = 11; i >= 0; i--) {
    const date = new Date(
      now.getFullYear(),
      now.getMonth() - i,
      1
    );

    const prefix =
      date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0");

    result.push(
      S.employees.filter(employee =>
        String(employee.admission || "")
          .startsWith(prefix)
      ).length
    );
  }

  return result;
}

function departmentData() {
  const result = S.departments.map(department => ({
    label: department.name,
    value: S.employees.filter(employee =>
      employee.departmentId === department.id
    ).length
  })).filter(item => item.value > 0);

  const withoutDepartment = S.employees.filter(
    employee =>
      !employee.departmentId ||
      !S.departments.some(
        department =>
          department.id === employee.departmentId
      )
  ).length;

  if (withoutDepartment) {
    result.push({
      label: "Sem departamento",
      value: withoutDepartment
    });
  }

  return result;
}

function employeeName(id) {
  return S.employees.find(
    employee => employee.id === id
  )?.name || "Não encontrado";
}

function departmentName(id) {
  return S.departments.find(
    department => department.id === id
  )?.name || "Não definido";
}

function payrollForm(id = null) {
  if (!S.employees.length) {
    toast("Cadastre um colaborador primeiro.");
    return;
  }

  const record = S.payroll.find(
    item => item.id === id
  ) || {};

  modal(
    id ? "Editar lançamento" : "Lançamento de folha",
    `
      ${selectField(
        "Colaborador",
        "employeeId",
        S.employees.map(employee => ({
          value: employee.id,
          label: employee.name
        })),
        record.employeeId
      )}

      ${inputField(
        "Competência (AAAA-MM)",
        "period",
        record.period ||
          today().slice(0, 7),
        "month",
        true
      )}

      ${inputField(
        "Valor base",
        "base",
        record.base || "0",
        "number",
        true
      )}

      ${inputField(
        "Adicionais",
        "extra",
        record.extra || "0",
        "number"
      )}

      ${inputField(
        "Descontos",
        "deductions",
        record.deductions || "0",
        "number"
      )}
    `,
    async data => {
      if (!isAdmin()) {
        throw new Error("Sem permissão.");
      }

      for (const field of [
        "base",
        "extra",
        "deductions"
      ]) {
        const value = Number(data[field] || 0);

        if (!Number.isFinite(value) || value < 0) {
          throw new Error(
            "Informe valores válidos e não negativos."
          );
        }

        data[field] = value;
      }

      await saveRecord("payroll", data, id);
      await reload();
    }
  );
}

/* =========================================
   FORMATAÇÃO DOS CAMPOS
========================================= */

function enterpriseFieldValue(field, value) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  if ([
    "amount",
    "price",
    "budget",
    "salary"
  ].includes(field.name)) {
    return money(value);
  }

  if (field.type === "date") {
    return formatDate(value);
  }

  return String(value);
}

/* =========================================
   CAMPOS AUTOMÁTICOS DOS FORMULÁRIOS
========================================= */

function enterpriseFormFields(config, record = {}) {
  return config.fields.map(field => {
    const value = record[field.name] ?? "";

    if (field.type === "select") {
      return selectField(
        field.label,
        field.name,
        field.options,
        value
      );
    }

    return inputField(
      field.label,
      field.name,
      value,
      field.type || "text",
      field.required || false
    );
  }).join("");
}

   FORMULÁRIO UNIVERSAL
========================================= */

function enterpriseModuleForm(page, id = null) {
  const config = enterpriseModules[page];

  if (!config) {
    toast("Módulo não encontrado.");
    return;
  }

  if (!canManageBusiness()) {
    toast("Você não possui permissão.");
    return;
  }

  const records = S[config.collection] || [];

  const record = records.find(
    item => item.id === id
  ) || {};

  modal(
    id
      ? `Editar — ${config.title}`
      : `Novo registro — ${config.title}`,

    enterpriseFormFields(config, record),

    async data => {
      if (!canManageBusiness()) {
        throw new Error("Sem permissão.");
      }

      for (const field of config.fields) {
        if (
          field.required &&
          !String(data[field.name] ?? "").trim()
        ) {
          throw new Error(
            `Preencha o campo: ${field.label}`
          );
        }

        if (field.type === "number") {
          const raw = data[field.name];

          if (raw === "" || raw === undefined) {
            data[field.name] = 0;
          } else {
            const number = Number(raw);

            if (!Number.isFinite(number)) {
              throw new Error(
                `Número inválido: ${field.label}`
              );
            }

            data[field.name] = number;
          }
        }
      }

      if (
        page === "performance" &&
        (data.score < 0 || data.score > 10)
      ) {
        throw new Error(
          "A nota precisa estar entre 0 e 10."
        );
      }

      if (
        page === "projects" &&
        data.start &&
        data.deadline &&
        data.deadline < data.start
      ) {
        throw new Error(
          "O prazo final não pode ser anterior ao início."
        );
      }

      await saveRecord(
        config.collection,
        data,
        id
      );

      await reload();
    }
  );
}

/* =========================================
   PESQUISA DE REGISTROS
========================================= */

function filterEnterpriseRecords(page, term) {
  const config = enterpriseModules[page];

  if (!config) return [];

  const records = S[config.collection] || [];

  const search = String(term || "")
    .trim()
    .toLocaleLowerCase("pt-BR");

  if (!search) return records;

  return records.filter(record =>
    config.fields.some(field =>
      String(record[field.name] ?? "")
        .toLocaleLowerCase("pt-BR")
        .includes(search)
    )
  );
}

/* =========================================
   TABELA UNIVERSAL
========================================= */

function enterpriseTable(page, records) {
  const config = enterpriseModules[page];

  const fields = config.columns.map(name =>
    config.fields.find(field => field.name === name)
  ).filter(Boolean);

  return table(
    [
      ...fields.map(field => field.label),
      "Ações"
    ],

    records.map(record => `
      <tr>
        ${fields.map(field => `
          <td>
            ${esc(
              enterpriseFieldValue(
                field,
                record[field.name]
              )
            )}
          </td>
        `).join("")}

        <td>
          <button
            class="btn"
            type="button"
            data-enterprise-edit="${esc(record.id)}"
          >
            Editar
          </button>
        </td>
      </tr>
    `)
  );
}

/* =========================================
   INDICADORES FINANCEIROS
========================================= */

function financeSummary() {
  const records = S.finance || [];

  const received = records
    .filter(record =>
      record.type === "Receita" &&
      record.status === "Recebido"
    )
    .reduce(
      (sum, record) =>
        sum + Number(record.amount || 0),
      0
    );

  const paid = records
    .filter(record =>
      record.type === "Despesa" &&
      record.status === "Pago"
    )
    .reduce(
      (sum, record) =>
        sum + Number(record.amount || 0),
      0
    );

  const pending = records
    .filter(record =>
      record.status === "Pendente"
    )
    .length;

  return `
    <div class="stats">
      ${stat("Receitas recebidas", money(received))}
      ${stat("Despesas pagas", money(paid))}
      ${stat("Saldo registrado", money(received - paid))}
      ${stat("Pendências", pending)}
      ${stat("Lançamentos", records.length)}
    </div>
  `;
}

/* =========================================
   INDICADORES DE ESTOQUE
========================================= */

function stockSummary() {
  const records = S.stock || [];

  const lowStock = records.filter(record =>
    Number(record.quantity || 0) <=
    Number(record.minimum || 0)
  ).length;

  const totalItems = records.reduce(
    (sum, record) =>
      sum + Number(record.quantity || 0),
    0
  );

  const estimatedValue = records.reduce(
    (sum, record) =>
      sum +
      Number(record.quantity || 0) *
      Number(record.price || 0),
    0
  );

  return `
    <div class="stats">
      ${stat("Produtos", records.length)}
      ${stat("Unidades", totalItems)}
      ${stat("Estoque baixo", lowStock)}
      ${stat("Valor estimado", money(estimatedValue))}
    </div>
  `;
}

/* =========================================
   INDICADORES DE CRM
========================================= */

function salesSummary() {
  const records = S.sales || [];

  const won = records.filter(
    record => record.status === "Ganho"
  );

  const totalWon = won.reduce(
    (sum, record) =>
      sum + Number(record.amount || 0),
    0
  );

  const negotiation = records.filter(
    record => record.status === "Negociação"
  ).length;

  return `
    <div class="stats">
      ${stat("Oportunidades", records.length)}
      ${stat("Negociações", negotiation)}
      ${stat("Vendas ganhas", won.length)}
      ${stat("Valor ganho", money(totalWon))}
    </div>
  `;
}

/* =========================================
   RESUMO DE CADA MÓDULO
========================================= */

function enterpriseSummary(page) {
  switch (page) {
    case "finance":
      return financeSummary();

    case "stock":
      return stockSummary();

    case "sales":
      return salesSummary();

    default: {
      const config = enterpriseModules[page];
      const records = S[config.collection] || [];

      return `
        <div class="stats">
          ${stat(
            "Registros cadastrados",
            records.length,
            "FIREBASE"
          )}
        </div>
      `;
    }
  }
}

/* =========================================
   TELA UNIVERSAL DOS MÓDULOS
========================================= */

function enterpriseModulePage(page) {
  const config = enterpriseModules[page];

  if (!config) {
    $("view").innerHTML = panel(
      "Módulo indisponível",
      "<p>Este módulo não foi encontrado.</p>"
    );
    return;
  }

  if (!canManageBusiness()) {
    $("view").innerHTML = panel(
      "Acesso restrito",
      "<p>Você não possui permissão para este módulo.</p>"
    );
    return;
  }

  $("view").innerHTML = `
    ${futureBanner(page)}

    ${enterpriseSummary(page)}

    ${panel(
      config.title,
      `
        <p>${esc(config.description)}</p>

        <div
          style="
            display:flex;
            gap:10px;
            margin:15px 0;
            flex-wrap:wrap;
          "
        >
          <input
            id="enterpriseSearch"
            type="search"
            placeholder="Pesquisar registros..."
            aria-label="Pesquisar registros"
            style="flex:1;min-width:180px"
          >

          <button
            class="btn primary"
            id="enterpriseNew"
          >
            ＋ Novo registro
          </button>
        </div>

        <div id="enterpriseResults">
          ${enterpriseTable(
            page,
            S[config.collection] || []
          )}
        </div>
      `
    )}
  `;

  $("enterpriseNew").onclick = () => {
    enterpriseModuleForm(page);
  };

  function bindEditButtons() {
    document.querySelectorAll(
      "[data-enterprise-edit]"
    ).forEach(button => {
      button.onclick = () => {
        enterpriseModuleForm(
          page,
          button.dataset.enterpriseEdit
        );
      };
    });
  }

  bindEditButtons();

  $("enterpriseSearch").oninput = event => {
    const records = filterEnterpriseRecords(
      page,
      event.target.value
    );

    $("enterpriseResults").innerHTML =
      enterpriseTable(page, records);

    bindEditButtons();
  };
}

/* =========================================
   CATÁLOGO DE MÓDULOS
========================================= */

function enterpriseCatalog() {
  const modules = enterpriseMenuGroups
    .flatMap(group => group[1])
    .filter(item =>
      allowed(item[0]) &&
      item[0] !== "catalog"
    );

  $("view").innerHTML = `
    ${futureBanner("catalog")}

    <div class="notice">
      Selecione um módulo para abrir
      sua área de gerenciamento.
    </div>

    <div class="future-grid">
      ${modules.map(item =>
        moduleTile(
          item[0],
          item[1],
          item[2],
          enterprisePageInfo[item[0]]?.[1] || ""
        )
      ).join("")}

  `;

  bindModuleTiles();
}

   USUÁRIOS E PERFIS
========================================= */

/* =========================================
   ROTEADOR PRINCIPAL
========================================= */

function render() {
  if (!S.companyId) {
    return;
  }

  if (!allowed(S.page)) {
    S.page = "dashboard";
  }

  const pageInfo = enterprisePageInfo[S.page] ||
    enterprisePageInfo.dashboard;

  $("pageTitle").textContent = pageInfo[0];
  $("pageSubtitle").textContent = pageInfo[1];

  $("breadcrumb").textContent =
    pageInfo[0].toUpperCase();

  buildMenu();
  set3DTheme(S.page);

  switch (S.page) {
    case "dashboard":
      dashboard();
      break;

    case "hr":
      hrDashboard();
      break;

    case "employees":
      employeesPage();
      break;

    case "departments":
      departmentsPage();
      break;

    case "leaves":
      leavesPage();
      break;

    case "attendance":
      attendancePage();
      break;

    case "recruitment":
      recruitmentPage();
      break;

    case "payroll":
      payrollPage();
      break;

    case "companies":
      companiesPage();
      break;

    case "members":
      membersPage();
      break;

    case "catalog":
      enterpriseCatalog();
      break;

    default:
      if (enterpriseModules[S.page]) {
        enterpriseModulePage(S.page);
      } else {
        $("view").innerHTML = panel(
          "Página não encontrada",
          "<p>O módulo solicitado não existe.</p>"
        );
      }
  }
}

/* =========================================
   INICIALIZAÇÃO DA AUTENTICAÇÃO
========================================= */

onAuthStateChanged(auth, async user => {
  S.user = user;

  if (!user) {
    S.companies = [];
    S.companyId = "";
    S.role = "";
    S.page = "dashboard";

    stopGlobal3D();

    $("authScreen").classList.remove("hidden");
    $("appScreen").classList.add("hidden");

    return;
  }

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");

  if (global3DEnabled) {
    startGlobal3D();
  }

  try {
    await loadCompanies();
  } catch (error) {
    toast(errorText(error));

    $("view").innerHTML = panel(
      "Não foi possível carregar os dados",
      `
        <p>${esc(errorText(error))}</p>

        <button
          class="btn primary"
          id="retryLoad"
        >
          Tentar novamente
        </button>
      `
    );

    $("retryLoad").onclick = () => {
      loadCompanies().catch(error => {
        toast(errorText(error));
      });
    };
  }
});
